inputs:
  working-directory:
    required: false
    default: '.'
runs:
  using: composite
  steps:
    # Keep CI installs deterministic; dependency data updates must be committed to the lockfile.
    -
      name: Run `npm ci` with retries
      shell: bash # Required for correct argument passing (--)
      run: npm run install-deps -- --ci
      working-directory: ${{ inputs.working-directory }}
