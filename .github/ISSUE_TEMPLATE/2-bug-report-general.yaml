name: "Bug report: website"
description: Something on debloat.net does not work or looks wrong.
labels: [ 'bug' ]
title: '[Bug]: '
body:
  -
    type: markdown
    attributes:
      value: |-
        Thanks for reporting this. Fill in what you can; a partial report still helps.
  -
    type: textarea
    attributes:
      label: What happened?
      description: Describe the problem.
      placeholder: >-
        For example: "I cannot select any scripts after switching to Linux."
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: Steps to reproduce
      description: |-
        This is the most important part. A bug that cannot be reproduced cannot be fixed or verified.
      placeholder: |-
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: What did you expect?
      placeholder: >-
        For example: "The Linux scripts should be selectable."
    validations:
      required: true
  -
    type: input
    attributes:
      label: Browser and operating system
      placeholder: For example "Firefox 145 on Windows 11 25H2"
    validations:
      required: false
  -
    type: textarea
    attributes:
      label: Anything else?
      description: Screenshots, browser console output, or other context.
    validations:
      required: false
