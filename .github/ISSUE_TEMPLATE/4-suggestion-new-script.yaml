name: "Suggestion: new script"
description: A tweak that debloat.net should offer.
labels: [ 'enhancement' ]
title: '[New script]: '
body:
  -
    type: markdown
    attributes:
      value: |-
        Please read the [script guidelines](https://github.com/Turtlecute33/Privacy.sexy-Revamped/blob/master/docs/script-guidelines.md) first.
        A [pull request](https://github.com/Turtlecute33/Privacy.sexy-Revamped/blob/master/CONTRIBUTING.md#adding-or-changing-scripts) gets a script added faster.
  -
    type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - All of them
    validations:
      required: false
  -
    type: input
    attributes:
      label: Script name
      description: |-
        A name that says what the script does. See the [naming guidelines](https://github.com/Turtlecute33/Privacy.sexy-Revamped/blob/master/docs/script-guidelines.md#name).
      placeholder: For example "Disable error data submission"
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: Documentation and sources
      description: |-
        What the script changes, why it matters, and what it may break. Prefer vendor documentation.
        See the [documentation guidelines](https://github.com/Turtlecute33/Privacy.sexy-Revamped/blob/master/docs/script-guidelines.md#documentation).
      placeholder: >-
        For example: "This disables error data submission, see https://learn.microsoft.com/..."
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: Code
      description: |-
        The commands the script should run, if you know them. See the [code guidelines](https://github.com/Turtlecute33/Privacy.sexy-Revamped/blob/master/docs/script-guidelines.md#code).
      placeholder: |-
        For example: `reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v "AllowTelemetry" /t REG_DWORD /d 0 /f`
    validations:
      required: false
  -
    type: textarea
    attributes:
      label: Revert code
      description: |-
        The commands that restore the default. Leave blank if the change cannot be undone.
      placeholder: |-
        For example: `reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v "AllowTelemetry" /f`
    validations:
      required: false
  -
    type: input
    attributes:
      label: Suggested category
      description: Leave blank if unsure.
      placeholder: For example "Privacy cleanup > Clear system logs"
    validations:
      required: false
  -
    type: dropdown
    attributes:
      label: Recommendation level
      description: |-
        - **Standard**: safe for most people, keeps every app and service working.
        - **Strict**: more privacy at the cost of some functionality.
        - **None**: for advanced users or specific needs.

        Leave blank if unsure.
      options:
        - Standard
        - Strict
        - None (do not recommend)
    validations:
      required: false
  -
    type: textarea
    attributes:
      label: Anything else?
      description: Known side effects, open questions, or screenshots.
    validations:
      required: false
