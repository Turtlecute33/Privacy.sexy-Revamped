name: "Bug report: script"
description: A generated script failed, broke something, or does not do what its documentation says.
labels: [ 'bug' ]
title: '[Bug]: '
body:
  -
    type: markdown
    attributes:
      value: |-
        Thanks for reporting this. Fill in what you can; a partial report still helps.
  -
    type: textarea
    attributes:
      label: What happened?
      description: Name the tweak and describe what went wrong.
      placeholder: >-
        For example: "After running the cleanup script, music playback stopped working."
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: Steps to reproduce
      description: |-
        This is the most important part. A bug that cannot be reproduced cannot be fixed or verified.
      placeholder: |-
        1. Select '...'
        2. Download and run the script
        3. Open '...'
        4. See error
    validations:
      required: true
  -
    type: input
    attributes:
      label: Operating system and version
      description: |-
        Windows: Settings > System > About. macOS: Apple menu > About This Mac. Linux: run `lsb_release -a`.
      placeholder: For example "Windows 11 Pro 25H2 (build 26200)"
    validations:
      required: false
  -
    type: textarea
    attributes:
      label: Script and output
      description: |-
        If you can, attach the generated script and paste the terminal output.
        GitHub may block script attachments; a [GitHub Gist](https://gist.github.com/) link works too.
      placeholder: Attach the script or paste a Gist link, then paste the terminal output.
    validations:
      required: false
  -
    type: textarea
    attributes:
      label: Anything else?
      description: Screenshots, a proposed fix, related issues, or other context.
    validations:
      required: false
