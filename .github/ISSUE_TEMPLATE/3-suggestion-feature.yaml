name: "Suggestion: feature"
description: An idea to make debloat.net better.
labels: [ 'enhancement' ]
title: '[Feature]: '
body:
  -
    type: textarea
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
      placeholder: >-
        For example: "Every time I use the site, I struggle with..."
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: >-
        For example: "It would help if the site could..."
    validations:
      required: true
  -
    type: textarea
    attributes:
      label: Alternatives
      description: Other ways to solve it that you considered.
    validations:
      required: false
  -
    type: textarea
    attributes:
      label: Anything else?
      description: Screenshots, links, or other context.
    validations:
      required: false
