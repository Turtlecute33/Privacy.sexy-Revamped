# Checks the developer tooling scripts on every OS. They change rarely, so this runs only when those
# scripts change, or on demand.
#
# Pushes are limited to branches (`'**'`): GitHub does not apply `paths` filters to tag pushes, so
# without it every release tag ran the whole matrix even though no tooling file had changed.
name: checks.scripts

on:
  push:
    branches: [ '**' ]
    paths:
      - scripts/npm-install.js
      - scripts/configure_vscode.py
      - scripts/logo-update/**
      - img/logo.svg
      - .github/actions/install-imagemagick/**
      - .github/workflows/checks.scripts.yaml
  pull_request:
    paths:
      - scripts/npm-install.js
      - scripts/configure_vscode.py
      - scripts/logo-update/**
      - img/logo.svg
      - .github/actions/install-imagemagick/**
      - .github/workflows/checks.scripts.yaml
  workflow_dispatch:

# A newer push to the same branch makes the older run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icons-build:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos, ubuntu, windows]
      fail-fast: false # Still interested to see results from other combinations
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Install ImageMagick
        uses: ./.github/actions/install-imagemagick
      -
        name: Setup node
        uses: ./.github/actions/setup-node
      -
        name: Install dependencies
        uses: ./.github/actions/npm-install-dependencies
      -
        name: Create icons
        run: npm run icons:build

  # Each option of scripts/npm-install.js is covered once, on the OSes where it can behave
  # differently, instead of every option on every OS with and without node_modules (36 jobs, 12 on
  # macOS, which the free plan runs 5 at a time):
  # - The plain install, `--ci` and `--fresh` run on all three OSes: they install, and `--fresh`
  #   removes an existing node_modules first, which is where Windows differs (long paths, locks).
  # - `--no-errors` only changes npm's log level, so Ubuntu covers it.
  # - `--non-deterministic` deletes package-lock.json and installs whatever npm serves at that
  #   moment, so it fails when a just-published package has not reached every registry mirror yet
  #   (on 2026-11-10: "No matching version found for @puppeteer/browsers@3.2.7" on macOS and
  #   Windows, while Ubuntu passed). That says nothing about this repository, so the job reports
  #   such a failure without failing the run.
  install-deps:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.registry-dependent }}
    strategy:
      matrix:
        include:
          - { os: macos, install-command: npm run install-deps, install-deps-before: false, registry-dependent: false }
          - { os: ubuntu, install-command: npm run install-deps, install-deps-before: false, registry-dependent: false }
          - { os: windows, install-command: npm run install-deps, install-deps-before: false, registry-dependent: false }
          - { os: macos, install-command: npm run install-deps -- --ci, install-deps-before: false, registry-dependent: false }
          - { os: ubuntu, install-command: npm run install-deps -- --ci, install-deps-before: false, registry-dependent: false }
          - { os: windows, install-command: npm run install-deps -- --ci, install-deps-before: false, registry-dependent: false }
          - { os: macos, install-command: npm run install-deps -- --fresh, install-deps-before: true, registry-dependent: false }
          - { os: ubuntu, install-command: npm run install-deps -- --fresh, install-deps-before: true, registry-dependent: false }
          - { os: windows, install-command: npm run install-deps -- --fresh, install-deps-before: true, registry-dependent: false }
          - { os: ubuntu, install-command: npm run install-deps -- --no-errors, install-deps-before: false, registry-dependent: false }
          - { os: ubuntu, install-command: npm run install-deps -- --fresh --non-deterministic, install-deps-before: true, registry-dependent: true }
      fail-fast: false # Still interested to see results from other combinations
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Setup node
        uses: ./.github/actions/setup-node
      -
        name: Install dependencies
        if: matrix.install-deps-before == true
        uses: ./.github/actions/npm-install-dependencies
      -
        name: Run install-deps
        shell: bash # Required for correct argument passing (--)
        run: ${{ matrix.install-command }}

  configure-vscode:
    runs-on: ${{ matrix.os.name }}-latest
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - name: macos
            install-vscode-command: brew install --cask visual-studio-code
          # Not `snap install code`: snapd on the hosted runners can stall for hours (it hung a run
          # on 2026-11-10 until it was cancelled). The .deb from Microsoft installs in seconds.
          - name: ubuntu
            install-vscode-command: >-
              curl --fail --silent --show-error --location --retry 3
              --output "$RUNNER_TEMP/code.deb"
              'https://update.code.visualstudio.com/latest/linux-deb-x64/stable'
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes "$RUNNER_TEMP/code.deb"
          - name: windows
            install-vscode-command: choco install vscode
      fail-fast: false # Still interested to see results from other combinations
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Setup node
        uses: ./.github/actions/setup-python
      -
        name: Install VSCode
        if: matrix.os.name != 'windows'
        timeout-minutes: 10
        run: ${{ matrix.os.install-vscode-command }}
      -
        name: Install VSCode with retries
        if: matrix.os.name == 'windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Chocolatey's community feed throttles shared CI addresses and reports the
          # throttling as "package was not found", which fails the job even though the
          # package exists. Retrying turns that transient answer into a real result.
          foreach ($attempt in 1..3) {
            ${{ matrix.os.install-vscode-command }}
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Write-Host "Attempt $attempt failed to install VSCode, retrying in 30 seconds."
            Start-Sleep -Seconds 30
          }
          exit 1
      -
        name: Configure VSCode
        timeout-minutes: 10
        run: python3 ./scripts/configure_vscode.py
