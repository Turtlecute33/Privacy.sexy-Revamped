name: checks.security.sast

on:
  push:
    branches: [ '**' ] # Not tags: a release tag points at a commit its branch push already analyzed.
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # at 00:00 on every Sunday

# A newer push to the same branch makes the older analysis irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [
          javascript # analyzes code written in JavaScript, TypeScript and both.
        ]

    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      -
        name: Autobuild
        uses: github/codeql-action/autobuild@v4
      -
        name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
