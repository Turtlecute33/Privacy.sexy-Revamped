name: checks.security.dependencies

# Runs when the dependencies change, and weekly for advisories published since. Not on every push:
# a new advisory would otherwise turn every unrelated commit red until the dependency is updated.
on:
  push:
    branches: [ '**' ] # GitHub ignores `paths` on tag pushes, so without this every tag ran it.
    paths: [ 'package.json', 'package-lock.json' ]
  pull_request:
    paths: [ 'package.json', 'package-lock.json' ]
  schedule:
    - cron: '0 0 * * 0' # at 00:00 on every Sunday
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Setup node
        uses: ./.github/actions/setup-node
      -
        name: NPM audit
        run:  npm audit --omit=dev
