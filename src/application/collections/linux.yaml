                      'Favicons' 'Favicons-journal'
              -
                name: Clear Brave cookies
                docs: |-
                  Websites use cookies to keep you signed in and to recognize you, and advertising networks use them to
                  follow you across websites.

                  Brave stores cookies like Chromium does, in a database named `Cookies` [1]. On Linux, it stays in the
                  profile folder by default. Chromium moves network data such as cookies into a `Network` subfolder only
                  where that migration is turned on, which is the default on Windows [1] [2]. This script deletes both
                  locations in every profile, together with their `-journal` files.

                  > **Caution:** You are signed out of every website.

                  [1]: https://web.archive.org/web/20261109170443/https://chromium.googlesource.com/chromium/src/+/main/chrome/common/chrome_constants.h "chrome/common/chrome_constants.h - chromium/src - Git at Google | chromium.googlesource.com"
                  [2]: https://web.archive.org/web/20261109171036/https://chromium.googlesource.com/chromium/src/+/main/content/public/common/content_features.cc "content/public/common/content_features.cc - chromium/src - Git at Google | chromium.googlesource.com"
                call:
                  function: DeleteFromBraveProfiles
                  parameters:
                    profilePaths: "'Cookies' 'Cookies-journal' 'Network/Cookies' 'Network/Cookies-journal'"
      -
        category: Clear system and kernel usage data
        docs: |-
          Your system (operating system along with other software on it) and kernel store
          data that may reveal your behavior and can be considered sensitive. These scripts clean
          up the data that could potentially expose your user data.
        children:
          -
            name: Clear system crash report files
            docs: |-
              The `/var/crash` directory holds system crash dumps according to Filesystem Hierarchy Standard (FHS) [1].

              You may get reports on a system's boot when crash report files exist.
              When the `/var/crash` directory contains files, Apport will display notifications [2].
              This directory is then cleaned up by Apport using [`/etc/cron.daily/apport`](https://web.archive.org/web/20221029220300/https://www.apt-browse.org/browse/ubuntu/precise/main/all/apport/2.0.1-0ubuntu5/file/etc/cron.daily/apport) job [6].
              Read more: [Apport | Ubuntu Wiki](https://web.archive.org/web/20221029220354/https://wiki.ubuntu.com/Apport).

              The folder typically contains kernel crash dumps [3], but it can be used by other applications as well.
              E.g., the Debian package corekeeper stores user-space coredumps in subfolders of `/var/crash` [4].
              Some systems, such as Ubuntu also put userspace crashes in this folder [5].

              When using systemd to start services or processes, the crash logs are stored in the `/var/lib/systemd/coredump/`
              directory [7].

              [1]: https://web.archive.org/web/20221029145818/https://refspecs.linuxfoundation.org/FHS_2.3/fhs-2.3.html "Filesystem Hierarchy Standard | FHS | linuxfoundation.org"
              [2]: https://web.archive.org/web/20221029150025/https://support.starlabs.systems/kb/guides/disable-program-problem-reports "Disable program problem reports | Star Labs | support.starlabs.systems"
              [3]: https://web.archive.org/web/20221029150105/https://elinux.org/Crash_Diagnostics "Crash Diagnostics | eLinux.org"
              [4]: https://web.archive.org/web/20221029150118/https://packages.debian.org/unstable/main/corekeeper "Details of package corekeeper in sid | packages.debian.org"
              [5]: https://web.archive.org/web/20221029150311/https://wiki.ubuntu.com/AutomatedProblemReports "AutomatedProblemReports - Ubuntu Wiki | wiki.ubuntu.com"
              [6]: https://web.archive.org/web/20221029150331/https://bugs.launchpad.net/apport/+bug/357024 "Bug #357024 (pertian7) “security hole in /etc/cron.daily/apport” : Bugs : Apport | bugs.launchpad.net"
              [7]: https://web.archive.org/web/20221029211018/https://www.freedesktop.org/software/systemd/man/systemd-coredump.html "systemd-coredump | freedesktop.org"
            code: |-
              sudo rm -rfv /var/crash/*
              sudo rm -rfv /var/lib/systemd/coredump/
          -
            name: Clear system logs (`journald`)
            docs: |-
              journald is the part of systemd that captures, queries, and removes logs when needed [1].
              It allows removing logs by setting `--vacuum-time` [2].

              systemd is also known as "System and Service Manager" and is a suite of basic building blocks for a Linux system [3].
              systemd keeps files in two places: `/var/log/journal/` (persistently) and `/run/log/journal/` (volatilely, the data is lost when the system is rebooted) [4].

              > **Caution:** This action cannot be undone. System logs are the primary source for diagnosing boot failures,
              > service crashes and hardware faults, so clear them only when you no longer need them for troubleshooting.

              [1]: https://web.archive.org/web/20221029211624/https://docs.google.com/document/pub?id=1IC9yOXj7j6cdLLxWEBAGRL6wl97tFxgjLUEHIX3MSTs&pli=1 "Paper announcing journald | docs.google.com"
              [2]: https://web.archive.org/web/20221029150611/https://wiki.archlinux.org/title/Systemd/Journal#Clean_journal_files_manually "systemd/Journal - ArchWiki | Arch Linux documentation | archlinux.org | wiki.archlinux.org"
              [3]: https://web.archive.org/web/20221026211029/https://systemd.io/ "Systemd Homepage | systemd.io"
              [4]: https://web.archive.org/web/20221029150659/https://www.freedesktop.org/software/systemd/man/systemd-journald.service.html "systemd-journald.service | freedesktop.org"
            call:
              -
                function: RunIfCommandExists
                parameters:
                  command: journalctl
                  code: sudo journalctl --vacuum-time=1s
              -
                function: RunInlineCode
                parameters:
                  code: |-
                    sudo rm -rfv /run/log/journal/*
                    sudo rm -rfv /var/log/journal/*
      -
        category: Clear recently used files list
        docs: |-
          Revealing data about recent files used by a user has privacy risks, such as exposing
          your actions and files that you wish to keep private.
        children:
          -
            name: Clear GTK recently used files list
            docs: |-
              `recently-used.xbel` is part of the GTK+ toolkit [1] that's developed and used by GNOME [2].
              `GtkRecentManager` provides a facility for adding, removing, and looking up recently used files
              and acts like a database of all the recently used files [3].

              GTK is used by many GUI software. GNOME uses the GTK+ library [2], while KDE uses the QT library [4].
              `recently-used.xbel` is used by other third-party GTK 3 based applications such as Firefox,
              Visual Studio Code (and all other Electron applications [5]), Thunderbird…
              See also: [List of GTK applications | Wikipedia](https://web.archive.org/web/20221029221112/https://en.wikipedia.org/wiki/List_of_GTK_applications).

              [1]: https://web.archive.org/web/20221030164434/https://gitlab.gnome.org/GNOME/gtk/-/raw/1c3f179a20bf7537691216c28332f00c651a577f/gtk/gtkrecentmanager.c#L103 "Line 103 defines GTK_RECENTLY_USED_FILE as recently-used.xbel | GTK source code | gitlab.gnome.org"
              [2]: https://web.archive.org/web/20221029151059/https://gtk.org/ "GTK homepage | gtk.org"
              [3]: https://web.archive.org/web/20221029151529/https://www.gnu.org/software/guile-gnome/docs/gtk/html/GtkRecentManager.html "GtkRecentManager - Guile-Gtk | www.gnu.org"
              [4]: https://web.archive.org/web/20221029151457/https://www.qt.io/faq/3.2.-why-do-you-have-an-agreement-with-kde-about-your-licensing-what-kde-is-and-whats-the-history-of-qt-and-kde "What's the history of Qt and KDE? | qt.io"
              [5]: https://web.archive.org/web/20221029151534/https://github.com/electron/electron/issues/2927 "Consider replacing GTK2 w GTK3 in Linux builds · Issue #2927 · electron/electron | GitHub"
            code: |-
              # From global installations
              rm -fv ~/.recently-used.xbel
              rm -fv ~/.local/share/recently-used.xbel*
              # From snap packages
              rm -fv ~/snap/*/*/.local/share/recently-used.xbel
              # From Flatpak packages
              rm -fv ~/.var/app/*/data/recently-used.xbel
          -
            name: Clear KDE-tracked recently used items list
            docs: |-
              `.desktop` files are used by KDE to store recent documents and are exposed through an API [1].

              They are not only specific to the desktop environment, but also used by applications.
              Likewise, they are used by the KDE implementation of QT components, such as [QFileDialog](https://web.archive.org/web/20221029221146/https://doc.qt.io/qt-5/qfiledialog.html)
              ([KFileWidget](https://web.archive.org/web/20221029221152/https://api.kde.org/frameworks/kio/html/classKFileWidget.html)) [1].
              Furthermore, they are used by other [KDE apps](https://web.archive.org/web/20221029221245/https://apps.kde.org/) and can even be used by GTK applications [1].

              [1]: https://web.archive.org/web/20221029151634/https://api.kde.org/frameworks/kio/html/classKRecentDocument.html "KIO - KRecentDocument Class Reference | api.kde.org"
            code: |-
              # From global installations
              rm -rfv ~/.local/share/RecentDocuments/*.desktop
              rm -rfv ~/.kde/share/apps/RecentDocuments/*.desktop
              rm -rfv ~/.kde4/share/apps/RecentDocuments/*.desktop
              # From snap packages
              rm -rfv ~/snap/*/*/.local/share/RecentDocuments/*.desktop
              # From Flatpak packages
              rm -rfv ~/.var/app/*/data/RecentDocuments/*.desktop
          -
            name: Clear KDE activity history
            docs: |-
              KDE Plasma's activity manager (`kactivitymanagerd`) records which files and applications you open, and
              scores them by how often and how recently you used them [1]. Plasma uses this history for its lists of
              recent and frequently used items [2].

              The history is an SQLite database in `~/.local/share/kactivitymanagerd/resources/`, made of the files
              `database`, `database-wal` and `database-shm` [3]. This script deletes these files as your user. The
              database also holds the links that applications create between items and activities [4], which are
              deleted too.

              Use *Disable KDE activity tracking* to stop new entries from being recorded.

              > **Caution:** Sign out of Plasma before you run this script, for example from a text console. While you
              > are signed in, the activity manager keeps the database open and does not notice that it was deleted until
              > it restarts. Lists of recent and frequently used items are empty afterwards.

              [1]: https://invent.kde.org/plasma/kactivitymanagerd/-/raw/v6.8.2/src/service/plugins/sqlite/StatsPlugin.cpp "StatsPlugin.cpp (tag v6.8.2) | invent.kde.org"
              [2]: https://invent.kde.org/plasma/plasma-desktop/-/raw/v6.8.2/kcms/recentFiles/kactivitymanagerd_plugins_settings.kcfg "kactivitymanagerd_plugins_settings.kcfg (tag v6.8.2) | invent.kde.org"
              [3]: https://invent.kde.org/plasma/kactivitymanagerd/-/raw/v6.8.2/src/service/plugins/sqlite/Database.cpp "Database.cpp (tag v6.8.2) | invent.kde.org"
              [4]: https://invent.kde.org/plasma/kactivitymanagerd/-/raw/master/src/common/database/schema/ResourcesDatabaseSchema.cpp "ResourcesDatabaseSchema.cpp | invent.kde.org"
            call:
              function: RunAsTargetUser
              parameters:
                code: |-
                  kde_activity_directory="$HOME/.local/share/kactivitymanagerd/resources"
                  if [ ! -d "$kde_activity_directory" ]; then
                    echo "Skipping, \"$kde_activity_directory\" does not exist."
                  else
                    for kde_activity_file in database database-wal database-shm; do
                      kde_activity_path="$kde_activity_directory/$kde_activity_file"
                      if [ -e "$kde_activity_path" ] || [ -L "$kde_activity_path" ]; then
                        if ! run_as_target_user rm -fv -- "$kde_activity_path"; then
                          >&2 echo "Failed to delete \"$kde_activity_path\"."
                        fi
                      fi
                    done
                  fi
      -
        name: Empty trash
        docs: |-
          The trash location is standardized by [The FreeDesktop.org Trash specification](https://web.archive.org/web/20221029151648/https://specifications.freedesktop.org/trash-spec/trashspec-latest.html) [1].
          It uses the `$XDG_DATA_HOME/Trash` directory [1], which defaults to `$HOME/.local/share/Trash` [2].

          Flatpak applications may use the same trash using special APIs [3].
          However, Snap applications do not have an API to use the global trash [4].

          [1]: https://web.archive.org/web/20221029151648/https://specifications.freedesktop.org/trash-spec/trashspec-latest.html "The FreeDesktop.org Trash specification | freedesktop.org"
          [2]: https://web.archive.org/web/20221029151712/https://specifications.freedesktop.org/basedir-spec/basedir-spec-latest.html "XDG Base Directory Specification | freedesktop.org"
          [3]: https://web.archive.org/web/20221029151919/https://docs.flatpak.org/en/latest/portal-api-reference.html#gdbus-org.freedesktop.portal.Trash "Portal API Reference - Flatpak documentation | docs.flatpak.org"
          [4]: https://web.archive.org/web/20221029151931/https://bugs.launchpad.net/snapd/+bug/1787903 "Bug #1787903 “Snapped application can't access user's trash can” : Bugs : snapd | bugs.launchpad.net"
        code: |-
          # Empty global trash
          rm -rfv ~/.local/share/Trash/*
          sudo rm -rfv /root/.local/share/Trash/*
          # Empty Snap trash
          rm -rfv ~/snap/*/*/.local/share/Trash/*
          # Empty Flatpak trash (apps may not choose to use Portal API)
          rm -rfv ~/.var/app/*/data/Trash/*
      -
        category: Clear package manager data
        docs: |-
          Package managers store caches, statistics, and logs that may reveal data on how you use the package
          managers and software downloaded from them, such as your choice of software.
        children:
          -
            name: Clear YUM/RPM data
            docs: |-
              The Yellowdog Updater, Modified (YUM) is a free and open-source command-line package-management
              utility for computers running the Linux operating system using the RPM Package Manager [1].
              It has been shipped by default by distros such as Fedora, Rocky Linux, AlmaLinux, CentOS [2].

              YUM stores cached packages, header files, and metadata to determine the remote availability of packages,
              SQLite database cache, rpmdb cache [3]. Every YUM plugin may store its own cache [3]. `yum clean all`
              cleans all temporary files.

              See also: [Yum Package Manager homepage](https://web.archive.org/web/20221029221419/http://yum.baseurl.org/).

              [1]: https://web.archive.org/web/20221029152219/https://en.wikipedia.org/wiki/Yum_%28software%29 "Yum | Wikipedia | en.wikipedia.org"
              [2]: https://web.archive.org/web/20221029152251/https://webhome.phy.duke.edu/~rgb/General/yum_article/yum_article.pdf "YUM: Yellowdog Updater, Modified | www.phy.duke.edu"
              [3]: https://web.archive.org/web/20221029152334/https://linux.die.net/man/8/yum "yum: Yellowdog Updater Modified - Linux man page | linux.die.net"
            call:
              function: RunIfCommandExists
              parameters:
                command: yum
                code: yum clean all --enablerepo='*'
          -
            name: Clear DNF/RPM data
            docs: |-
              DNF or Dandified YUM is the next-generation version of YUM, a package manager for
              .rpm-based Linux distributions [1].
              It has been the default package manager since Fedora 22 in 2015, Red Hat Enterprise Linux 8,
              and OpenMandriva [1].

              DNF stores temporary files for repositories such as repository metadata, cache files
              generated from the repository metadata, and cached packages [2]. `dnf clean all` cleans
              all temporary files [2].

              [1]: https://web.archive.org/web/20221029152448/https://en.wikipedia.org/wiki/DNF_%28software%29 "DNF (software) | Wikipedia | en.wikipedia.org"
              [2]: https://web.archive.org/web/20221029152515/https://manpages.ubuntu.com/manpages/kinetic/en/man8/dnf.8.html "Ubuntu Manpage: dnf - DNF Command Reference | manpages.ubuntu.com"
            call:
              function: RunIfCommandExists
              parameters:
                command: dnf
                code: dnf clean all --enablerepo='*'
          -
            category: Clear Snap data
            docs: |-
              Snap is a software packaging and deployment system developed by Canonical [1].
              The packages are called snaps, and the tool for using them is called snapd [1].
              Snap is available on many distros and is supported out-of-the-box by distros
              such as Ubuntu, Kubuntu, Xubuntu, Manjaro, Zorin OS, KDE Neon and Solus among
              others [1].

              [1]: https://web.archive.org/web/20221029152606/https://en.wikipedia.org/wiki/Snap_%28software%29 "Snap | Wikipedia | en.wikipedia.org"
            children:
              -
                name: Clear Snap cache
                docs: |-
                  The Snap cache is stored at `/var/lib/snapd/cache/` [1].

                  Clearing the Snap cache is safe and can be done without causing any issues
                  while running Snap [2].

                  [1]: https://web.archive.org/web/20221029152638/https://github.com/snapcore/snapd/blob/76b081beee1899c573b42bf216b6e087656011e7/tests/main/auto-refresh-private/task.yaml#L74 "snapd source code | GitHub | github.com"
                  [2]: https://web.archive.org/web/20221029152651/https://forum.snapcraft.io/t/is-if-safe-for-me-to-remove-cache-files/7641/2 "Is if safe for me to remove cache files? - snapd - snapcraft.io | forum.snapcraft.io"
                code: sudo rm -rfv /var/lib/snapd/cache/*
              -
                name: Remove old Snap packages
                docs: |-
                  This script removes all disabled Snap packages.

                  Old and unused snaps get "disabled" by Snap. This is due to the snapd that keeps
                  multiple revisions of the same package [1].
                  Disabled state means that the binaries and services of the snap will no longer be available [2].
                  But all the data is still available, and the snap can easily be enabled again [2].

                  [1]: https://web.archive.org/web/20221029153110/https://forum.snapcraft.io/t/configure-number-of-old-revisions-to-keep/2337/7 "Configure number of old revisions to keep - snapd | forum.snapcraft.io"
                  [2]: https://web.archive.org/web/20221029153125/https://www.mankier.com/8/snap#Commands-disable "snap man page - snapd - System Administration | ManKier | www.mankier.com"
                call:
                  function: RunIfCommandExists
                  parameters:
                    command: snap
                    code: |-
                      snap list --all | while read name version rev tracking publisher notes; do
                        if [[ $notes = *disabled* ]]; then
                          sudo snap remove "$name" --revision="$rev";
                        fi
                      done
          -
            category: Clear Flatpak data
            docs: |-
              Flatpak, formerly known as xdg-app, is a utility for software deployment and package
              management for Linux [1]. It is supported out-of-the-box by many Linux distributions
              including CentOS, Clear Linux, elementary OS, Endless OS, Fedoora Workstation, Fedora
              Silverblue, Linux Mint, Pop! OS, PureOS, SteamOS, Ubuntu MATE and Zorin OS [1].

              [1]: https://web.archive.org/web/20221029153354/https://en.wikipedia.org/wiki/Flatpak "Flatpak - Wikipedia | en.wikipedia.org"
            children:
              -
                name: Remove orphaned Flatpak runtimes
                docs: |-
                  This script removes runtimes and extensions that are not used by installed
                  applications by running `flatpak uninstall --unused` [1].

                  Flatpak doesn't automatically remove a runtime after the last application that
                  depends on it is uninstalled [2]. This may cause issues with disk space or leave
                  hints about what software has been installed before.

                  This happens because when a Flatpak package is uninstalled, its runtime dependencies
                  are not automatically uninstalled, as `flatpak uninstall` can uninstall either an
                  application or runtime [3].

                  [1]: https://web.archive.org/web/20221029153522/https://docs.flatpak.org/en/latest/flatpak-command-reference.html#flatpak-uninstall "Flatpak Command Reference - Flatpak documentation | docs.flatpak.org"
                  [2]: https://web.archive.org/web/20221029153359/https://github.com/flatpak/flatpak/issues/2639 "[RFE] Auto remove orphaned runtimes · Issue #2639 · flatpak/flatpak | GitHub | github.com"
                  [3]: https://web.archive.org/web/20221029153507/https://docs.flatpak.org/en/latest/using-flatpak.html#troubleshooting "Using Flatpak - Flatpak documentation | docs.flatpak.org"
                # The system-wide installation is cleaned as root and your own installation as you. Without
                # `--system` or `--user`, root would also clean the installation in your home folder and leave
                # files there that you can no longer change.
                call:
                  function: RunAsTargetUser
                  parameters:
                    code: |-
                      if ! command -v flatpak > /dev/null 2>&1; then
                        echo 'Skipping because "flatpak" is not found.'
                      else
                        sudo flatpak uninstall --system --unused --noninteractive
                        run_as_target_user flatpak uninstall --user --unused --noninteractive
                      fi
              -
                name: Clear Flatpak cache
                docs: |-
                  This script clears the Flatpak cache.

                  Flatpak creates temporary files as `/var/tmp/flatpak-cache-*` [1].
                  These files can fill up a large portion of the disk [1], and reveal usage patterns.

                  Flatpak stores cache files in `~/.cache/flatpak/system-cache/` which replaces the directory
                  used in older versions (`~/.local/share/flatpak/system-cache/`) [2].

                  [1]: https://web.archive.org/web/20221029153602/https://github.com/flatpak/flatpak/issues/1119 "Prevent /var/tmp/flatpak-cache from piling up · Issue #1119 · flatpak/flatpak | GitHub | github.com"
                  [2]: https://web.archive.org/web/20221029153627/https://github.com/flatpak/flatpak/commit/1a49029f9d8fbee0338665522cf7432ae7485841 "Move caches to ~/.cache · flatpak/flatpak@1a49029 · GitHub | github.com"
                code: |-
                  # Temporary cache
                  sudo rm -rfv /var/tmp/flatpak-cache-*
                  # New cache
                  rm -rfv ~/.cache/flatpak/system-cache/*
                  # Old cache
                  rm -rfv ~/.local/share/flatpak/system-cache/*
          -
            category: Clear APT data
            docs: |-
              Advanced Package Tool (APT) is a free software user interface that works with
              core libraries to handle the installation and removal of software on Debian, and
              Debian-based Linux distributions [1].

              See also: [APT | Debian Wiki](https://web.archive.org/web/20221029221422/https://wiki.debian.org/Apt).

              [1]: https://web.archive.org/web/20221029153651/https://en.wikipedia.org/wiki/APT_%28software%29 "APT | Wikipedia"
            children:
              -
                name: Clear obsolete APT packages
                docs: |-
                  This script runs the `autoclean` command which removes package files that can no longer be downloaded,
                  and are largely useless [1]. This allows a cache to be maintained over a long period without it
                  growing out of control [1].

                  [1]: https://web.archive.org/web/20221029153705/https://manpages.ubuntu.com/manpages/jammy/en/man8/apt-get.8.html "Ubuntu Manpage: apt-get - APT package handling utility | manpages.ubuntu.com"
                call:
                  function: RunIfCommandExists
                  parameters:
                    command: apt-get
                    code: sudo apt-get autoclean
              -
                name: Clear APT package file lists
                docs: |-
                  This script removes package file lists. APT stores a copy of those files (in `/var/lib/apt/lists/`)
                  and searches are done within those local files to avoid going through the network for every search [1].

                  An `apt-get update` will repopulate the necessary information and recreate the list file [2].
                  The list files should be recreated as they get lost over time [2].

                  [1]: https://web.archive.org/web/20221029153731/https://www.debian.org/doc/manuals/debian-handbook/sect.apt-cache.en.html "6.3. The apt-cache Command | Debian Handbook | www.debian.org"
                  [2]: https://web.archive.org/web/20221029154335/https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=775163 "#775163 - apt pigs out in /var, particularly with multi-arch - Debian Bug report logs | bugs.debian.org"
                code: sudo rm -rfv /var/lib/apt/lists/*
              -
                name: Clear orphaned APT package dependencies
                docs: |-
                  This script runs the `autoremove` command, which removes packages that were automatically installed
                  to satisfy dependencies for other packages and are now no longer needed [1].

                  This script also purges removed packages, which means that the configuration files of the removed
                  packages are deleted too [1].

                  [1]: https://web.archive.org/web/20221029153705/https://manpages.ubuntu.com/manpages/jammy/en/man8/apt-get.8.html "Ubuntu Manpage: apt-get - APT package handling utility | manpages.ubuntu.com"
                call:
                  function: RunIfCommandExists
                  parameters:
                    command: apt-get
                    code: sudo apt-get -y autoremove --purge
              -
                name: Clear cache for APT packages
                docs: |-
                  This script runs the `clean` command. It clears out the local repository of retrieved package files [1],
                  meaning that it deletes downloaded packages (`.deb`) already installed (and no longer needed) [2].
                  It clears the whole `/var/cache/apt/archives/` directory that contains a copy of each downloaded `.deb` file [2].
                  It clears the cache but does not delete the lists [3].

                  [1]: https://web.archive.org/web/20221029153705/https://manpages.ubuntu.com/manpages/jammy/en/man8/apt-get.8.html "Ubuntu Manpage: apt-get - APT package handling utility | manpages.ubuntu.com"
                  [2]: https://web.archive.org/web/20221030163316/https://www.debian.org/doc/manuals/debian-handbook/sect.apt-get.en.html "6.2. aptitude, apt-get, and apt Commands | Debian Handbook | Debian"
                  [3]: https://web.archive.org/web/20221029154423/https://lists.debian.org/debian-user/2015/09/msg00024.html "Re: /var/lib/apt/lists/partial fills entire partition | Debian Issues"
                call:
                  function: RunIfCommandExists
                  parameters:
                    command: apt-get
                    code: sudo apt-get clean
      -
        category: Clear shared caches
        docs: |-
          The scripts in this category bulk delete all cache entries for the given scope.
          These scripts are designed to affect more than a single application and do a wide range of cleaning.
        children:
          -
            name: Clear user-specific cache
            docs: |-
              User-specific non-essential data is stored in `$XDG_CACHE_HOME`, which defaults to `$HOME/.cache` [1].
              Even though this data should be safe to delete, an application might still not comply with the standard
              and put anything in the cache folder, but this is very rare.

              This cache is used by both the operating system and different applications on it, e.g., used by KDE since v5.0 [2],
              pip (Python package manager) [3], or Google Chrome and Chromium-based browsers.
              Deleting this cache does not affect sandboxed applications, e.g., those that are installed using Snap or Flatpak.

              [1]: https://web.archive.org/web/20221029151712/https://specifications.freedesktop.org/basedir-spec/basedir-spec-latest.html "XDG Base Directory Specification | specifications.freedesktop.org"
              [2]: https://web.archive.org/web/20221029154505/https://wiki.archlinux.org/title/KDE#Clean_cache_to_resolve_upgrade_problems "KDE - ArchWiki | wiki.archlinux.org"
              [3]: https://web.archive.org/web/20221029154542/https://pip.pypa.io/en/stable/topics/caching/#default-paths "Caching - pip documentation v22.2.2 | pip.pypa.io"
              [4]: https://web.archive.org/web/20221029154556/https://chromium.googlesource.com/chromium/src/+/master/docs/user_data_dir.md#Linux "Chromium Docs - User Data Directory | chromium.googlesource.com"
            code: |-
              rm -rfv ~/.cache/*
              sudo rm -rfv /root/.cache/*
          -
            name: Clear Flatpak application cache
            docs: |-
              Non-essential user-specific data is stored in `~/.var/app/<app-id>/cache` by Flatpak applications [1].
              This directory points to `XDG_CACHE_HOME` [1] from the XDG base directory specification [2].

              [1]: https://web.archive.org/web/20221029154654/https://docs.flatpak.org/en/latest/conventions.html#xdg-base-directories "Requirements & Conventions - Flatpak documentation | docs.flatpak.org"
              [2]: https://web.archive.org/web/20221029151712/https://specifications.freedesktop.org/basedir-spec/basedir-spec-latest.html "XDG Base Directory Specification | specifications.freedesktop.org"
            code: rm -rfv ~/.var/app/*/cache/*
          -
            name: Clear Snap application cache
            docs: |-
              Application caches are isolated per application and stored in the `~/snaps/APP-NAME/VERSION/.cache`
              folders for Snap applications [1].

              [1]: https://web.archive.org/web/20221029154850/https://bugs.launchpad.net/snappy/+bug/1744584 "Bug #1744584 “Exclude Snap .cache from Dejadup backups” : Bugs : Snappy | bugs.launchpad.net/snappy"
            code: rm -rfv ~/snap/*/*/.cache/*
          -
            name: Clear thumbnails (icon cache)
            docs: |-
              Thumbnails are reduced-size versions of pictures or videos, used to help in recognizing and organizing
              them, serving the same role for images as a normal text index does for words [1].

              Depending on the program that processes the thumbnails, the "icons" are usually located either in the
              `~/.cache/thumbnails/` folder (e.g., Nautilus from GNOME does this [2] [3]) or the `~/.thumbnails/`
              directory [4].

              [1]: https://web.archive.org/web/20221029154942/https://en.wikipedia.org/wiki/Thumbnail "Thumbnail - Wikipedia | en.wikipedia.org"
              [2]: https://web.archive.org/web/20221029154933/https://wiki.archlinux.org/title/GNOME/Files#Thumbnails "GNOME/Files - ArchWiki | wiki.archlinux.org"
              [3]: https://web.archive.org/web/20221030163411/https://gitlab.gnome.org/GNOME/nautilus/-/issues/1237 "Unable to generate thumbnails (#1237) · Issues · GNOME / Files · GitLab | gitlab.gnome.org"
              [4]: https://web.archive.org/web/20221029155859/https://bugs.kde.org/show_bug.cgi?id=79943 "79943 - It should be possible to limit the amount of disk space used by thumbnails (.thumbnails directory) | bugs.kde.org"
            code: |-
              rm -rfv ~/.thumbnails/*
              rm -rfv ~/.cache/thumbnails/*
      -
        name: Clear screenshots
        docs: |-
          GNOME's default screenshot folder (as seen in Pop!_OS and Elementary OS) is `~/Pictures/Screenshots/` [1].
          Flameshot also uses the same default folder as GNOME [2].
          Despite being GNOME-based, Ubuntu changes this default to `~/Pictures/` with files that
          look like "`Screenshot from ***.png`" [3].

          KDE ([Spectacle](https://web.archive.org/web/20221029221516/https://apps.kde.org/spectacle/))
          saves screenshots in the `~/Pictures/` folder with the default name format of
          `Screenshot_%Y%M%D_%H%m%S.**` [4].

          Other applications use different paths, e.g. ksnip uses `ksnip_$Y$M$D-$T.png` by
          default in the home folder [5].

          This script only looks at those default folders, and not inside their subfolders. The pictures
          folder is the one your desktop reports through `xdg-user-dir`, and `~/Pictures` if it reports
          none. In it, the script deletes files named like the screenshots above (`Screenshot from *.png`
          and `Screenshot_*`), every file directly inside its `Screenshots` folder, and `ksnip_*` files
          directly inside your home folder.

          > **Caution:** Deleted files are not moved to the trash and cannot be recovered. Any file directly
          > inside the `Screenshots` folder is deleted, even if a screenshot tool did not create it. Screenshots
          > that you saved elsewhere, or that use a translated folder name or file name, are not deleted.

          [1]: https://web.archive.org/web/20221030163430/https://gitlab.gnome.org/GNOME/gnome-shell/-/issues/1950 "Save screenshots to dedicated Screenshots folder (#1950) · Issues · GNOME / gnome-shell | gitlab.gnome.org"
          [2]: https://web.archive.org/web/20221029155930/https://github.com/flameshot-org/flameshot/blob/fa6164bedf683d4deb9c879563506310908280bf/README.md#on-kde-plasma-desktop "flameshot/README.md · flameshot-org/flameshot | GitHub"
          [3]: https://web.archive.org/web/20221029160024/https://help.ubuntu.com/stable/ubuntu-help/screen-shot-record.html "Screenshots and screencasts | help.ubuntu.com"
          [4]: https://web.archive.org/web/20221029160018/https://docs.kde.org/stable5/en/spectacle/spectacle/ch04s02.html "Configure | docs.kde.org"
          [5]: https://web.archive.org/web/20221029160052/https://github.com/ksnip/ksnip/blob/89b7f3f1f5efc0c62797c091e985dc70be17e347/src/backend/config/Config.cpp#L232-L241 "ksnip/Config.cpp · ksnip/ksnip | GitHub"
        # Only the tools' own default folders, one level deep, regular files only, deleted as the invoking
        # user. `find ~ -name 'ksnip_*'` walked the whole home folder as root (mounted drives, backups and
        # the trash included), and the `~/Pictures` searches deleted matching files in every subfolder.
        call:
          function: RunAsTargetUser
          parameters:
            code: |-
              pictures_directory="$HOME/Pictures"
              if command -v xdg-user-dir > /dev/null 2>&1; then
                xdg_pictures_directory="$(run_as_target_user xdg-user-dir PICTURES 2>/dev/null)"
                # `xdg-user-dir` prints the home folder itself when no pictures folder is configured.
                if [ -n "$xdg_pictures_directory" ] && [ "$xdg_pictures_directory" != "$HOME" ] \
                    && [ -d "$xdg_pictures_directory" ]; then
                  pictures_directory="$xdg_pictures_directory"
                fi
              fi
              # GNOME Shell 42 and later, Spectacle on Plasma 6, Flameshot: <Pictures>/Screenshots
              if [ -d "$pictures_directory/Screenshots" ]; then
                run_as_target_user find -H "$pictures_directory/Screenshots" -maxdepth 1 -type f \
                  -exec rm -fv -- {} +
              fi
              # gnome-screenshot (e.g. Screenshot from 2022-08-20 02-46-41.png) and Spectacle on Plasma 5
              # (e.g. Screenshot_20220927_205646.png): <Pictures>
              if [ -d "$pictures_directory" ]; then
                run_as_target_user find -H "$pictures_directory" -maxdepth 1 -type f \
                  \( -name 'Screenshot from *.png' -o -name 'Screenshot_*' \) -exec rm -fv -- {} +
              fi
              # ksnip (e.g. ksnip_20220927-195151.png): the home folder
              run_as_target_user find -H "$HOME" -maxdepth 1 -type f -name 'ksnip_*' -exec rm -fv -- {} +
  -
    category: Disable OS data collection
    docs: |-
      All operating systems collect data. This is part of their work. Sometimes, this data has
      high privacy implications, especially when it is submitted to third parties. Some Linux
      distributions come with out-of-the-box data collection and submission. Most of the time,
      this data collection is opt-in, but not necessarily always.

      Data collection and telemetry is not always a bad thing, and can help developers provide
      better software that can compete with proprietary and much more privacy-invasive alternatives.
    children:
      -
        category: Disable GNOME data collection
        docs: |-
          GNOME is the default desktop environment of many Linux distributions, including Debian, Fedora,
          Ubuntu and Red Hat Enterprise Linux [1].

          It exposes privacy-related preferences through GSettings [2], a configuration system that stores
          per-user settings in a database called dconf [2]. These scripts change those preferences for the
          user who runs the script.

          Settings that do not exist on the current system are skipped, so these scripts are safe to run on
          systems that do not use GNOME.

          [1]: https://web.archive.org/web/20240720021226/https://en.wikipedia.org/wiki/GNOME "GNOME - Wikipedia | en.wikipedia.org"
          [2]: https://web.archive.org/web/20240404013714/https://manpages.ubuntu.com/manpages/jammy/man1/gsettings.1.html "gsettings manual page | manpages.ubuntu.com"
        children:
          -
            name: Disable GNOME software usage statistics
            recommend: standard
            docs: |-
              This script stops GNOME from collecting and sending statistics about which software you use.

              When enabled, GNOME Software submits a report of installed and used applications to a central
              server [1]. The data is used to produce popularity information for the software catalogue [1].

              Some distributions, notably Ubuntu, enable this setting by default [1].

              If you do not run this script, your application usage continues to be reported.

              [1]: https://web.archive.org/web/20240523104715/https://gitlab.gnome.org/GNOME/gnome-software/-/blob/main/data/org.gnome.software.gschema.xml "org.gnome.software.gschema.xml | GNOME GitLab | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.desktop.privacy
                key: send-software-usage-stats
                value: 'false'
          -
            name: Disable GNOME technical problem reports
            recommend: standard
            docs: |-
              This script stops GNOME from automatically sending technical problem reports.

              When enabled, crashes and other technical problems are submitted to the distribution vendor,
              along with information about your system and the program that failed [1]. Crash reports can
              contain memory contents, file paths and command-line arguments.

              This setting is enabled by default [1].

              If you do not run this script, technical problem reports continue to be submitted automatically.

              [1]: https://web.archive.org/web/20240523105320/https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/master/schemas/org.gnome.desktop.privacy.gschema.xml.in "org.gnome.desktop.privacy.gschema.xml.in | GNOME GitLab | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.desktop.privacy
                key: report-technical-problems
                value: 'false'
          -
            name: Disable GNOME location services
            recommend: standard
            docs: |-
              This script disables the GNOME geolocation service.

              When enabled, applications can ask GNOME for your physical location, which is determined using
              nearby Wi-Fi networks and your IP address through the Mozilla Location Service [1].

              If you do not run this script, applications can continue to request your location. Individual
              applications still need your permission, but the service itself remains available.

              [1]: https://web.archive.org/web/20240523105945/https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/master/schemas/org.gnome.system.location.gschema.xml.in "org.gnome.system.location.gschema.xml.in | GNOME GitLab | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.system.location
                key: enabled
                value: 'false'
          -
            name: Disable GNOME recent files history
            recommend: strict # Removes the "Recent" file list, which some users rely on
            docs: |-
              This script stops GNOME from recording the files you have recently opened.

              GNOME keeps a list of recently used files and shows it in the "Recent" section of the Files
              application and in the file chooser of many programs [1]. The list reveals which documents you
              opened and when.

              This setting is enabled by default [1]. Use it together with *Clear recently used files list* to
              also remove the entries that were already recorded.

              > **Consideration:** After running this script, the "Recent" list stays empty and applications can
              > no longer offer your recently opened documents.

              [1]: https://web.archive.org/web/20240523105320/https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/master/schemas/org.gnome.desktop.privacy.gschema.xml.in "org.gnome.desktop.privacy.gschema.xml.in | GNOME GitLab | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.desktop.privacy
                key: remember-recent-files
                value: 'false'
          -
            name: Disable GNOME application usage history
            recommend: strict # Reduces the quality of application search results
            docs: |-
              This script stops GNOME from recording which applications you use and how often.

              GNOME keeps application usage data to order search results and to populate the list of frequently
              used applications [1]. This builds a profile of your habits on the local system.

              This setting is enabled by default [1].

              > **Consideration:** After running this script, application search results are no longer ordered by
              > how often you use them.

              [1]: https://web.archive.org/web/20240523105320/https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/master/schemas/org.gnome.desktop.privacy.gschema.xml.in "org.gnome.desktop.privacy.gschema.xml.in | GNOME GitLab | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.desktop.privacy
                key: remember-app-usage
                value: 'false'
      -
        category: Disable KDE data collection
        docs: |-
          KDE Plasma is a desktop environment. These scripts change Plasma's settings for the user who runs the
          script, with Plasma's own configuration tools (`kwriteconfig6` or `kwriteconfig5`). They are skipped on
          systems without these tools.
        children:
          -
            name: Disable KDE activity tracking
            recommend: strict # Lists of recent and frequently used files and applications stop updating
            docs: |-
              This script stops KDE Plasma from recording which files and applications you use.

              Plasma's activity manager (`kactivitymanagerd`) records the files and applications you open, and scores
              them by how often and how recently you used them [1]. It keeps this history for 4 months by default [2].
              The "Recent Files" settings page decides what it remembers: all applications, only specific ones, or
              nothing [2].

              This script selects "Do not remember" by setting `what-to-remember` to `2` in
              `~/.config/kactivitymanagerd-pluginsrc` [2] [3]. With this value, the activity manager discards new events
              instead of recording them [1]. Reverting restores the value that was set before, or removes it if there
              was none.

              Plasma 6.5 and earlier pick up the change right away [4]. Plasma 6.6 and later do so when
              `kwriteconfig6` supports its `--notify` option, which KDE Frameworks 6.11 added [5] [6], and otherwise
              after you sign out and back in.

              The history that was already recorded is kept. Use *Clear KDE activity history* to delete it.

              > **Consideration:** Lists of recent and frequently used files and applications in Plasma stop updating.

              If you do not run this script, Plasma keeps recording which files and applications you use.

              [1]: https://invent.kde.org/plasma/kactivitymanagerd/-/raw/v6.8.2/src/service/plugins/sqlite/StatsPlugin.cpp "StatsPlugin.cpp (tag v6.8.2) | invent.kde.org"
              [2]: https://invent.kde.org/plasma/plasma-desktop/-/raw/v6.8.2/kcms/recentFiles/kactivitymanagerd_plugins_settings.kcfg "kactivitymanagerd_plugins_settings.kcfg (tag v6.8.2) | invent.kde.org"
              [3]: https://invent.kde.org/plasma/kactivitymanagerd/-/raw/v6.8.2/src/service/plugins/sqlite/StatsPlugin.h "StatsPlugin.h (tag v6.8.2) | invent.kde.org"
              [4]: https://invent.kde.org/plasma/kactivitymanagerd/-/raw/v6.4.0/src/service/Config.cpp "Config.cpp (tag v6.4.0) | invent.kde.org"
              [5]: https://invent.kde.org/plasma/kactivitymanagerd/-/commit/bea4c0e96a966720f682b9ed111247d1405aaceb "Use KConfigWatcher to monitor config changes | invent.kde.org"
              [6]: https://invent.kde.org/frameworks/kconfig/-/commit/6d85a0009c17aad86acf4ff9ccdaa0a96a6640db "kwriteconfig: Add a flag to notify | invent.kde.org"
            call:
              function: RunAsTargetUser
              parameters:
                code: |-
                  kde_config_file='kactivitymanagerd-pluginsrc'
                  kde_config_group='Plugin-org.kde.ActivityManager.Resources.Scoring'
                  kde_config_key='what-to-remember'
                  kde_config_value='2' # 0 remembers all applications, 1 only specific ones, 2 none
                  kde_absent_value='privacy.sexy-absent'
                  kde_state_file="$target_home/.local/state/privacy.sexy/kde/what-to-remember"
                  kde_write_command=''
                  kde_read_command=''
                  for kde_version in 6 5; do
                    if [ -z "$kde_write_command" ] && command -v "kwriteconfig$kde_version" > /dev/null 2>&1 \
                        && command -v "kreadconfig$kde_version" > /dev/null 2>&1; then
                      kde_write_command="kwriteconfig$kde_version"
                      kde_read_command="kreadconfig$kde_version"
                    fi
                  done
                  kde_write_options=()
                  # `--notify` lets a running Plasma 6.6 or later pick up the change; older tools do not have it.
                  if [ -n "$kde_write_command" ] \
                      && run_as_target_user "$kde_write_command" --help 2>/dev/null | grep --quiet -- '--notify'; then
                    kde_write_options=(--notify)
                  fi
                  if [ -z "$kde_write_command" ]; then
                    echo 'Skipping because "kwriteconfig6" or "kwriteconfig5" is not found.'
                  else
                    kde_current_value="$(run_as_target_user "$kde_read_command" --file "$kde_config_file" \
                      --group "$kde_config_group" --key "$kde_config_key" --default "$kde_absent_value")"
                    if [ "$kde_current_value" = "$kde_config_value" ]; then
                      echo 'Skipping, KDE activity tracking already remembers no applications.'
                    else
                      kde_recorded_now='false'
                      if [ ! -e "$kde_state_file" ] && run_as_target_user install --directory --mode=700 "${kde_state_file%/*}" \
                          && printf '%s' "$kde_current_value" | run_as_target_user tee "$kde_state_file" > /dev/null; then
                        run_as_target_user chmod 600 "$kde_state_file"
                        kde_recorded_now='true'
                      fi
                      if [ ! -e "$kde_state_file" ]; then
                        >&2 echo 'Skipping, could not record the original KDE activity tracking setting.'
                      elif run_as_target_user "$kde_write_command" "${kde_write_options[@]}" --file "$kde_config_file" \
                          --group "$kde_config_group" --key "$kde_config_key" "$kde_config_value"; then
                        echo 'Successfully disabled KDE activity tracking.'
                      else
                        if [ "$kde_recorded_now" = 'true' ]; then
                          run_as_target_user rm -f -- "$kde_state_file"
                        fi
                        >&2 echo 'Failed to disable KDE activity tracking.'
                      fi
                    fi
                  fi
                revertCode: |-
                  kde_config_file='kactivitymanagerd-pluginsrc'
                  kde_config_group='Plugin-org.kde.ActivityManager.Resources.Scoring'
                  kde_config_key='what-to-remember'
                  kde_config_value='2' # 0 remembers all applications, 1 only specific ones, 2 none
                  kde_absent_value='privacy.sexy-absent'
                  kde_state_file="$target_home/.local/state/privacy.sexy/kde/what-to-remember"
                  kde_write_command=''
                  kde_read_command=''
                  for kde_version in 6 5; do
                    if [ -z "$kde_write_command" ] && command -v "kwriteconfig$kde_version" > /dev/null 2>&1 \
                        && command -v "kreadconfig$kde_version" > /dev/null 2>&1; then
                      kde_write_command="kwriteconfig$kde_version"
                      kde_read_command="kreadconfig$kde_version"
                    fi
                  done
                  kde_write_options=()
                  # `--notify` lets a running Plasma 6.6 or later pick up the change; older tools do not have it.
                  if [ -n "$kde_write_command" ] \
                      && run_as_target_user "$kde_write_command" --help 2>/dev/null | grep --quiet -- '--notify'; then
                    kde_write_options=(--notify)
                  fi
                  if [ ! -e "$kde_state_file" ]; then
                    echo 'Skipping, no original KDE activity tracking setting recorded by privacy.sexy was found.'
                  elif [ -z "$kde_write_command" ]; then
                    >&2 echo 'Cannot revert because "kwriteconfig6" or "kwriteconfig5" is not found.'
                  elif [ "$(run_as_target_user "$kde_read_command" --file "$kde_config_file" --group "$kde_config_group" \
                      --key "$kde_config_key" --default "$kde_absent_value")" != "$kde_config_value" ]; then
                    >&2 echo 'Skipping revert because KDE activity tracking changed after privacy.sexy applied it.'
                  else
                    kde_previous_value="$(run_as_target_user cat -- "$kde_state_file")"
                    if [ "$kde_previous_value" = "$kde_absent_value" ]; then
                      kde_restore_arguments=(--delete)
                    else
                      kde_restore_arguments=("$kde_previous_value")
                    fi
                    if run_as_target_user "$kde_write_command" "${kde_write_options[@]}" --file "$kde_config_file" \
                        --group "$kde_config_group" --key "$kde_config_key" "${kde_restore_arguments[@]}"; then
                      run_as_target_user rm -f -- "$kde_state_file"
                      echo 'Restored the original KDE activity tracking setting.'
                    else
                      >&2 echo 'Failed to restore the original KDE activity tracking setting.'
                    fi
                  fi
      -
        category: Disable Debian telemetry
        docs: |-
          Debian, also known as Debian GNU/Linux, is a Linux distribution composed of free and open-source
          software, developed by the community-supported Debian Project [1].
          Debian-based distributions include Ubuntu, Kali Linux, MX Linux, Pardus, Parrot OS, PureOS,
          Raspberry Pi OS, TAILS, and others [2].

          Debian contains some telemetry client libraries, and some packages depend or build-depend on them [3].
          Some pre-installed packages send data or facilitate sending data, which may risk your privacy to some
          extent [4].

          [1]: https://web.archive.org/web/20221029160202/https://en.wikipedia.org/wiki/Debian "Debian - Wikipedia | en.wikipedia.org"
          [2]: https://web.archive.org/web/20221029160241/https://en.wikipedia.org/wiki/List_of_Linux_distributions#Ubuntu-based "List of Linux distributions - Wikipedia | en.wikipedia.org"
          [3]: https://web.archive.org/web/20221029160255/https://wiki.debian.org/PrivacyIssues#Telemetry_libraries "Privacy Issues | Debian Wiki | wiki.debian.org"
          [4]: https://web.archive.org/web/20221030133248/https://www.debian.org/legal/privacy "Debian -- Privacy Policy | www.debian.org"
        children:
          -
            category: Disable sending of package statistics (popcon)
            docs: |-
              Popularity Contest (or popcon) collects statistical data to determine which packages are the most popular [1].
              It sends a list of packages installed and the access and change times of relevant files to the server via email
              in different distros such as Debian and Ubuntu [2].

              `popularity-contest` package sets up a cron job that will periodically anonymously submit statistical data
              to the Debian developers about the statistics of the most used Debian packages on the system [3]. It also sends
              data about the system architecture and the version of popularity-contest [4].

              Communication is encrypted but with the right configuration and software, but if that's not the case, communication
              can be eavesdropped as it does not use HTTPS but HTTP [4].

              Statistics are publicly accessible and can be seen online:
              - [Ubuntu](https://web.archive.org/web/20220816072409/https://popcon.ubuntu.com/)
              - [Debian](https://web.archive.org/web/20221029221738/https://popcon.debian.org/)

              See also: [popularity-contest source code | debian.org](https://web.archive.org/web/20221030163518/https://salsa.debian.org/popularity-contest-team/popularity-contest).

              [1]: https://web.archive.org/web/20221029160500/https://help.ubuntu.com/community/UbuntuPopularityContest "UbuntuPopularityContest - Community Help Wiki | help.ubuntu.com"
              [2]: https://web.archive.org/web/20221029160506/https://manpages.debian.org/testing/popularity-contest/popularity-contest.8.en.html "popularity-contest - Debian testing | Debian Manpages"
              [3]: https://web.archive.org/web/20221029160859/https://packages.debian.org/buster/popularity-contest "Debian - Details of package popularity-contest in buster | packages.debian.org"
              [4]: https://web.archive.org/web/20221029160841/https://popcon.debian.org/FAQ "FAQ | popcon | popcon.debian.org"
            children:
              -
                name: Disable participation in Popularity Contest
                recommend: standard
                docs: |-
                  `popularity-contest` checks `/etc/popularity-contest.conf` for the value of `PARTICIPATE` to send data [1].
                  Configuring this configuration allows you to opt out of the submission of data [1].

                  [1]: https://web.archive.org/web/20221029161047/https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=172824 "#172824 - popularity-contest: dpkg-reconfigure popularity-contest does not include PARTICIPATE=yes - Debian Bug report logs | bugs.debian.org"
                # ❗️ The original `PARTICIPATE` line is recorded before it is changed, following the same
                #   `/var/lib/privacy.sexy/state` convention as `PersistSystemEnvironmentVariable` and
                #   `DisableCronjob`. An earlier revert rewrote every `PARTICIPATE=no` to
                #   `PARTICIPATE=yes` unconditionally, so reverting turned package-list submission ON for
                #   users who had it off before they ever ran privacy.sexy.
                code: |-
                  config_file='/etc/popularity-contest.conf'
                  popcon_state_dir='/var/lib/privacy.sexy/state'
                  popcon_state_file="$popcon_state_dir/popularity-contest-participate"
                  if [ ! -f "$config_file" ]; then
                    echo "Skipping because configuration file at ($config_file) is not found. Is popcon installed?"
                  else
                    if [ ! -e "$popcon_state_file" ]; then
                      sudo install -d -m 700 "$popcon_state_dir"
                      original_line="$(grep -m1 '^[[:space:]]*PARTICIPATE' "$config_file" || true)"
                      if [ -n "$original_line" ]; then
                        printf '%s\n' "$original_line" | sudo tee "$popcon_state_file" > /dev/null
                      else
                        printf 'absent\n' | sudo tee "$popcon_state_file" > /dev/null
                      fi
                      sudo chmod 600 "$popcon_state_file"
                    fi
                    if grep -q '^[[:space:]]*PARTICIPATE' "$config_file"; then
                      sudo sed -i '/^[[:space:]]*PARTICIPATE/c\PARTICIPATE=no' "$config_file"
                    else
                      printf 'PARTICIPATE=no\n' | sudo tee -a "$config_file" > /dev/null
                    fi
                    echo 'Successfully opted out of Popularity Contest submissions.'
                  fi
                revertCode: |-
                  config_file='/etc/popularity-contest.conf'
                  popcon_state_file='/var/lib/privacy.sexy/state/popularity-contest-participate'
                  if [ ! -f "$config_file" ]; then
                    echo "Skipping because configuration file ($config_file) is not found. Is popcon installed?"
                  elif [ ! -e "$popcon_state_file" ]; then
                    echo 'Skipping, no original Popularity Contest setting recorded by privacy.sexy was found.'
                  else
                    original_line="$(cat "$popcon_state_file")"
                    if [ "$original_line" = 'absent' ]; then
                      sudo sed -i '/^[[:space:]]*PARTICIPATE/d' "$config_file"
                      echo 'Successfully removed the PARTICIPATE setting, as it was absent originally.'
                    else
                      sudo sed -i "/^[[:space:]]*PARTICIPATE/c\\$original_line" "$config_file"
                      echo "Successfully restored the original setting: $original_line"
                    fi
                    sudo rm -f "$popcon_state_file"
                  fi
              -
                name: Remove Popularity Contest (`popcon`) package
                docs: |-
                  This script deletes the `popularity-contest` package.
                  This package submits to the Debian developers statistics about the most used Debian packages on the system [1].
                  According to community reports, deleting this package does not have any side effects [2].

                  [1]: https://web.archive.org/web/20221029161449/https://packages.debian.org/sid/popularity-contest "Debian -- Details of package popularity-contest in sid | packages.debian.org"
                  [2]: https://web.archive.org/web/20221029161049/https://askubuntu.com/questions/84831/removing-popularity-contest-without-trashing-the-system "apt - Removing popularity-contest without trashing the system? - Ask Ubuntu | askubuntu.com"
                call:
                  function: UninstallAptPackage
                  parameters:
                    packageName: popularity-contest
              -
                name: Remove daily cron entry for Popularity Contest (popcon)
                recommend: strict
                docs: |-
                  Normally, `popularity-contest` is run from a cron job, `/etc/cron.daily/popularity-contest` [1].
                  This job automatically submits the results to package maintainers once a week [1].

                  This script disables the cronjob, thus the automatic submission, but manually running `popularity-contest`
                  would still send data.

                  [1]: https://web.archive.org/web/20221029160506/https://manpages.debian.org/testing/popularity-contest/popularity-contest.8.en.html "popularity-contest - Debian testing | Debian Manpages | manpages.debian.org"
                call:
                  function: DisableCronjob
                  parameters:
                    jobName: popularity-contest
      -
        category: Disable Arch Linux telemetry
        docs: |-
          Arch Linux is an independently developed, x86-64 general-purpose Linux distribution that strives to
          provide the latest stable versions of most software by following a rolling-release model [1]. The default
          installation is a minimal base system, configured by the user to only add what is specifically required.

          [1]: https://web.archive.org/web/20221029161747/https://en.wikipedia.org/wiki/Arch_Linux "Arch Linux | Wikipedia | en.wikipedia.org"
        children:
          -
            category: Disable `pkgstats` that collects installed package list (opt-in)
            docs: |-
              `pkgstats` sends a list of all installed packages, the architecture, and the mirror you are using to
              the Arch Linux project [1]. It stores personally identifiable information such as IP addresses for
              one month [2] and then anonymizes and aggregates the data [1] [2].

              [1]: https://web.archive.org/web/20221029161806/https://wiki.archlinux.org/title/Pkgstats "pkgstats - ArchWiki | wiki.archlinux.org"
              [2]: https://web.archive.org/web/20221029161821/https://pkgstats.archlinux.de/privacy-policy "Privacy policy | pkgstats | pkgstats.archlinux.de"
            children:
              -
                name: Remove `pkgstats` package
                docs: |-
                  `pkgstats` package submits a list of installed packages to the Arch Linux project [1].
                  It's available in the Arch Linux repository [1].
                  The package enables a timer to send data periodically [2].

                  [1]: https://web.archive.org/web/20221029161948/https://archlinux.org/packages/extra/x86_64/pkgstats/ "Arch Linux - pkgstats 3.2.6-1 (x86_64) | archlinux.org"
                  [2]: https://web.archive.org/web/20221029161923/https://bugs.archlinux.org/task/51510?project=1&string=pkgstats "FS#51510 : [pkgstats] do not enable pkgstats.timer during install | bugs.archlinux.org"
                call:
                  function: UninstallPacmanPackage
                  parameters:
                    packageName: pkgstats
              -
                name: Disable weekly `pkgstats` submission
                recommend: standard
                docs: |-
                  `pkgstats` is set up to automatically run every week using systemd/timers [1]. Once disabled,
                  the data will only be sent once manually invoked [1]. The weekly timer is named `pkgstats.timer` [2].

                  The package turns the timer on itself [3], through a link in
                  `/usr/lib/systemd/system/timers.target.wants`, and the timer has no install section [4].
                  `systemctl disable` therefore cannot turn it off (it reports the timer as `static`), and the timer
                  would start again at the next boot. This script stops and masks the timer instead, and reverting
                  unmasks it and starts it again if it was running.

                  [1]: https://web.archive.org/web/20221029161806/https://wiki.archlinux.org/title/Pkgstats "pkgstats - ArchWiki | wiki.archlinux.org"
                  [2]: https://web.archive.org/web/20221029162027/https://pkgstats.archlinux.de/ "Arch Linux package statistics | pkgstats.archlinux.de"
                  [3]: https://web.archive.org/web/20221029161923/https://bugs.archlinux.org/task/51510?project=1&string=pkgstats "FS#51510 : [pkgstats] do not enable pkgstats.timer during install | bugs.archlinux.org"
                  [4]: https://github.com/archlinux-de/pkgstats-cli/blob/3.5.7/justfile "pkgstats-cli justfile (version 3.5.7) | github.com"
                call:
                  function: MaskSystemdUnit
                  parameters:
                    unitName: pkgstats.timer
      -
        category: Disable Zorin OS telemetry
        docs: |-
          Zorin OS is a Linux distribution based on Ubuntu [1].
          It is customized to help users transition from Windows and macOS easily [1].

          [1]: https://web.archive.org/web/20221029162035/https://en.wikipedia.org/wiki/Zorin_OS "Zorin OS - Wikipedia | en.wikipedia.org"
        children:
          -
            name: Disable Zorin OS census pings
            docs: |-
              Zorin OS pings Zorin OS servers [1].
              It sends pings on an hourly basis [2].
              It sends a unique ID, the operating system version, the number of user accounts and the city and country the user is in [3].
              It can be disabled by deleting the `zorin-os-census` package [1].

              [1]: https://web.archive.org/web/20221029162136/https://zorin.com/legal/privacy/ "Privacy Policy - Zorin | zorin.com"
              [2]: https://web.archive.org/web/20221029162148/https://launchpad.net/~zorinos/+archive/ubuntu/stable/+sourcepub/7408190/+listing-archive-extra "Zorin OS source code | launchpad.net"
              [3]: https://web.archive.org/web/20221029162231/https://launchpadlibrarian.net/425925849/zorin-os-census_1.1~zorinos15_1.2.diff.gz "Zorin OS source code | launchpad.net"
            call:
              function: UninstallAptPackage
              parameters:
                packageName: zorin-os-census
          -
            name: Remove Zorin OS census unique ID
            docs: |-
              Census submits a unique ID associated with the installation when pings are sent [1].
              Removing the identifier reduces the risk of your computer being identified.

              [1]: https://web.archive.org/web/20221029162231/https://launchpadlibrarian.net/425925849/zorin-os-census_1.1~zorinos15_1.2.diff.gz "Zorin OS source code | launchpad.net"
            code: sudo rm -fv '/var/lib/zorin-os-census/uuid'
            revertCode: |-
              if [ -f /var/lib/zorin-os-census/uuid ]; then
                echo 'Skipping, uuid already exists.'
              elif [ ! -d /var/lib/zorin-os-census ]; then
                echo 'Skipping, Zorin OS census is not installed.'
              else
                uuidgen | sudo tee /var/lib/zorin-os-census/uuid > /dev/null
              fi
      -
        category: Disable Ubuntu telemetry
        docs: |-
          Ubuntu is a Linux distribution based on Debian and composed mostly of free and open-source software [1].
          Ubuntu, along with its upstream Debian, has many official (Kubuntu, Lubuntu, Ubuntu Studio…) and unofficial
          (elementary OS, KDE neon, Linux Mint, Pop! OS, Zorin OS…) derivatives [2].

          [1]: https://web.archive.org/web/20221029162338/https://en.wikipedia.org/wiki/Ubuntu "Ubuntu - Wikipedia | en.wikipedia.org"
          [2]: https://web.archive.org/web/20221029160241/https://en.wikipedia.org/wiki/List_of_Linux_distributions#Ubuntu-based "List of Linux distributions - Wikipedia | en.wikipedia.org"
        children:
          -
            name: Disable Ubuntu MOTD News requests
            recommend: standard
            docs: |-
              Ubuntu's `motd-news` hook periodically contacts Canonical and sends the Ubuntu version,
              OS name, kernel version, architecture, uptime, cloud identity, curl version, and the
              connection's IP metadata to retrieve a tailored login message [1].

              This script uses Canonical's documented `ENABLED=0` control. It changes the setting only
              when the installed `50-motd-news` hook supports `/etc/default/motd-news`, records the exact
              original file bytes and metadata, and restores them on revert. Login notices produced by
              other MOTD hooks, including package and security-update counts, remain available.

              [1]: https://ubuntu.com/legal/motd "MOTD Information | Ubuntu and Canonical Legal"
            code: |-
              motd_config='/etc/default/motd-news'
              motd_hook='/etc/update-motd.d/50-motd-news'
              motd_state_dir='/var/lib/privacy.sexy/state'
              motd_state_archive="$motd_state_dir/motd-news.tar"
              if [ ! -f "$motd_hook" ] || ! grep --fixed-strings --quiet "$motd_config" "$motd_hook"; then
                echo 'Skipping, the installed MOTD News hook does not use /etc/default/motd-news.'
              elif [ -L "$motd_config" ]; then
                >&2 echo 'Skipping, /etc/default/motd-news is a symbolic link and will not be replaced.'
              elif [ -e "$motd_state_archive" ]; then
                echo "Original MOTD News state is already recorded at \"$motd_state_archive\"."
              else
                sudo install --directory --mode=700 "$motd_state_dir"
                if [ -e "$motd_config" ]; then # Preserve the original file.
                  sudo tar --create --file="$motd_state_archive" --acls --xattrs --numeric-owner --absolute-names "$motd_config"
                else
                  sudo tar --create --file="$motd_state_archive" --files-from=/dev/null
                fi
                temporary_file="$(mktemp)"
                if [ -e "$motd_config" ]; then # Seed the edited copy.
                  sudo cat "$motd_config" > "$temporary_file"
                fi
                if grep --quiet '^[[:space:]]*ENABLED=' "$temporary_file"; then
                  sed --in-place 's/^[[:space:]]*ENABLED=.*/ENABLED=0/' "$temporary_file"
                else
                  printf '\nENABLED=0\n' >> "$temporary_file"
                fi
                if sudo install --owner=root --group=root --mode=644 "$temporary_file" "$motd_config"; then
                  echo 'Disabled Ubuntu MOTD News requests.'
                else
                  >&2 echo 'Failed to update the MOTD News configuration.'
                fi
                rm --force "$temporary_file"
              fi
            revertCode: |-
              motd_config='/etc/default/motd-news'
              motd_state_dir='/var/lib/privacy.sexy/state'
              motd_state_archive="$motd_state_dir/motd-news.tar"
              if [ ! -e "$motd_state_archive" ]; then
                echo 'Skipping, no MOTD News state recorded by privacy.sexy was found.'
              else
                current_value="$(sed --silent 's/^[[:space:]]*ENABLED=//p' "$motd_config" 2>/dev/null | tail --lines=1)"
                if [ "$current_value" != '0' ]; then
                  >&2 echo 'Skipping revert because MOTD News was changed after privacy.sexy applied it.'
                elif sudo tar --list --file="$motd_state_archive" | grep --quiet .; then
                  if sudo tar --extract --file="$motd_state_archive" --acls --xattrs --numeric-owner --absolute-names; then
                    sudo rm --force "$motd_state_archive"
                    echo 'Restored the original MOTD News configuration.'
                  else
                    >&2 echo 'Failed to restore the original MOTD News configuration.'
                  fi
                elif sudo rm --force "$motd_config"; then
                  sudo rm --force "$motd_state_archive"
                  echo 'Removed the MOTD News configuration created by privacy.sexy.'
                else
                  >&2 echo 'Failed to remove the MOTD News configuration.'
                fi
              fi
          -
            category: Disable metrics reporting in Ubuntu
            docs: |-
              `ubuntu-report` reports hardware and other collected metrics like installer or upgrade information [1].

              Reported data includes but is not limited to [2]:
              - The Ubuntu version and its flavor,
              - Whether there is network connectivity,
              - CPU family,
              - RAM,
              - Disk(s) size,
              - Screen(s) resolution,
              - GPU model and manufacturer,
              - OEM manufacturer,
              - Location (based on the location selection made by the user at install),
              - Installation duration (time taken),
              - Whether auto-login is enabled,
              - Selected disk layout,
              - Whether third-party software is selected,
              - Whether to download updates during installation,
              - Whether LivePatch is enabled.

              See also:
              - [Source code for the Ubuntu Report tool | github.com](https://web.archive.org/web/20221029221854/https://github.com/ubuntu/ubuntu-report/)
              - [Statistics gathered and visualized | ubuntu.com/desktop/statistics](https://web.archive.org/web/20221029221910/https://ubuntu.com/desktop/statistics)
              - [ubuntu-devel mailing list thread where ubuntu-report was first proposed | lists.ubuntu.com](https://web.archive.org/web/20221029162523/https://lists.ubuntu.com/archives/ubuntu-devel/2018-February/040139.html)

              [1]: https://web.archive.org/web/20221029162505/https://github.com/ubuntu/ubuntu-report/blob/30e902ebc17e4e10d83392d7cd3dc05fc9e35cc4/README.md "ubuntu-report/README.md at master · ubuntu/ubuntu-report | github.com"
              [2]: https://web.archive.org/web/20221029162538/https://github.com/ubuntu/ubuntu-report/blob/8e6030ff9bbeacacf41a9b58ea638a5c9a6f864d/README.md "More diagnostics data from desktop | lists.ubuntu.com"
            children:
              -
                name: Disable participation in metrics reporting in Ubuntu
                recommend: standard
                docs: |-
                  This script uses the `ubuntu-report` CLI to opt you out of data submission [1].

                  Alternatively, one can opt out during the installation of Ubuntu [2].

                  [1]: https://web.archive.org/web/20221029162538/https://github.com/ubuntu/ubuntu-report/blob/8e6030ff9bbeacacf41a9b58ea638a5c9a6f864d/README.md#synopsis-1 "ubuntu-report/README.md at 8e6030ff9bbeacacf41a9b58ea638a5c9a6f864d · ubuntu/ubuntu-report | GitHub"
                  [2]: https://web.archive.org/web/20221029162523/https://lists.ubuntu.com/archives/ubuntu-devel/2018-February/040139.html "More diagnostics data from desktop | lists.ubuntu.com"
                call:
                  function: RunIfCommandExists
                  parameters:
                    command: ubuntu-report
                    code: |-
                      if ubuntu-report -f send no; then
                        echo 'Successfully opted out.'
                      else
                        >&2 echo 'Failed to opt out.'
                      fi
                    revertCode: |-
                      if ubuntu-report -f send yes; then
                        echo 'Successfully opted in.'
                      else
                        >&2 echo 'Failed to opt in.'
                      fi
              -
                name: Remove Ubuntu Report tool (`ubuntu-report`)
                docs: |-
                  `ubuntu-report` is installed as an apt package and can be uninstalled in this way [1].
                  Once uninstalled, the `send` command [2] will not function and therefore no data will be collected.

                  [1]: https://web.archive.org/web/20221029162615/https://packages.ubuntu.com/bionic/ubuntu-report "Ubuntu - Details of package ubuntu-report in bionic | packages.ubuntu.com"
                  [2]: https://web.archive.org/web/20221029162538/https://github.com/ubuntu/ubuntu-report/blob/8e6030ff9bbeacacf41a9b58ea638a5c9a6f864d/README.md#ubuntu-report-send "ubuntu-report/README.md at 8e6030ff9bbeacacf41a9b58ea638a5c9a6f864d · ubuntu/ubuntu-report | GitHub"
                call:
                  function: UninstallAptPackage
                  parameters:
                    packageName: ubuntu-report
          -
            name: Disable participation in Ubuntu Insights
            recommend: standard
            docs: |-
              Ubuntu Insights reports information about your computer to Canonical. It replaces Ubuntu Report
              (`ubuntu-report`) [1] [2], and Ubuntu 25.10 and later include it [2]. A report contains details such as
              your computer's manufacturer and model, processor, graphics, memory and disk sizes, screens, time zone,
              language and desktop session [1], and it is collected once per month [2].

              Participation is opt-in [2]. Ubuntu Insights keeps your answer per user and per kind of report in
              `~/.config/ubuntu-insights` [1], and Settings offers it as "Send a system report every month" and "Send a
              system report when upgrading to a new Ubuntu version" [3]. Without a recorded answer, nothing is sent [4].

              This script withdraws your consent for every kind of report you agreed to, with `ubuntu-insights
              consent` [1]. It leaves reports that you never answered or already declined untouched, because declining
              makes Ubuntu Insights send a short opt-out notice instead of the report [4]. Reverting gives your consent
              again for exactly the reports this script withdrew it from.

              If you do not run this script and you agreed to Ubuntu Insights, it keeps sending a system report every
              month.

              [1]: https://github.com/ubuntu/ubuntu-insights "GitHub - ubuntu/ubuntu-insights | github.com"
              [2]: https://web.archive.org/web/20261002100821/https://discourse.ubuntu.com/t/ubuntu-insights-how-telemetry-is-changing-on-ubuntu-desktop/73442 "Ubuntu Insights - How telemetry is changing on Ubuntu Desktop - Desktop - Ubuntu Discourse | discourse.ubuntu.com"
              [3]: https://web.archive.org/web/20261109164303/https://salsa.debian.org/gnome-team/gnome-control-center/-/raw/ubuntu/resolute/debian/patches/ubuntu/telemetry-Repurpose-diagnostics-panel-for-all-telemetry-a.patch "telemetry-Repurpose-diagnostics-panel-for-all-telemetry-a.patch (ubuntu/resolute) | salsa.debian.org"
              [4]: https://github.com/ubuntu/ubuntu-insights/blob/main/insights/internal/uploader/upload.go "ubuntu-insights/insights/internal/uploader/upload.go at main · ubuntu/ubuntu-insights · GitHub | github.com"
            call:
              function: RunAsTargetUser
              parameters:
                code: |-
                  insights_consent_dir="$HOME/.config/ubuntu-insights"
                  insights_state_dir="$target_home/.local/state/privacy.sexy/ubuntu-insights"
                  if ! command -v ubuntu-insights > /dev/null 2>&1; then
                    echo 'Skipping because "ubuntu-insights" is not found.'
                  else
                    insights_agreed='false'
                    for insights_consent_file in "$insights_consent_dir"/*-consent.toml; do
                      if [ ! -f "$insights_consent_file" ] \
                          || ! grep --quiet '^[[:space:]]*consent_state[[:space:]]*=[[:space:]]*true[[:space:]]*$' "$insights_consent_file"; then
                        continue # No consent file, or not agreed
                      fi
                      insights_agreed='true'
                      insights_source="${insights_consent_file##*/}"
                      insights_source="${insights_source%-consent.toml}"
                      if ! run_as_target_user install --directory --mode=700 "$insights_state_dir" \
                          || ! run_as_target_user touch "$insights_state_dir/$insights_source"; then
                        >&2 echo "Skipping \"$insights_source\", could not record that you had agreed to it."
                      elif run_as_target_user ubuntu-insights consent "$insights_source" --state=false; then
                        echo "Withdrew consent for Ubuntu Insights reports from \"$insights_source\"."
                      else
                        run_as_target_user rm -f -- "$insights_state_dir/$insights_source"
                        >&2 echo "Failed to withdraw consent for Ubuntu Insights reports from \"$insights_source\"."
                      fi
                    done
                    if [ "$insights_agreed" = 'false' ]; then
                      echo 'Skipping, you have not agreed to any Ubuntu Insights report.'
                    fi
                  fi
                revertCode: |-
                  insights_consent_dir="$HOME/.config/ubuntu-insights"
                  insights_state_dir="$target_home/.local/state/privacy.sexy/ubuntu-insights"
                  if [ ! -d "$insights_state_dir" ]; then
                    echo 'Skipping, privacy.sexy did not withdraw any Ubuntu Insights consent.'
                  elif ! command -v ubuntu-insights > /dev/null 2>&1; then
                    >&2 echo 'Cannot revert because "ubuntu-insights" is not found.'
                  else
                    for insights_state_file in "$insights_state_dir"/*; do
                      if [ ! -f "$insights_state_file" ]; then
                        continue # Nothing was recorded
                      fi
                      insights_source="${insights_state_file##*/}"
                      insights_consent_file="$insights_consent_dir/$insights_source-consent.toml"
                      if ! grep --quiet '^[[:space:]]*consent_state[[:space:]]*=[[:space:]]*false[[:space:]]*$' "$insights_consent_file" 2>/dev/null; then
                        >&2 echo "Skipping \"$insights_source\" because its consent changed after privacy.sexy withdrew it."
                      elif run_as_target_user ubuntu-insights consent "$insights_source" --state=true; then
                        run_as_target_user rm -f -- "$insights_state_file"
                        echo "Gave consent again for Ubuntu Insights reports from \"$insights_source\"."
                      else
                        >&2 echo "Failed to give consent again for Ubuntu Insights reports from \"$insights_source\"."
                      fi
                    done
                    run_as_target_user rmdir -- "$insights_state_dir" 2>/dev/null || true
                  fi
          -
            category: Disable Ubuntu error tracker
            docs: |-
              Ubuntu's error tracker explains crashes, hangs, and other severe errors to end users; lets
              them report an error; and collects these reports and shares them with Ubuntu [1]. Error reports
              are also accessible to trusted Ubuntu developers who are not employed by Canonical [1].

              See [the Ubuntu error tracker | errors.ubuntu.com](https://web.archive.org/web/20221029221957/https://errors.ubuntu.com/) that shows error
              statistics to the public.

              [1]: https://web.archive.org/web/20221029162649/https://wiki.ubuntu.com/ErrorTracker
            children:
              -
                category: Disable creating crash reports to send (Apport)
                docs: |-
                  Apport intercepts program crashes, collects debugging information about the
                  crash and the operating system environment, and sends it to bug trackers in a
                  standardized form [1]. It also allows the user to report a bug about a package
                  by collecting as much information about it as possible [1].

                  Disabling Apport prevents the UI which informs the user about the crash and instructs
                  them on how to proceed because that dialog is part of Apport [2] [3]. Furthermore,
                  Apport creates crash report files in the `/var/crash` directory, and having files
                  in this directory causes an error message to appear every time Ubuntu boots [4].

                  Apport collects potentially sensitive data, such as core dumps, stack traces,
                  and log files [2]. It can contain passwords, credit card numbers, serial numbers,
                  and other private information [2].

                  Bug reports are shared with the [Ubuntu bug triaging team](https://web.archive.org/web/20221029222122/https://launchpad.net/~ubuntu-crashes-universe) [2].

                  Apport is disabled by default in stable releases due to the sensitive data it collects [2].

                  Apport only uploads data if the package `whoopsie` is installed; otherwise it appears
                  to be uploading but does not upload [3].

                  [1]: https://web.archive.org/web/20221029162724/https://github.com/canonical/apport/blob/75540cb0f665e50495d994b529c8418a1ebca178/README.md "apport/README.md at main · canonical/apport | GitHub | github.com"
                  [2]: https://web.archive.org/web/20221029162740/https://wiki.ubuntu.com/Apport "Apport - Ubuntu Wiki | wiki.ubuntu.com"
                  [3]: https://web.archive.org/web/20221029162829/https://help.ubuntu.com/community/ReportingBugs#A4._Collect_information_about_the_bug "ReportingBugs - Community Help Wiki | help.ubuntu.com"
                  [4]: https://web.archive.org/web/20221029150025/https://support.starlabs.systems/kb/guides/disable-program-problem-reports "Disable program problem reports - Star Labs | support.starlabs.systems"
                children:
                  -
                    name: Remove `apport` package
                    docs: |-
                      The `apport` package is responsible for automatically generating crash reports for debugging [1].

                      Apport software is provided using multiple packages such as `apport`, `python3-apport`,
                      `apport-gtk`, `apport-kde`, among others [1].

                      This script removes the main `apport` package that would lead other dependencies to be
                      in orphaned states that can be auto-removed. It does not attempt to remove all packages in
                      the suite as these can cause side effects and unintended crashes, such as deleting `python3-apport`
                      may crash interactive `python3` completely [2]. Uninstallation of all other packages
                      is not yet supported [3].

                      See also [source code of apport | launchpad.net](https://web.archive.org/web/20221029222108/https://code.launchpad.net/ubuntu/+source/apport).

                      [1]: https://web.archive.org/web/20221030194324/https://packages.ubuntu.com/bionic/apport "Ubuntu - Details of package apport in bionic | packages.ubuntu.com"
                      [2]: https://web.archive.org/web/20221029162934/https://bugs.launchpad.net/ubuntu/+source/xorg/+bug/1773087 "Bug #1773087 “Remove python3-apport as dependency of xserver-xor...” : Bugs : xorg package : Ubuntu | bugs.launchpad.net"
                      [3]: https://web.archive.org/web/20221029162946/https://bugs.launchpad.net/apport/+bug/1910304 "Issue showing that uninstallation support is undecided | Bug #1910304 “Add non-invasive option to disable python3-apport ...” : Bugs : Apport | bugs.launchpad.net"
                    call:
                      function: UninstallAptPackage
                      parameters:
                        packageName: apport
                  -
                    name: Disable Apport service
                    recommend: standard
                    docs: |-
                      The Apport service can be stopped using the following command: `systemctl stop apport` [1] [2].

                      Stopping the service can mitigate the risk of Ubuntu not respecting the opt-out configuration.
                      This has happened before in different Ubuntu versions, as reported by the community [2].

                      This script is used as part of a post-installation script by the National Cyber Security Centre in the UK [1].

                      [1]: https://web.archive.org/web/20221029163021/https://wiki.ubuntuusers.de/Apport/#Benutzung "Apport › Wiki › ubuntuusers.de | wiki.ubuntuusers.de"
                      [2]: https://web.archive.org/web/20221029163036/https://askubuntu.com/questions/93457/how-do-i-enable-or-disable-apport/93467 "How do I enable or disable Apport? - Ask Ubuntu | askubuntu.com"
                      [3]: https://web.archive.org/web/20221029163054/https://www.ncsc.gov.uk/files/ubuntu1804_post_install.sh_.txt "ubuntu1804_post_install.sh_.txt | nscs.gov.uk"
                    call:
                      function: DisableSystemdService
                      parameters:
                        serviceName: apport
                  -
                    name: Disable participation in Apport error messaging system
                    recommend: standard
                    docs: |-
                      Opting out of Apport prevents it from creating crash files after a crash [1].
                      It can be disabled by setting `enabled=0` in `/etc/default/apport` [1] [2].
                      This setting comes enabled by default in a clean installation of Ubuntu and
                      some of its derivatives (such as Pop!_OS).

                      This script is used as part of a post-installation script by the National Cyber Security Centre in the UK [1].

                      [1]: https://web.archive.org/web/20221029163213/https://help.ubuntu.com/community/ReportingBugs?action=recall&rev=321#Reporting_a_crash_when_no_message_shows_up_and_crash_files_not_created "ReportingBugs - Community Help Wiki | help.ubuntu.com"
                      [2]: https://web.archive.org/web/20221029163228/https://bugs.launchpad.net/ubuntu/+source/xorg/+bug/1773087/comments/1 "Comment #1 : Bug #1773087 : Bugs : xorg package : Ubuntu | help.ubuntu.com"
                      [3]: https://web.archive.org/web/20221029163054/https://www.ncsc.gov.uk/files/ubuntu1804_post_install.sh_.txt "ubuntu1804_post_install.sh_.txt | nscs.gov.uk"
                    code: |-
                      if [ -f /etc/default/apport ]; then
                        sudo sed -i 's/enabled=1/enabled=0/g' /etc/default/apport
                        echo 'Successfully disabled apport.'
                      else
                        echo 'Skipping, apport is not configured to be enabled.'
                      fi
                    revertCode: |-
                      if [ -f /etc/default/apport ]; then
                        sudo sed -i 's/enabled=0/enabled=1/g' /etc/default/apport
                        echo 'Successfully enabled apport.'
                      else
                        echo 'Skipping, apport is not configured to be disabled.'
                      fi
              -
                category: Disable uploading errors (Whoopsie)
                docs: |-
                  The software responsible for uploading crash reports is called Whoopsie [1].
                  It's always running on Ubuntu systems, watching the `/var/crash` directory for crash reports
                  (that usually Apport creates) to send over the internet to Canonical servers at `http://daisy.ubuntu.com`
                  for further processing [1]. Along with the crash report, it sends a unique identifier (GUID)
                  for your computer [1] in `/etc/default/whoopsie` [2].

                  Apport only uploads data if package `whoopsie` is installed; otherwise it appears
                  to be uploading but does not upload [3].

                  See also:
                  - [Whoopsie source code | launchpad.net](https://web.archive.org/web/20221029222205/https://code.launchpad.net/ubuntu/+source/whoopsie)
                  - [oops (back-end for Whoopsie) source code | launchpad.net](https://web.archive.org/web/20221029222222/https://code.launchpad.net/oops-repository)
                  - [Data gathered from errors | errors.ubuntu.com](https://web.archive.org/web/20221029221957/https://errors.ubuntu.com/)

                  [1]: https://web.archive.org/web/20221029162649/https://wiki.ubuntu.com/ErrorTracker#Anatomy_of_a_crash "ErrorTracker - Ubuntu Wiki | wiki.ubuntu.com"
                  [2]: https://web.archive.org/web/20221029163347/https://wiki.ubuntu.com/ErrorTracker/ServerArchitecture "ErrorTracker/ServerArchitecture - Ubuntu Wiki | wiki.ubuntu.com"
                  [3]: https://web.archive.org/web/20221029162829/https://help.ubuntu.com/community/ReportingBugs#A4._Collect_information_about_the_bug "ReportingBugs - Community Help Wiki | help.ubuntu.com"
                children:
                  -
                    name: Remove `whoopsie` package
                    docs: |-
                      This script uninstalls the `whoopsie` package.
                      This package is used for error tracker submission in Ubuntu [1].

                      [1]: https://web.archive.org/web/20221029163609/https://packages.ubuntu.com/bionic/utils/whoopsie "Ubuntu – Details of package whoopsie in bionic | package.ubuntu.com"
                    call:
                      function: UninstallAptPackage
                      parameters:
                        packageName: whoopsie
                  -
                    name: Disable Whoopsie service
                    recommend: standard
                    docs: |-
                      Whoopsie works through a service file created in `/lib/systemd/system/whoopsie.service` [1].
                      This script disables this service to immobilize the main functionality of Whoopsie.

                      Since Ubuntu 22.04, Whoopsie also ships `whoopsie.path`, which starts the service whenever the
                      `/var/crash` folder changes [3]. The service itself has no install section there, so it cannot
                      be disabled on its own: the script stops and disables `whoopsie.path` first, then stops the
                      service. Reverting restores both units to the state recorded before the change.

                      This script is used as part of a post-installation script by the National Cyber Security Centre in the UK [2].

                      [1]: https://web.archive.org/web/20221029163615/https://packages.ubuntu.com/focal/all/whoopsie/filelist "Ubuntu – File list of package whoopsie/focal/all | packages.ubuntu.com"
                      [2]: https://web.archive.org/web/20221029163054/https://www.ncsc.gov.uk/files/ubuntu1804_post_install.sh_.txt "ubuntu1804_post_install.sh_.txt | nscs.gov.uk"
                      [3]: https://git.launchpad.net/ubuntu/+source/whoopsie/tree/data/whoopsie.path?h=ubuntu/noble-updates "whoopsie.path | Ubuntu whoopsie source | git.launchpad.net"
                    # The path unit goes first, so it cannot start the service again while the service is being
                    # stopped. On Ubuntu 20.04 there is no `whoopsie.path`, and that call reports so and skips.
                    call:
                      -
                        function: DisableSystemdService
                        parameters:
                          serviceName: whoopsie.path
                      -
                        function: DisableSystemdService
                        parameters:
                          serviceName: whoopsie
                  -
                    name: Disable crash report submissions
                    recommend: standard
                    docs: |-
                      Once opted-out Whoopsie disables the related service [1].

                      This script is used as part of a post-installation script by the National Cyber Security Centre in the UK [2].

                      [1]: https://web.archive.org/web/20221029163651/https://bugs.launchpad.net/ubuntu/+source/whoopsie/+bug/1390014 "Bug #1390014 “systemd is in degraded state if whoopsie is disabl...” : Bugs : whoopsie package : Ubuntu | bugs.launchpad.net"
                      [2]: https://web.archive.org/web/20221029163054/https://www.ncsc.gov.uk/files/ubuntu1804_post_install.sh_.txt "ubuntu1804_post_install.sh_.txt | nscs.gov.uk"
                    code: |-
                      if [ -f /etc/default/whoopsie ] ; then
                        sudo sed -i 's/report_crashes=true/report_crashes=false/' /etc/default/whoopsie
                      fi
                    revertCode: |-
                      if [ -f /etc/default/whoopsie ] ; then
                        sudo sed -i 's/report_crashes=false/report_crashes=true/' /etc/default/whoopsie
                      fi
      -
        name: Disable connectivity checks (breaks Captive Portal detection)
        docs: |-
          [NetworkManager](https://web.archive.org/web/20221029223230/https://developer-old.gnome.org/NetworkManager/stable/NetworkManager.conf.html) can try
          to reach a web server after connecting to a network in order to determine if it is, e.g., behind a captive portal [1].

          Disabling connectivity protects against privacy leaks [1], but breaks captive portal detection.

          Connectivity URLs differ depending on the Linux distribution, e.g.:
          - Arch Linux: `http://ping.archlinux.org/nm-check.txt` (in `/usr/lib/NetworkManager/conf.d/20-connectivity.conf`) [1].
          - Ubuntu: `http://connectivity-check.ubuntu.com` [2] (in `/usr/lib/NetworkManager/conf.d/20-connectivity-ubuntu.conf` [3]).
          - Pop!_OS: `http://204.pop-os.org/` in `20-connectivity-pop.conf` [4].
          - Fedora: `http://fedoraproject.org/static/hotspot.txt` [5] in `/usr/lib/NetworkManager/conf.d/20-connectivity-fedora.conf` [6].
          - …

          This script disables connectivity checks by adding a global rule that will override Linux distribution-specific configuration.
          This is the recommended way to disable connectivity checks [1].

          > **Caution:** Captive portal detection is what makes the "sign in to this network" page appear on
          > public Wi-Fi. With connectivity checks off, those networks will look connected but carry no traffic
          > until you open the portal page yourself. This is why the script is not part of any recommendation preset.

          [1]: https://web.archive.org/web/20221029165948/https://wiki.archlinux.org/title/NetworkManager "NetworkManager - ArchWiki | wiki.archlinux.org"
          [2]: https://web.archive.org/web/20221029170031/https://launchpad.net/ubuntu/jammy/+package/network-manager-config-connectivity-ubuntu "network-manager-config-connectivity-ubuntu : Jammy (22.04) : Ubuntu | launchpad.net/ubuntu"
          [3]: https://web.archive.org/web/20221029170026/https://packages.ubuntu.com/bionic/all/network-manager-config-connectivity-ubuntu/filelist "Ubuntu - File list of package network-manager-config-connectivity-ubuntu/bionic/all | packages.ubuntu.com"
          [4]: https://web.archive.org/web/20221029170108/https://github.com/pop-os/connectivity/blob/master/debian/20-connectivity-pop.conf "connectivity/20-connectivity-pop.conf at master · pop-os/connectivity | github.com"
          [5]: https://web.archive.org/web/20221029170202/https://cgit.freedesktop.org/NetworkManager/NetworkManager/tree/contrib/fedora/rpm/20-connectivity-fedora.conf "20-connectivity-fedora.conf\rpm\fedora\contrib - NetworkManager/NetworkManager - Network connection manager and user applications | reedesktop.org"
          [6]: https://archive.ph/2023.12.06-185917/https://pkgs.org/download/NetworkManager-config-connectivity-fedora "Networkmanager-config-connectivity-fedora Download (RPM) | pkgs.org"
        call:
          function: RunIfCommandExists
          parameters:
            # `nmcli` ships with NetworkManager and is always on `PATH`, unlike the daemon itself, which
            # lives in `/usr/sbin` on Debian/Ubuntu but in `/usr/bin` on `/usr`-merged distributions
            # such as Arch.
            command: nmcli
            code: |-
              file='/etc/NetworkManager/conf.d/20-disable-connectivity-privacy-sexy.conf'
              content=$'# Created by privacy.sexy\n[connectivity]\nenabled=false'
              directory="${file%/*}"
              sudo mkdir -p "$directory"
              if [ -f "$file" ]; then
                echo "Skipping, connectivity checks are already disabled through $file."
              else
                echo -n "$content" | sudo tee "$file" > /dev/null
                echo 'Successfully disabled connectivity checks.'
              fi
              if sudo nmcli general reload; then
                echo 'Successfully reloaded configuration.'
              else
                >&2 echo 'NetworkManager could not reload its configuration; the change applies after a restart.'
              fi
            revertCode: |-
              file='/etc/NetworkManager/conf.d/20-disable-connectivity-privacy-sexy.conf'
              if [ ! -f "$file" ]; then
                echo 'Skipping, connectivity checks are not disabled.'
              else
                sudo rm -fv "$file"
                echo 'Successfully restored connectivity checks.'
              fi
              if sudo nmcli general reload; then
                echo 'Successfully reloaded configuration.'
              else
                >&2 echo 'NetworkManager could not reload its configuration; the change applies after a restart.'
              fi
      -
        name: Use a stable Wi-Fi MAC address per network
        docs: |-
          NetworkManager normally preserves the hardware MAC address while connected. This script changes
          its default for Wi-Fi profiles to `stable`, deriving a different persistent address for each
          connection profile. That reduces cross-network tracking without changing the address on every
          reconnect to the same network [1][2]. Existing profiles with an explicit cloned-MAC setting are
          not changed.

          The script owns one NetworkManager drop-in. If that path already exists before the first apply,
          its exact bytes and metadata are saved and restored. Revert refuses to overwrite a file changed
          after privacy.sexy applied it.

          > **Caution:** MAC allowlists, DHCP reservations, captive portals, and enterprise network access
          > controls may treat this device as new. This applies only to systems using NetworkManager.

          [1]: https://networkmanager.pages.freedesktop.org/NetworkManager/NetworkManager/NetworkManager.conf.html "NetworkManager.conf reference"
          [2]: https://networkmanager.pages.freedesktop.org/NetworkManager/NetworkManager/nm-settings-dbus.html "NetworkManager settings reference"
        call:
          function: RunIfCommandExists
          parameters:
            command: nmcli
            code: |-
              wifi_mac_file='/etc/NetworkManager/conf.d/90-privacy-sexy-wifi-mac.conf'
              wifi_mac_state_dir='/var/lib/privacy.sexy/state'
              wifi_mac_state="$wifi_mac_state_dir/networkmanager-wifi-mac.tar"
              wifi_mac_content=$'# Created by privacy.sexy\n[connection-privacy-sexy-wifi]\nmatch-device=type:wifi\nwifi.cloned-mac-address=stable'
              sudo install --directory --mode=700 "$wifi_mac_state_dir"
              if [ -L "$wifi_mac_file" ]; then
                >&2 echo "Skipping, \"$wifi_mac_file\" is a symbolic link and will not be replaced."
              elif [ -e "$wifi_mac_state" ]; then
                echo "Original NetworkManager state is already recorded at \"$wifi_mac_state\"."
              else
                if [ -e "$wifi_mac_file" ]; then
                  sudo tar --create --file="$wifi_mac_state" --acls --xattrs --numeric-owner --absolute-names "$wifi_mac_file"
                else
                  sudo tar --create --file="$wifi_mac_state" --files-from=/dev/null
                fi
                printf '%s\n' "$wifi_mac_content" | sudo tee "$wifi_mac_file" > /dev/null
                sudo chmod 644 "$wifi_mac_file"
                if sudo nmcli general reload; then
                  echo 'Configured stable, per-network Wi-Fi MAC addresses.'
                else
                  >&2 echo 'Saved the configuration, but NetworkManager could not reload it; it applies after restart.'
                fi
              fi
            revertCode: |-
              wifi_mac_file='/etc/NetworkManager/conf.d/90-privacy-sexy-wifi-mac.conf'
              wifi_mac_state_dir='/var/lib/privacy.sexy/state'
              wifi_mac_state="$wifi_mac_state_dir/networkmanager-wifi-mac.tar"
              wifi_mac_content=$'# Created by privacy.sexy\n[connection-privacy-sexy-wifi]\nmatch-device=type:wifi\nwifi.cloned-mac-address=stable'
              if [ ! -e "$wifi_mac_state" ]; then
                echo 'Skipping, no NetworkManager Wi-Fi MAC state recorded by privacy.sexy was found.'
              elif [ ! -f "$wifi_mac_file" ] || [ "$(cat "$wifi_mac_file")" != "$wifi_mac_content" ]; then
                >&2 echo 'Skipping revert because the NetworkManager drop-in changed after privacy.sexy applied it.'
              elif sudo tar --list --file="$wifi_mac_state" | grep --quiet .; then
                if sudo tar --extract --file="$wifi_mac_state" --acls --xattrs --numeric-owner --absolute-names; then
                  sudo rm --force "$wifi_mac_state"
                  sudo nmcli general reload
                  echo 'Restored the original NetworkManager Wi-Fi MAC configuration.'
                else
                  >&2 echo 'Failed to restore the original NetworkManager configuration.'
                fi
              elif sudo rm --force "$wifi_mac_file"; then
                sudo rm --force "$wifi_mac_state"
                sudo nmcli general reload
                echo 'Removed the NetworkManager Wi-Fi MAC configuration created by privacy.sexy.'
              else
                >&2 echo 'Failed to remove the NetworkManager Wi-Fi MAC configuration.'
              fi
  -
    category: Configure programs
    docs: |-
      These scripts configure third-party applications installed on Linux distributions to harden their
      security and privacy to protect your data.
      They scripts differ from OS level configurations as they configure applications that are not typically
      native to Linux distributions, i.e., not included in the OS itself and are not known as being part of
      a specific distribution.
    children:
      -
        name: Disable Python history for future interactive commands
        docs: |-
          Python is a high-level, general-purpose programming language [1].
          Most Python implementations (including CPython) include a [read-eval-print loop (REPL)](https://web.archive.org/web/20221029223210/https://en.wikipedia.org/wiki/Read%E2%80%93eval%E2%80%93print_loop),
          permitting them to function as a command-line interpreter for which users enter statements sequentially and receive results immediately [1].

          Python saves interactive commands in the `~/.python_history` file [2] [3].
          This script ensures that this file is immutable by changing the file attributes [4], so Python can no
          longer update the file.

          If the file does not exist yet, the script creates it as an empty file owned by you. Reverting removes
          the immutable attribute, and also deletes the file again if this script created it and it is still
          empty, so Python can create and write its history as before.

          [1]: https://web.archive.org/web/20221029170256/https://en.wikipedia.org/wiki/Python_%28programming_language%29 "Python (programming language) - Wikipedia | wikipedia.org"
          [2]: https://web.archive.org/web/20221029170303/https://github.com/python/cpython/blob/b2499669ef2e6dc9a2cdb49b4dc498e078167e26/Lib/site.py#L430-L451 "cpython/site.py at b2499669ef2e6dc9a2cdb49b4dc498e078167e26 · python/cpython · Source code that registers it | github.com"
          [3]: https://web.archive.org/web/20221029170501/https://bugs.python.org/issue20886 "Issue 20886: Disabling logging to ~/.python_history is not simple enough | Python tracker | bugs.python.org"
          [4]: https://web.archive.org/web/20221029170511/https://man7.org/linux/man-pages/man1/chattr.1.html "Chattr manpage | chattr - Linux manual page | man7.org"
        # The file is created as the invoking user: as root, `touch` created a root-owned file that stayed
        # root-owned after revert removed the immutable flag, so Python could still never write it.
        # Revert deletes the file only if this script recorded creating it and it is still empty. An empty,
        # root-owned file is what earlier versions of this script left behind, so revert removes that too.
        call:
          function: RunAsTargetUser
          parameters:
            code: |-
              history_file="$HOME/.python_history"
              history_state_dir="$target_home/.local/state/privacy.sexy/python"
              history_state_file="$history_state_dir/history-file-created"
              if ! command -v chattr > /dev/null 2>&1; then
                echo 'Skipping because "chattr" is not found.'
              else
                if [ ! -e "$history_file" ] && [ ! -L "$history_file" ]; then
                  if ! run_as_target_user touch "$history_file"; then
                    >&2 echo "Failed to create $history_file."
                  elif run_as_target_user install --directory --mode=700 "$history_state_dir" \
                      && run_as_target_user touch "$history_state_file"; then
                    echo "Created $history_file."
                  else
                    >&2 echo "Created $history_file, but could not record that in \"$history_state_dir\"."
                  fi
                fi
                if [ -f "$history_file" ]; then
                  history_target="$(realpath -- "$history_file")" # realpath in case of symlink
                  if sudo chattr +i "$history_target"; then
                    echo "Made $history_target immutable."
                  else
                    >&2 echo "Failed to make $history_target immutable."
                  fi
                fi
              fi
            revertCode: |-
              history_file="$HOME/.python_history"
              history_state_file="$target_home/.local/state/privacy.sexy/python/history-file-created"
              if [ ! -f "$history_file" ]; then
                echo "Skipping, $history_file does not exist."
                if [ -e "$history_state_file" ]; then
                  run_as_target_user rm -f -- "$history_state_file"
                fi
              elif ! command -v chattr > /dev/null 2>&1; then
                >&2 echo 'Cannot revert because "chattr" is not found.'
              else
                history_target="$(realpath -- "$history_file")" # realpath in case of symlink
                if ! sudo chattr -i "$history_target"; then
                  >&2 echo "Failed to remove the immutable attribute from $history_target."
                else
                  echo "Removed the immutable attribute from $history_target."
                  if [ ! -L "$history_file" ] && [ ! -s "$history_file" ] \
                      && { [ -e "$history_state_file" ] \
                        || { [ "$(stat -c '%u' -- "$history_file")" = '0' ] && [ "$target_user_id" != '0' ]; }; }; then
                    run_as_target_user rm -f -- "$history_file"
                    echo "Removed the empty $history_file that privacy.sexy created."
                  fi
                  if [ -e "$history_state_file" ]; then
                    run_as_target_user rm -f -- "$history_state_file"
                  fi
                fi
              fi
      -
        category: Disable command-line tool history
        docs: |-
          These scripts stop command-line programs from saving what you type in them to a history file. Each one sets
          an environment variable that the program reads when it starts.

          The variable is added to `/etc/environment`, which is read when someone signs in, so it applies to every
          user from the next time they sign in [1] [2]. Programs started from a session that began earlier do not see
          it. Reverting restores the variable to what it was before, or removes it.

          Use the scripts in *Clear command-line tool history* to delete the history that was already saved.

          [1]: https://web.archive.org/web/20260617004429/https://man7.org/linux/man-pages/man5/pam_env.conf.5.html "pam_env.conf(5) - Linux manual page | man7.org"
          [2]: https://web.archive.org/web/20261005141442/https://man7.org/linux/man-pages/man8/pam_env.8.html "pam_env(8) - Linux manual page | man7.org"
        children:
          -
            name: Disable less history
            docs: |-
              `less`, the program that most Linux systems use to page through long text such as manual pages, saves the search
              terms and shell commands you type in it to a history file [1].

              This script sets `LESSHISTFILE` to `-`. With this value, `less` does not use a history file [1].

              If you do not run this script, `less` keeps saving your searches.

              [1]: https://web.archive.org/web/20261014130006/https://man7.org/linux/man-pages/man1/less.1.html "less(1) - Linux manual page | man7.org"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: LESSHISTFILE
                value: '-'
          -
            name: Disable Node.js REPL history
            docs: |-
              When you start `node` without a script, Node.js opens an interactive prompt (REPL) and saves what you type there to
              `~/.node_repl_history` [1].

              The `NODE_REPL_HISTORY` environment variable chooses a different file, and an empty value turns the history off [1] [2].
              This script adds `NODE_REPL_HISTORY=` with an empty value to `/etc/environment`. `pam_env`, which reads that file,
              sets a variable written this way to an empty value instead of leaving it out [3] [4].

              If you do not run this script, the Node.js prompt keeps saving what you type.

              [1]: https://web.archive.org/web/20261029130002/https://nodejs.org/api/repl.html "REPL | Node.js Documentation | nodejs.org"
              [2]: https://web.archive.org/web/20261024073738/https://nodejs.org/api/cli.html "Command-line API | Node.js Documentation | nodejs.org"
              [3]: https://web.archive.org/web/20260514102659/https://github.com/linux-pam/linux-pam/blob/master/modules/pam_env/pam_env.c "linux-pam/modules/pam_env/pam_env.c at master · linux-pam/linux-pam · GitHub | github.com"
              [4]: https://web.archive.org/web/20261029041524/https://man7.org/linux/man-pages/man3/pam_putenv.3.html "pam_putenv(3) - Linux manual page | man7.org"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: NODE_REPL_HISTORY
          -
            name: Disable MySQL client history
            docs: |-
              The `mysql` command-line client, and the `mariadb` client of MariaDB, save the statements you run in them to
              `~/.mysql_history` [1] [2].

              This script sets `MYSQL_HISTFILE` to `/dev/null`, which is how MySQL and MariaDB document turning this history off [1] [2].

              If you do not run this script, these clients keep saving the statements you run.

              [1]: https://web.archive.org/web/20260520200608/https://dev.mysql.com/doc/refman/8.4/en/mysql-logging.html "MySQL :: MySQL 8.4 Reference Manual :: 6.5.1.3 mysql Client Logging | dev.mysql.com"
              [2]: https://web.archive.org/web/20260809080625/https://mariadb.com/docs/server/clients-and-utilities/mariadb-client/mariadb-command-line-client "mariadb Command-Line Client | Server | MariaDB Documentation | mariadb.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: MYSQL_HISTFILE
                value: '/dev/null'
      -
        category: Disable Visual Studio Code data collection
        docs: |-
            Visual Studio Code, also commonly referred to as VS Code, is a source-code editor made by Microsoft [1].

            Visual Studio Code makes outgoing network requests to collect data in the background without users invoking
            a feature that requires online access [2]. The requests include, but are not limited to, automatic extension
            update checks, querying settings for A/B experiments, and fetching online data for auto-completion [2].

            In addition, Visual Studio Code collects and transmits telemetry data to Microsoft servers, such as [3]:
            - Diagnostic information about your system and usage is sent to Microsoft servers [3].
            - Your usage data and data about feature performance [3].

            [1]: https://web.archive.org/web/20221029142001/https://en.wikipedia.org/wiki/Visual_Studio_Code "Visual Studio Code - Wikipedia | en.wikipedia.org"
            [2]: https://web.archive.org/web/20221029170840/https://code.visualstudio.com/updates/v1_26#_offline-mode "Visual Studio Code July 2018 | code.visualstudio.com"
            [3]: https://web.archive.org/web/20221029171138/https://code.visualstudio.com/docs/getstarted/telemetry "Visual Studio Code Telemetry | code.visualstudio.com"
        children:
            -
              name: Disable Visual Studio Code telemetry
              recommend: standard
              docs: |-
                The `telemetry.telemetryLevel` preference can be adjusted as follows [1]:

                - `default` (on): Transmits usage data, errors, and crash reports.
                - `error`: Transmits general error telemetry and crash reports.
                - `crash`: Transmits OS-level crash reports.
                - `off`: Disables all product telemetry.

                This script disables telemetry data, which includes usage data, errors, and crash reports.

                The `telemetry.enableTelemetry` was the primary option to disable telemetry collection [2].
                This disabled the collection of diagnostic data [3].
                However, it has been deprecated and replaced by the `telemetry.telemetryLevel` setting [4] [5].

                Crash reports use a unique ID to identify you [6]. They were initially controlled using the
                `telemetry.enableCrashReporter` setting [7], but this setting has been deprecated and replaced by
                the `telemetry.telemetryLevel` setting [7].

                [1]: https://web.archive.org/web/20221029171158/https://github.com/microsoft/vscode/blob/d32b92bd7a49ce8667b954d86320cc29545fc505/src/vs/platform/telemetry/common/telemetryService.ts#L278-L294 "vscode/telemetryService.ts at d32b92bd7a49ce8667b954d86320cc29545fc505 · microsoft/vscode · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029171236/https://github.com/microsoft/vscode/issues/3182 "Telemetry opt-out · Issue #3182 · microsoft/vscode · GitHub | github.com"
                [3]: https://web.archive.org/web/20221029171302/https://github.com/microsoft/vscode/blob/9f2d55f21247224e00e438ff0e8a080c557356dc/src/vs/platform/telemetry/common/telemetryService.ts#L247-L265 "vscode/telemetryService.ts at 9f2d55f21247224e00e438ff0e8a080c557356dc · microsoft/vscode · GitHub | github.com"
                [4]: https://web.archive.org/web/20221029171313/https://github.com/microsoft/vscode/issues/132552 "Explore splitting the telemetry settings into error telemetry + all other telemetry · Issue #132552 · microsoft/vscode · GitHub | github.com"
                [5]: https://web.archive.org/web/20221029171158/https://github.com/microsoft/vscode/blob/d32b92bd7a49ce8667b954d86320cc29545fc505/src/vs/platform/telemetry/common/telemetryService.ts#L302-L314 "vscode/telemetryService.ts at d32b92bd7a49ce8667b954d86320cc29545fc505 · microsoft/vscode · GitHub | github.com"
                [6]: https://web.archive.org/web/20221029171339/https://github.com/microsoft/vscode/blob/1dd67592e120d916a8963903babaf0fae74440c5/src/vs/code/electron-main/app.ts#L1259 "vscode/app.ts at 1dd67592e120d916a8963903babaf0fae74440c5 · microsoft/vscode · GitHub | github.com"
                [7]: https://web.archive.org/web/20221029171353/https://github.com/microsoft/vscode/blob/17fc955b4ffb1f9a0097a561291aaa5c8918eee6/src/vs/workbench/electron-sandbox/desktop.contribution.ts#L253-L267 "vscode/desktop.contribution.ts at 17fc955b4ffb1f9a0097a561291aaa5c8918eee6 · microsoft/vscode · GitHub | github.com"
              call:
                -
                  function: SetVsCodeSetting
                  parameters:
                      setting: telemetry.telemetryLevel
                      jsonValue: >-
                        "off"
                -
                  function: SetVsCodeSetting
                  parameters:
                      setting: telemetry.enableTelemetry
                      jsonValue: >-
                        false
                -
                  function: SetVsCodeSetting
                  parameters:
                      setting: telemetry.enableCrashReporter
                      jsonValue: >-
                        false
            -
              name: Disable online experiments by Microsoft in Visual Studio Code
              recommend: standard
              docs: |-
                VS Code employs experiments to test new features or gradually roll them out [1].
                The experimentation framework communicates with Microsoft servers [1].

                This setting is enabled by default [1].

                This script disables fetching experiments from a Microsoft online service [1].
                It accomplishes this by setting `workbench.enableExperiments` to `false` [1].

                [1]: https://web.archive.org/web/20221029171424/https://github.com/microsoft/vscode-docs/blob/d2dbfc5bcad0be08afca69e9253c1d5541e19d31/docs/supporting/faq.md "vscode-docs/faq.md at d2dbfc5bcad0be08afca69e9253c1d5541e19d31 · microsoft/vscode-docs · GitHub"
                [2]: https://web.archive.org/web/20221029171439/https://github.com/microsoft/vscode/blob/b784e0514d4608cc20a0e7ce62baf7bc8131158c/src/vs/workbench/contrib/experiments/browser/experiments.contribution.ts#L25-L34 "vscode/experiments.contribution.ts at b784e0514d4608cc20a0e7ce62baf7bc8131158c · microsoft/vscode · GitHub"
              call:
                  function: SetVsCodeSetting
                  parameters:
                      setting: workbench.enableExperiments
                      jsonValue: >-
                        false
            -
              name: Disable Visual Studio Code automatic updates in favor of manual updates
              docs: |-
                By default, VS Code is configured to automatically update when new versions are released [1].
                Automatic updates reduce your control over privacy by sending data to Microsoft servers.

                On Linux, updates are often handled by the system package manager, rendering this
                setting redundant [1].

                To opt out of auto-updates, the Update: Mode (`update.mode`) setting is changed from default
                to none [1]. `update.mode` has replaced the older `update.channel` setting [2] [3].

                > **Caution:** With updates turned off you no longer receive security fixes for the editor
                > itself. Update manually on a regular basis. This is why the script is not part of any
                > recommendation preset.

                [1]: https://web.archive.org/web/20221029171537/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/supporting/faq.md#how-do-i-opt-out-of-vs-code-auto-updates "vscode-docs/faq.md at 9a900b380e11530376104ffc83a004b82553728e · microsoft/vscode-docs · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029171549/https://github.com/microsoft/vscode/blob/8e2ec5a7ee1ae5500c645c05145359f2a814611c/src/vs/platform/update/common/update.config.contribution.ts#L36-L42 "vscode/update.config.contribution.ts at 8e2ec5a7ee1ae5500c645c05145359f2a814611c · microsoft/vscode · GitHub | github.com"
                [3]: https://web.archive.org/web/20221029171607/https://github.com/microsoft/vscode/issues/70084 'VS Code 1.31.1 does not respect "update.channel": "none" · Issue #70084 · microsoft/vscode · GitHub | github.com'
              call:
                -
                  function: SetVsCodeSetting
                  parameters:
                      setting: update.mode
                      jsonValue: >-
                          "none"
                -
                  function: SetVsCodeSetting
                  parameters:
                      setting: update.channel
                      jsonValue: >-
                          "none"
            -
              name: Disable fetching release notes from Microsoft servers after an update
              docs: |-
                This script prevents Visual Studio Code from displaying release notes after an update [1].

                Release notes are fetched from a Microsoft online service [1] and thus expose data about you,
                such as your IP address, to Microsoft.

                It is enabled by default [1] and can be disabled by setting `update.showReleaseNotes` to `false` [1].

                [1]: https://web.archive.org/web/20221029171549/https://github.com/microsoft/vscode/blob/8e2ec5a7ee1ae5500c645c05145359f2a814611c/src/vs/platform/update/common/update.config.contribution.ts#L51-L57 "vscode/update.config.contribution.ts at 8e2ec5a7ee1ae5500c645c05145359f2a814611c · microsoft/vscode | github.com"
              call:
                  function: SetVsCodeSetting
                  parameters:
                      setting: update.showReleaseNotes
                      jsonValue: >-
                        false
            -
              category: Configure auto-update settings for Visual Studio Code extensions
              docs: |-
                These scripts control the automatic update behavior of extensions.
                Updates are fetched from Microsoft servers [1] [2].

                Use of online Microsoft services can disclose information about you and your behavior.

                > **Caution:** Extensions receive security fixes through these updates. Turning the updates off
                > means you must check for extension updates yourself, so none of these scripts are part of a
                > recommendation preset.

                [1]: https://web.archive.org/web/20221029171704/https://github.com/microsoft/vscode/blob/b784e0514d4608cc20a0e7ce62baf7bc8131158c/src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts#L135-L150 "vscode/extensions.contribution.ts at b784e0514d4608cc20a0e7ce62baf7bc8131158c · microsoft/vscode · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029171719/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/extension-marketplace.md#extension-auto-update "vscode-docs/extension-marketplace.md at 9a900b380e11530376104ffc83a004b82553728e · microsoft/vscode-docs · GitHub | github.com"
              children:
                -
                  name: Disable automatic Visual Studio Code extension updates
                  docs: |-
                    By default, Visual Studio Code automatically downloads and installs updates for all
                    extensions [1]. These updates are fetched from a Microsoft online service [1].

                    This script disables the automatic updating of installed extensions.
                    It accomplishes this by setting `extensions.autoUpdate` to `false` [2].

                    [1]: https://web.archive.org/web/20221029171704/https://github.com/microsoft/vscode/blob/b784e0514d4608cc20a0e7ce62baf7bc8131158c/src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts#L135-L150 "vscode/extensions.contribution.ts at b784e0514d4608cc20a0e7ce62baf7bc8131158c · microsoft/vscode · GitHub | github.com"
                    [2]: https://web.archive.org/web/20221029171719/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/extension-marketplace.md#extension-auto-update "vscode-docs/extension-marketplace.md at 9a900b380e11530376104ffc83a004b82553728e · microsoft/vscode-docs · GitHub | github.com"
                  call:
                      function: SetVsCodeSetting
                      parameters:
                          setting: extensions.autoUpdate
                          jsonValue: >-
                            false
                -
                  name: Disable Visual Studio Code automatic extension update checks
                  docs: |-
                    By default, Visual Studio Code automatically checks extensions for updates [1].
                    If an update for an extension is available, it is marked as outdated in the Extensions view [1].
                    These updates are fetched from a Microsoft online service [1].

                    This script disables the automatic checking of updates for extensions.
                    It achieves this by setting `extensions.autoCheckUpdates` to `false` [2].

                    [1]: https://web.archive.org/web/20221029171704/https://github.com/microsoft/vscode/blob/b784e0514d4608cc20a0e7ce62baf7bc8131158c/src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts#L152-L158 "vscode/extensions.contribution.ts at b784e0514d4608cc20a0e7ce62baf7bc8131158c · microsoft/vscode | github.com"
                    [2]: https://web.archive.org/web/20221029171719/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/extension-marketplace.md#extension-auto-update "vscode-docs/extension-marketplace.md at 9a900b380e11530376104ffc83a004b82553728e · microsoft/vscode-docs · GitHub | github.com"
                  call:
                      function: SetVsCodeSetting
                      parameters:
                          setting: extensions.autoCheckUpdates
                          jsonValue: >-
                            false
                -
                  name: Disable automatic fetching of Microsoft recommendations in Visual Studio Code
                  # Not part of a preset: every script under this category is opt-in.
                  docs: |-
                    Visual Studio Code, by default, fetches extension recommendations from online Microsoft
                    servers [1]. This script stops those requests, so recommendations are no longer pulled in
                    the background.

                    Two settings are written because the setting was renamed:

                    - `extensions.ignoreRecommendations` is the current setting and suppresses the
                      recommendation notifications [2].
                    - `extensions.showRecommendationsOnlyOnDemand` is the older setting [1] [3]. It is written
                      as well so that older Visual Studio Code versions are covered.

                    This script does not turn off updates or security fixes; it only stops the editor from
                    reaching out for suggestions.

                    [1]: https://web.archive.org/web/20221029171704/https://github.com/microsoft/vscode/blob/b784e0514d4608cc20a0e7ce62baf7bc8131158c/src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts#L164-L169 "vscode/extensions.contribution.ts at b784e0514d4608cc20a0e7ce62baf7bc8131158c · microsoft/vscode · GitHub | github.com"
                    [2]: https://web.archive.org/web/20221029171719/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/extension-marketplace.md#extension-auto-update "vscode-docs/extension-marketplace.md at 9a900b380e11530376104ffc83a004b82553728e · microsoft/vscode-docs · GitHub | github.com"
                    [3]: https://web.archive.org/web/20221029171802/https://github.com/microsoft/vscode/issues/94416 "Combine extensions.ignoreRecommendations and extensions.showRecommendationsOnlyOnDemand · Issue #94416 · microsoft/vscode · GitHub | github.com"
                  call:
                      -
                        function: SetVsCodeSetting
                        parameters:
                            setting: extensions.ignoreRecommendations
                            jsonValue: >-
                              true
                      -
                        function: SetVsCodeSetting
                        parameters:
                            setting: extensions.showRecommendationsOnlyOnDemand
                            jsonValue: >-
                              true
            -
              name: Disable automatic fetching of remote repositories in Visual Studio Code
              docs: |-
                Visual Studio Code (VS Code) periodically fetches changes from remote repositories [1].
                This feature lets VS Code display how many changes your local repository is ahead or behind the remote [1].

                This script disables the automatic fetching, providing you more control over when you
                communicate with remote servers. Note that this feature shares data not with Microsoft,
                but with the servers hosting the remote repositories you're working with.

                As of VS Code 1.19, this feature is disabled by default [1] [3], although it was enabled by
                default in earlier versions [2].

                The `git.autofetch` setting controls this feature, with `true` enabling it and
                `false` disabling it [2].

                [1]: https://web.archive.org/web/20221029171946/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/sourcecontrol/overview.md#remotes "vscode-docs/overview.md at main · microsoft/vscode-docs · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029172003/https://github.com/Microsoft/vscode/issues/34684 "Set git.autofetch to disabled, by default · Issue #34684 · microsoft/vscode · GitHub | github.com"
                [3]: https://web.archive.org/web/20221029172102/https://github.com/microsoft/vscode/blob/9bc43c7f8acc1d3b2d572f75ca30dccc2fed643d/extensions/git/package.json#L1929-L1945 "vscode/package.json at 9bc43c7f8acc1d3b2d572f75ca30dccc2fed643d · microsoft/vscode · GitHub | github.com"
              call:
                  function: SetVsCodeSetting
                  parameters:
                      setting: git.autofetch
                      jsonValue: >-
                        false
            -
              name: Disable fetching package information from NPM and Bower in Visual Studio Code
              docs: |-
                Visual Studio Code fetches data from NPM and Bower to provide autocompletion and hover information
                for npm dependencies [1]. By default, this feature is enabled [2] and fetches data from
                `https://registry.npmjs.org` and `https://registry.bower.io` [1].

                This script prevents the automatic fetching of package information.

                You can disable this feature by setting `npm.fetchOnlinePackageInfo` to `false` [2].

                [1]: https://web.archive.org/web/20221029172113/https://github.com/microsoft/vscode/blob/21504708043941c1e9e45b7d0892a9a8a03470d7/extensions/npm/package.nls.json#L17 "vscode/package.nls.json at 21504708043941c1e9e45b7d0892a9a8a03470d7 · microsoft/vscode · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029172220/https://github.com/microsoft/vscode/blob/29e985eca0713c8458ae8349c1742d6fb75719e4/extensions/npm/package.json#L293-L300 "vscode/package.json at 29e985eca0713c8458ae8349c1742d6fb75719e4 · microsoft/vscode · GitHub | github.com"
              call:
                  function: SetVsCodeSetting
                  parameters:
                      setting: npm.fetchOnlinePackageInfo
                      jsonValue: >-
                        false
            -
              name: Disable sending search queries to Microsoft in Visual Studio Code
              recommend: strict
              docs: |-
                By default, Visual Studio Code sends setting search queries to Microsoft servers [1]. This is
                part of the natural language search mode, which is powered by a Microsoft online service [1].

                You can disable this feature by setting `enableNaturalLanguageSettingsSearch` to `false` [1].

                For more information, see [Settings search | Feature announcement](https://web.archive.org/web/20221029223417/https://github.com/microsoft/vscode-docs/blob/8f6d43a3b24d8661f25f93d5e679c3e6ee1191b6/release-notes/v1_20.md#settings-search).

                [1]: https://web.archive.org/web/20221029172320/https://github.com/microsoft/vscode/blob/13ba7bb446a638d37ebccb1a7d74e31c32bb9790/src/vs/workbench/contrib/preferences/common/preferencesContribution.ts#L151-L157 "vscode/preferencesContribution.ts at 13ba7bb446a638d37ebccb1a7d74e31c32bb9790 · microsoft/vscode · GitHub | github.com"
              call:
                function: SetVsCodeSetting
                parameters:
                    setting: workbench.settings.enableNaturalLanguageSearch
                    jsonValue: >-
                      false
            -
              name: Disable Visual Studio Code automatic type acquisition in TypeScript
              docs: |-
                This script disables [automatic type acquisition](https://web.archive.org/web/20221029223431/https://code.visualstudio.com/docs/nodejs/working-with-javascript#_typings-and-automatic-type-acquisition) [1],
                a feature that fetches `@types` packages from npm to improve IntelliSense for external libraries [1].

                Although this feature is disabled by default [2], you can ensure it's off by setting
                `typescript.disableAutomaticTypeAcquisition` to `true` [2].

                [1]: https://web.archive.org/web/20221029172348/https://github.com/microsoft/vscode/blob/3c37a5a8d7768ea068acf578594f9b71cfbe81e1/extensions/typescript-language-features/package.nls.json#L13 "vscode/package.nls.json at 3c37a5a8d7768ea068acf578594f9b71cfbe81e1 · microsoft/vscode · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029172429/https://github.com/microsoft/vscode/blob/29e985eca0713c8458ae8349c1742d6fb75719e4/extensions/typescript-language-features/package.json "vscode/package.json at 29e985eca0713c8458ae8349c1742d6fb75719e4 · microsoft/vscode · GitHub | github.com"
              call:
                function: SetVsCodeSetting
                parameters:
                    setting: typescript.disableAutomaticTypeAcquisition
                    jsonValue: >-
                      true
            -
              name: Disable Visual Studio Code Edit Sessions
              docs: |-
                **Edit Sessions** is a Visual Studio Code feature that synchronizes uncommitted changes between
                VS Code for the Web (e.g., GitHub Codespaces) and the Desktop version, storing data in the
                Microsoft Cloud [1].

                This script disables **Edit Sessions** and its more granular subsettings like
                `workbench.experimental.editSessions.autoStore`, `workbench.editSessions.autoResume`, and
                `workbench.editSessions.continueOn` [2].

                [1]: https://web.archive.org/web/20221029172502/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/release-notes/v1_71.md#bring-your-changes-with-you-when-moving-across-development-environments "vscode-docs/v1_71.md at 9a900b380e11530376104ffc83a004b82553728e · microsoft/vscode-docs · GitHub | github.com"
                [2]: https://web.archive.org/web/20221029172519/https://github.com/microsoft/vscode/blob/b891aa212a3644cc345d061c63a67ba51080cace/src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts#L816-L877 "vscode/editSessions.contribution.ts at b891aa212a3644cc345d061c63a67ba51080cace · microsoft/vscode | github.com"
              call:
                -
                  function: SetVsCodeSetting
                  parameters:
                    setting: workbench.experimental.editSessions.enabled
                    jsonValue: >-
                      false
                -
                  function: SetVsCodeSetting
                  parameters:
                    setting: workbench.experimental.editSessions.autoStore
                    jsonValue: >-
                      false
                -
                  function: SetVsCodeSetting
                  parameters:
                    setting: workbench.editSessions.autoResume
                    jsonValue: >-
                      false
                -
                  function: SetVsCodeSetting
                  parameters:
                    setting: workbench.editSessions.continueOn
                    jsonValue: >-
                      false
            -
              category: Disable data sharing for Visual Studio Code "Settings Sync"
              docs: |-
                **Settings Sync** is a Visual Studio Code feature that synchronizes settings, keybindings,
                and installed extensions across different machines [1]. This data is stored in the Microsoft
                Cloud [1].

                [1]: https://web.archive.org/web/20221029172856/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/settings-sync.md "vscode-docs/settings-sync.md at main · microsoft/vscode-docs · GitHub | github.com"
              children:
                -
                  name: Disable synchronization of Visual Studio Code keybindings
                  docs: |-
                    By default [1], Keyboard Shortcuts are synchronized across platforms [2].
                    You can disable this by setting `settingsSync.keybindingsPerPlatform` to `false` [1] [2].

                    [1]: https://web.archive.org/web/20221029172910/https://github.com/microsoft/vscode/blob/095ddabc52b82498ee7f718a34f9dd11d59099a8/src/vs/platform/userDataSync/common/userDataSync.ts#L58-L64 "vscode/userDataSync.ts at 095ddabc52b82498ee7f718a34f9dd11d59099a8 · microsoft/vscode · GitHub | github.com"
                    [2]: https://web.archive.org/web/20221029172856/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/settings-sync.md "vscode-docs/settings-sync.md at main · microsoft/vscode-docs · GitHub | github.com"
                  call:
                    function: SetVsCodeSetting
                    parameters:
                        setting: settingsSync.keybindingsPerPlatform
                        jsonValue: >-
                          false
                -
                  name: Disable synchronization of Visual Studio Code extensions
                  docs: |-
                    Visual Studio Code synchronizes all built-in and installed extensions, along with their
                    global enablement state, by default [1] [2].

                    This script prevents the synchronization of all Visual Studio Code extensions.

                    To disable extension synchronization, set `settingsSync.ignoredExtensions` [1],
                    which configures the list of extensions to be ignored during synchronization [2].

                    [1]: https://web.archive.org/web/20221029172856/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/settings-sync.md "vscode-docs/settings-sync.md at main · microsoft/vscode-docs · GitHub | github.com"
                    [2]: https://web.archive.org/web/20221029172910/https://github.com/microsoft/vscode/blob/095ddabc52b82498ee7f718a34f9dd11d59099a8/src/vs/platform/userDataSync/common/userDataSync.ts#L65-L78 "vscode/userDataSync.ts at 095ddabc52b82498ee7f718a34f9dd11d59099a8 · microsoft/vscode · GitHub | github.com"
                  call:
                    function: SetVsCodeSetting
                    parameters:
                        setting: settingsSync.ignoredExtensions
                        jsonValue: >-
                          ["*"]
                -
                  name: Disable synchronization of Visual Studio Code settings
                  docs: |-
                    By default, Visual Studio Code synchronizes all settings, except for machine settings
                    (those with machine or machine-overridable scopes), as these are specific to a given machine [1] [2].

                    This script disables the synchronization of all settings.

                    You can specify settings to ignore during synchronization using the `settingsSync.ignoredSettings`
                    setting [1] [2].

                    [1]: https://web.archive.org/web/20221029172856/https://github.com/microsoft/vscode-docs/blob/9a900b380e11530376104ffc83a004b82553728e/docs/editor/settings-sync.md "vscode-docs/settings-sync.md at main · microsoft/vscode-docs · GitHub | github.com"
                    [2]: https://web.archive.org/web/20221029172910/https://github.com/microsoft/vscode/blob/095ddabc52b82498ee7f718a34f9dd11d59099a8/src/vs/platform/userDataSync/common/userDataSync.ts#L79-L89 "vscode/userDataSync.ts at 095ddabc52b82498ee7f718a34f9dd11d59099a8 · microsoft/vscode · GitHub | github.com"
                  call:
                    function: SetVsCodeSetting
                    parameters:
                        setting: settingsSync.ignoredSettings
                        jsonValue: >-
                          ["*"]
      -
        name: Disable .NET telemetry
        recommend: standard
        docs: |-
          .NET, previously known as .NET Core [1], is a free, open-source, and cross-platform developer platform
          that allows the creation of various types of applications [2].

          The .NET Software Development Kit (SDK) includes a telemetry feature, enabled by default [3], that
          collects and sends usage data to Microsoft upon the execution of .NET Command-Line Interface (CLI)
          commands. This data comprises your operating system, hardware specifics, geographic location,
          and .NET usage/installation information [3]. A fraction of this collected data is made publicly
          available at [.NET CLI Telemetry Data | dotnet.microsoft.com](https://web.archive.org/web/20221029211429/https://dotnet.microsoft.com/en-us/platform/telemetry).

          This script sets the `DOTNET_CLI_TELEMETRY_OPTOUT` environment variable to `1`, opting you out
          of the .NET telemetry collection [3]. It is crucial to establish this setting prior to the
          .NET installation since the installation process also sends telemetry data [3].

          [1]: https://web.archive.org/web/20220930202101/https://en.wikipedia.org/wiki/.NET ".NET - Wikipedia | en.wikipedia.org"
          [2]: https://web.archive.org/web/20221003175158/https://dotnet.microsoft.com/en-us/download "Download .NET (Linux, macOS, and Windows) | dotnet.microsoft.com"
          [3]: https://web.archive.org/web/20220903043156/https://docs.microsoft.com/en-us/dotnet/core/tools/telemetry ".NET SDK and .NET CLI telemetry - .NET CLI | Microsoft Docs | docs.microsoft.com"
        call:
          function: PersistSystemEnvironmentVariable
          parameters:
              variable: DOTNET_CLI_TELEMETRY_OPTOUT
              value: '1'
      -
        name: Disable PowerShell Core telemetry
        docs: |-
          PowerShell Core, a cross-platform (Windows, Linux, and macOS) automation and configuration
          tool/framework, incorporates a command-line shell, a related scripting language, and a
          framework for processing cmdlets [1].

          It sends telemetry data to Microsoft servers, revealing your software usage,
          geolocation, and additional environment data [2].

          This script sets the `env:POWERSHELL_TELEMETRY_OPTOUT` environment variable to `1`,
          opting you out of PowerShell Core's telemetry collection.

          [1]: https://web.archive.org/web/20221011001154/https://github.com/PowerShell/PowerShell "GitHub - PowerShell/PowerShell: PowerShell for every system! | github.com"
          [2]: https://web.archive.org/web/20221011165907/https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_telemetry?view=powershell-7.2 "about Telemetry - PowerShell | Microsoft Learn"
        call:
          function: PersistSystemEnvironmentVariable
          parameters:
              variable: POWERSHELL_TELEMETRY_OPTOUT
              value: '1'
      -
        category: Disable development tool telemetry
        docs: |-
          Many development tools and frameworks send usage data to their makers, such as the commands you run, the
          version of the tool and details about your computer. Most of them document an environment variable that
          turns this off.

          These scripts add that variable to `/etc/environment`, which is read when someone signs in, so it applies to
          every user and every project from the next time they sign in [1] [2]. Reverting restores the variable to
          what it was before, or removes it.

          Some of these tools collect nothing unless you agree to it first. For them, the variable keeps collection
          off in every project.

          [1]: https://web.archive.org/web/20260617004429/https://man7.org/linux/man-pages/man5/pam_env.conf.5.html "pam_env.conf(5) - Linux manual page | man7.org"
          [2]: https://web.archive.org/web/20261005141442/https://man7.org/linux/man-pages/man8/pam_env.8.html "pam_env(8) - Linux manual page | man7.org"
        children:
          -
            name: Disable Next.js telemetry
            recommend: standard
            docs: |-
              Next.js is a web framework for React. By default, it collects anonymous telemetry about general usage: the command you
              ran (such as `next build` or `next dev`), the version of Next.js and general information about your computer [1].

              This script sets `NEXT_TELEMETRY_DISABLED` to `1`, which opts out [1].

              If you do not run this script, Next.js keeps sending this data.

              [1]: https://web.archive.org/web/20261029083429/https://nextjs.org/telemetry "Telemetry | Next.js | nextjs.org"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: NEXT_TELEMETRY_DISABLED
                value: '1'
          -
            name: Disable Nuxt telemetry
            recommend: standard
            docs: |-
              Nuxt is a web framework for Vue.js. It asks for your permission the first time, and if you agree, it sends the command
              you ran (such as `nuxt dev`), the versions of Nuxt and Node.js, and the public dependencies of your project [1].

              This script sets `NUXT_TELEMETRY_DISABLED` to `1`, which turns this telemetry off [1].

              If you do not run this script, Nuxt can ask for your permission and send this data if you agree.

              [1]: https://web.archive.org/web/20260711180841/https://github.com/nuxt/telemetry "GitHub - nuxt/telemetry: Nuxt Telemetry · GitHub | github.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: NUXT_TELEMETRY_DISABLED
                value: '1'
          -
            name: Disable Astro telemetry
            recommend: standard
            docs: |-
              Astro is a web framework. By default, its command-line tool collects anonymous telemetry about general usage: the
              command you ran (such as `astro build`), the version of Astro and general information about your computer [1].

              This script sets `ASTRO_TELEMETRY_DISABLED`, which turns this telemetry off [2]. Astro treats any non-empty value as
              turned off, and the script uses `1` [3].

              If you do not run this script, Astro keeps sending this data.

              [1]: https://web.archive.org/web/20260923192027/https://astro.build/telemetry/ "Telemetry | Astro | astro.build"
              [2]: https://web.archive.org/web/20261029075936/https://docs.astro.build/en/reference/cli-reference/ "CLI Commands | Docs | docs.astro.build"
              [3]: https://web.archive.org/web/20260707155129/https://github.com/withastro/astro/blob/main/packages/telemetry/src/index.ts "astro/packages/telemetry/src/index.ts at main · withastro/astro · GitHub | github.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: ASTRO_TELEMETRY_DISABLED
                value: '1'
          -
            name: Disable Angular CLI analytics
            recommend: standard
            docs: |-
              The Angular CLI is the command-line tool of the Angular web framework. It collects usage statistics only if you agree
              when it asks [1]. These include the commands and options you run, your operating system and the versions of Node.js
              and the Angular CLI [1].

              This script sets `NG_CLI_ANALYTICS` to `false`, which turns off all analytics reporting and takes precedence over the
              global Angular CLI configuration [2] [3].

              If you do not run this script, the Angular CLI can ask for and send these statistics.

              [1]: https://web.archive.org/web/20260512131429/https://angular.dev/cli/analytics "ng analytics • Overview • Angular | angular.dev"
              [2]: https://web.archive.org/web/20260510120040/https://github.com/angular/angular-cli/blob/main/docs/design/analytics.md "angular-cli/docs/design/analytics.md at main · angular/angular-cli · GitHub | github.com"
              [3]: https://github.com/angular/angular-cli/blob/main/packages/angular/cli/src/utilities/environment-options.ts "angular-cli/packages/angular/cli/src/utilities/environment-options.ts at main · angular/angular-cli · GitHub | github.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: NG_CLI_ANALYTICS
                value: 'false'
          -
            name: Disable Storybook telemetry
            recommend: standard
            docs: |-
              Storybook is a tool for building user interface components. By default, it collects anonymous data such as the command
              you ran, the Storybook version, your add-ons and the user interface framework, along with a one-way hash of your IP
              address [1].

              This script sets `STORYBOOK_DISABLE_TELEMETRY` to `true` [1]. Unlike the `disableTelemetry` option in a project's
              configuration, the variable also stops the event that Storybook sends when it starts [1].

              If you do not run this script, Storybook keeps sending this data.

              [1]: https://web.archive.org/web/20261027020712/https://storybook.js.org/docs/configure/telemetry "Telemetry | Storybook docs | storybook.js.org"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: STORYBOOK_DISABLE_TELEMETRY
                value: 'true'
          -
            name: Disable Turborepo telemetry
            recommend: standard
            docs: |-
              Turborepo is a build system for JavaScript and TypeScript code bases. By default, it collects telemetry such as the
              command you ran, the version of `turbo`, general information about your computer and the size of your project [1].

              This script sets `TURBO_TELEMETRY_DISABLED` to `1`, which opts out [1].

              If you do not run this script, Turborepo keeps sending this data.

              [1]: https://web.archive.org/web/20251219235141/https://turborepo.com/docs/telemetry "Telemetry | Turborepo | turborepo.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: TURBO_TELEMETRY_DISABLED
                value: '1'
          -
            name: Disable HashiCorp Checkpoint data collection
            recommend: strict # Also turns off security bulletin notices
            docs: |-
              Terraform and other HashiCorp tools contact HashiCorp's Checkpoint service to check for new versions and for
              critical security bulletins about the version you use [1]. These requests include an anonymous ID [1].

              This script sets `CHECKPOINT_DISABLE` to `1`. Any non-empty value turns Checkpoint off for all HashiCorp products [1].

              > **Consideration:** HashiCorp tools no longer tell you about new versions or about security bulletins for the version
              > you use. Terraform's `disable_checkpoint_signature` setting is an alternative that keeps the bulletins but stops
              > sending the anonymous ID [1].

              If you do not run this script, HashiCorp tools keep contacting Checkpoint.

              [1]: https://web.archive.org/web/20261022104607/https://developer.hashicorp.com/terraform/cli/commands "Terraform CLI overview | Terraform | HashiCorp Developer | developer.hashicorp.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: CHECKPOINT_DISABLE
                value: '1'
          -
            name: Disable Azure CLI telemetry
            recommend: standard
            docs: |-
              The Azure CLI is Microsoft's command-line tool for managing Azure resources. It collects telemetry by default [1].

              The Azure CLI reads each configuration option from an environment variable named `AZURE_{section}_{name}` [2]. This
              script sets `AZURE_CORE_COLLECT_TELEMETRY` to `false`, which turns off the `core.collect_telemetry` option that allows
              Microsoft to collect anonymous data on the usage of the CLI [2].

              If you do not run this script, the Azure CLI keeps sending usage data to Microsoft.

              [1]: https://web.archive.org/web/20261101193250/https://github.com/Azure/azure-cli "GitHub - Azure/azure-cli: Azure Command-Line Interface · GitHub | github.com"
              [2]: https://web.archive.org/web/20250404111413/https://learn.microsoft.com/en-us/cli/azure/azure-cli-configuration "Azure CLI configuration options | Microsoft Learn | learn.microsoft.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: AZURE_CORE_COLLECT_TELEMETRY
                value: 'false'
          -
            name: Disable Google Cloud CLI usage statistics
            recommend: standard
            docs: |-
              The Google Cloud CLI (`gcloud`) collects usage statistics only if you agree during its installation [1]. They include
              the commands you run, how long they take and whether they fail [1].

              The Google Cloud CLI reads each property from an environment variable named `CLOUDSDK_SECTION_NAME_PROPERTY_NAME` [2].
              This script sets `CLOUDSDK_CORE_DISABLE_USAGE_REPORTING` to `true`, the `core/disable_usage_reporting` property that
              stops these statistics [1] [2].

              If you do not run this script, the Google Cloud CLI sends these statistics if you agreed to it during
              installation.

              [1]: https://web.archive.org/web/20250823232452/https://cloud.google.com/sdk/docs/usage-statistics "Usage statistics | Google Cloud SDK Documentation | cloud.google.com"
              [2]: https://web.archive.org/web/20251113203430/https://cloud.google.com/sdk/docs/properties "Managing gcloud CLI properties | Google Cloud SDK | cloud.google.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: CLOUDSDK_CORE_DISABLE_USAGE_REPORTING
                value: 'true'
          -
            name: Disable Hugging Face Hub telemetry
            recommend: standard
            docs: |-
              Hugging Face libraries, such as `transformers`, `datasets` and `gradio`, collect some data by default to monitor usage,
              debug issues and prioritize features [1].

              This script sets `HF_HUB_DISABLE_TELEMETRY` to `1`, which turns telemetry off for all of them [1].

              If you do not run this script, these libraries keep sending this data.

              [1]: https://web.archive.org/web/20261030023729/https://huggingface.co/docs/huggingface_hub/package_reference/environment_variables "Environment variables · Hugging Face | huggingface.co"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: HF_HUB_DISABLE_TELEMETRY
                value: '1'
          -
            name: Disable vcpkg telemetry
            recommend: standard
            docs: |-
              vcpkg is Microsoft's package manager for C and C++ libraries. Its telemetry is on by default and records events such
              as the command line used, when it ran and how long it took, together with a random ID created on first use [1].

              This script sets `VCPKG_DISABLE_METRICS`, which turns this telemetry off [1]. vcpkg treats the variable as set
              whatever its value, and the script uses `1` [2].

              If you do not run this script, vcpkg keeps sending this data.

              [1]: https://web.archive.org/web/20261109165006/https://learn.microsoft.com/en-us/vcpkg/about/privacy "Telemetry and Privacy | Microsoft Learn | learn.microsoft.com"
              [2]: https://github.com/microsoft/vcpkg-tool/blob/main/src/vcpkg/vcpkgcmdarguments.cpp "vcpkg-tool/src/vcpkg/vcpkgcmdarguments.cpp at main · microsoft/vcpkg-tool · GitHub | github.com"
            call:
              function: PersistSystemEnvironmentVariable
              parameters:
                variable: VCPKG_DISABLE_METRICS
                value: '1'
      -
        category: Configure Firefox
        docs: |-
          Mozilla Firefox, colloquially known as Firefox, is a free and open-source web browser created by
          the Mozilla Foundation and its subsidiary, the Mozilla Corporation [1].

          By default, Firefox collects telemetry data and has other features that gather information about
          your downloaded files and browsed webpages [2][3].

          The scripts provided here adjust your Firefox installation to prevent its data collection.

          [1]: https://web.archive.org/web/20221029173029/https://en.wikipedia.org/wiki/Firefox "Firefox | Wikipedia | en.wikipedia.org"
          [2]: https://web.archive.org/web/20220901045358/https://support.mozilla.org/en-US/kb/telemetry-clientid "Telemetry collection and deletion | Firefox Help | support.mozilla.org"
          [3]: https://web.archive.org/web/20221008150941/https://support.mozilla.org/en-US/kb/how-does-phishing-and-malware-protection-work "How does built-in Phishing and Malware Protection work? | Firefox Help | support.mozilla.org"
        children:
          -
            category: Harden Firefox privacy # Same name as Windows > "Harden Edge privacy"
            docs: |-
              The following are privacy-focused tweaks to prevent browser fingerprinting and tracking.

              See also: [What is browser fingerprinting? | AmIUnique.org](https://web.archive.org/web/20221029223510/https://www.amiunique.org/faq)
            children:
              -
                category: Enable Firefox state partitioning (Total Cookie Protection)
                docs: |-
                  Web browsers, including Firefox, save various data types such as cookies, cache, and site-specific details.
                  While this data helps in providing a faster and personalized browsing experience, it can be exploited by websites to track
                  your activities across the internet, potentially compromising your privacy.

                  State partitioning, also known as "Total Cookie Protection" [1], is a feature designed to enhance user privacy in Firefox.
                  It works by allocating different, isolated storage spaces for every website you visit [2]. This means that each website has its own
                  "compartment" where it saves its data, separate from other sites [2]. This structure limits websites' capabilities to track users
                  across various domains.

                  The underlying technology for state partitioning in Firefox is termed "double-keying" [1]. In this method, when a website intends
                  to store data, Firefox attaches an extra identifier tied to the site's origin, ensuring unique data storage for each site [1]. For
                  example, if two different sites incorporate content from the same third-party source, each of these sites will have its own unique
                  version of the third-party's data (like cookies) due to state partitioning [1]. This impedes the third-party's tracking ability
                  between the sites.

                  This protection isn't just against known trackers [1]. Firefox applies state partitioning to all third-party content on a site,
                  ensuring a comprehensive privacy coverage, beyond just identifiable tracking sources [1] [3].

                  A notable misuse by some trackers is the creation of "supercookies" [4]. Contrary to standard cookies, which users can delete easily,
                  supercookies are harder to eliminate and block, posing a considerable privacy challenge. Through state partitioning, Firefox renders
                  supercookies ineffective for tracking users across sites [4]. As a part of this feature, Firefox not only ensures site-specific data
                  but also partitions multiple caches, such as HTTP cache, image cache, and favicon cache [4]. This partitioning prevents any potential
                  cache exploitation for tracking purposes [4].

                  In summary, enabling state partitioning in Firefox is a powerful privacy tool, helping to defend users from potential online tracking
                  and offering a more private browsing experience.

                  [1]: https://web.archive.org/web/20230918171957/https://hacks.mozilla.org/2021/02/introducing-state-partitioning/ "Introducing State Partitioning - Mozilla Hacks - the Web developer blog"
                  [2]: https://web.archive.org/web/20230918172155/https://developer.mozilla.org/en-US/docs/Web/Privacy/State_Partitioning "State Partitioning - Privacy on the web | MDN"
                  [3]: https://web.archive.org/web/20230918172352/https://blog.mozilla.org/security/2021/02/23/total-cookie-protection/ "Firefox 86 Introduces Total Cookie Protection - Mozilla Security Blog"
                  [4]: https://web.archive.org/web/20230918172503/https://blog.mozilla.org/security/2021/01/26/supercookie-protections/ "Firefox 85 Cracks Down on Supercookies - Mozilla Security Blog"
                children:
                  -
                    name: Enable dynamic First-Party Isolation (dFPI)
                    recommend: standard
                    docs: |-
                      Dynamic First-Party Isolation, also known as dFPI, is an advanced privacy feature in Firefox. This feature commonly
                      referred to as:

                      - Total Cookie Protection [1],
                      - dFPI (dynamic First-Party Isolation) [2],
                      - Dynamic storage partitioning [3].

                      Essentially, dFPI is an enhanced version of a previous privacy tool known as First-Party Isolation (FPI) [4].

                      The primary purpose of dFPI is to improve user privacy online. It accomplishes this by preventing third-party websites from
                      accessing or tracking a user's data across different websites [1] [3].

                      By default, this feature is activated for all Firefox desktop users [5].

                      Within Firefox's settings, there's an option called `network.cookie.cookieBehavior` which governs how dFPI operates.
                      This setting has three potential values [3]:

                      - `5`: The browser will block known trackers and partition storage for third-party content.
                      - `4`: Only known trackers will be blocked without any partitioning of third-party storage.
                      - `0`: All trackers and third-party content are allowed.

                      This script sets the value to `5`, ensuring the highest level of privacy by blocking trackers and partitioning third-party
                      storage. This aligns with recommended privacy practices because even if you choose the `4` value, the older First-Party
                      Isolation (FPI) will still be active [6].

                      [1]: https://web.archive.org/web/20231003094145/https://support.mozilla.org/en-US/kb/total-cookie-protection-and-website-breakage-faq "Total Cookie Protection and website breakage FAQ | Firefox Help"
                      [2]: https://web.archive.org/web/20231003094154/https://bugzilla.mozilla.org/show_bug.cgi?id=1746646 "1746646 - (tcp-mochitests) [meta] Make mochitests work with TCP enabled (cookieBehavior = 5) | bugzilla.mozilla.org"
                      [3]: https://web.archive.org/web/20230918172155/https://developer.mozilla.org/en-US/docs/Web/Privacy/State_Partitioning#disable_dynamic_state_partitioning "State Partitioning - Privacy on the web | MDN"
                      [4]: https://web.archive.org/web/20231003094207/https://bugzilla.mozilla.org/show_bug.cgi?id=1649876#c5 "1649876 - Migrate FPI users to dFPI | bugzilla.mozilla.org"
                      [5]: https://web.archive.org/web/20231207105610/https://blog.mozilla.org/en/products/firefox/firefox-rolls-out-total-cookie-protection-by-default-to-all-users-worldwide/ "Firefox Rolls Out Total Cookie Protection By Default"
                      [6]: https://web.archive.org/web/20231003094350/https://bugzilla.mozilla.org/show_bug.cgi?id=1631676#c25 "1631676 - Disable dfpi when privacy.firstparty.isolate=true | bugzilla.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: network.cookie.cookieBehavior
                        jsonValue: '5'
                  -
                    name: Enable Firefox network partitioning
                    # No recommendation: Firefox 141 and later ignore the preference and always partition network state.
                    docs: |-
                      Network partitioning is a method used by Firefox to enhance user privacy [1]. When enabled, each website you visit has its own
                      isolated storage location, preventing it from accessing data from another website [1]. This limits the ability of websites to track
                      users across multiple sites [1].

                      Network Partitioning, formerly referred to as *cache partitioning* [2], is a subset of state partitioning [1]. While state partitioning
                      deals with data like cookies, network partitioning deals with networking-related components, such as caches and connection pools [1].
                      It ensures that these components are isolated to each website, further enhancing user privacy [1].

                      Firefox has enabled network partitioning by default since version 85 [1]. Once enabled, network partitioning becomes permanent,
                      meaning websites cannot bypass or weaken its restrictions [1].

                      Network partitioning could be controlled with the `privacy.partition.network_state` preference [1].

                      > **Note:** Firefox 141 removed this preference and always partitions network state [3]. The script only
                      > matters for older Firefox versions; on current versions it writes a preference that Firefox ignores.

                      [1]: https://web.archive.org/web/20230918172155/https://developer.mozilla.org/en-US/docs/Web/Privacy/State_Partitioning "State Partitioning - Privacy on the web | MDN"
                      [2]: https://web.archive.org/web/20231003094417/https://bugzilla.mozilla.org/show_bug.cgi?id=1687569 "1687569 - cache partitioning causes web page saving extensions to waste more time and data | bugzilla.mozilla.org"
                      [3]: https://bugzilla.mozilla.org/show_bug.cgi?id=1954293 "1954293 - Remove privacy.partition.network_state | bugzilla.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: privacy.partition.network_state
                        jsonValue: 'true'
                  -
                    name: Disable outdated Firefox First-Party Isolation (FPI)
                    recommend: strict
                    docs: |-
                      First-party isolation (FPI) helps in preventing third parties from tracking users across multiple websites [1] [2]. This is sometimes
                      referred to as "double keying" (double-keying) [1] or supercookies [1] [2].

                      This script disables FPI in favor of a newer technology called dynamic First-Party Isolation (dFPI) for the following reasons:

                      1. FPI and dFPI conflict with each other, and they cannot function simultaneously [3] [4]. Additionally, Mozilla doesn't plan to make
                      them compatible [5].
                      2. FPI has been marked as deprecated and is expected to be phased out [3], with dFPI set to become the standard in the future [6].
                      3. dFPI, when combined with network partitioning, offers broader and more effective privacy coverage than FPI, being essentially a
                      superset of FPI [3] [7].

                      [1]: https://web.archive.org/web/20221025162743/https://wiki.archlinux.org/title/Firefox/Privacy#First_party_isolation "Firefox/Privacy - ArchWiki | wiki.archlinux.org"
                      [2]: https://web.archive.org/web/20221025200527/https://bugzilla.mozilla.org/show_bug.cgi?id=1397624#c0 "1397624 - Provide an option for first-party isolation in Private Browsing Mode | bugzilla.mozilla.org"
                      [3]: https://web.archive.org/web/20231003094207/https://bugzilla.mozilla.org/show_bug.cgi?id=1649876#c0 "1649876 - Migrate FPI users to dFPI | bugzilla.mozilla.org"
                      [4]: https://web.archive.org/web/20231003094350/https://bugzilla.mozilla.org/show_bug.cgi?id=1631676#c25 "1631676 - Disable dfpi when privacy.firstparty.isolate=true | bugzilla.mozilla.org"
                      [5]: https://web.archive.org/web/20231003094207/https://bugzilla.mozilla.org/show_bug.cgi?id=1649876#c3 "1649876 - Migrate FPI users to dFPI | bugzilla.mozilla.org"
                      [6]: https://web.archive.org/web/20231003094207/https://bugzilla.mozilla.org/show_bug.cgi?id=1649876#c5 "1649876 - Migrate FPI users to dFPI | bugzilla.mozilla.org"
                      [7]: https://web.archive.org/web/20231003094358/https://bugzilla.mozilla.org/show_bug.cgi?id=1637344#c2 "1637344 - Add message to show dFPI is incompatible with FPI | bugzilla.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: privacy.firstparty.isolate
                        jsonValue: 'false'
              -
                name: Enable Firefox tracking protection
                recommend: standard
                docs: |-
                  Firefox provides an option for Enhanced Tracking Protection [1], which blocks trackers that
                  gather information about your browsing behavior without disrupting site functionality [1].
                  This feature also includes protections against harmful scripts such as malware that drain
                  your battery [1].

                  This script enables the `privacy.trackingprotection.enabled` preference [1][2].

                  Note: If you are already using an ad blocker with the correct lists, tracking protection might
                  be redundant.

                  [1]: https://web.archive.org/web/20221025195851/https://support.mozilla.org/en-US/kb/enhanced-tracking-protection-firefox-desktop "Security/Tracking protection - MozillaWiki | support.mozilla.org"
                  [2]: https://web.archive.org/web/20221025195843/https://wiki.mozilla.org/Security/Tracking_protection#Prefs "Enhanced Tracking Protection in Firefox for desktop | Firefox Help | wiki.mozilla.org"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: privacy.trackingprotection.enabled
                    jsonValue: 'true'
              -
                name: Enable Firefox anti-fingerprinting (may break some websites)
                recommend: strict
                docs: |-
                  Fingerprinting Protection is a heavily developed experimental feature in Firefox [1].
                  As part of a project to integrate features from the Tor Browser, Mozilla launched an
                  anti-fingerprinting project in Firefox [2].

                  This script enables the `privacy.resistFingerprinting` preference, activating
                  anti-fingerprinting [1][2].

                  As an experimental feature, it might cause some website breakages [2], such as impacting web
                  speech functionality [3] and favicons [4].

                  [1]: https://web.archive.org/web/20221025201025/https://support.mozilla.org/en-US/kb/firefox-protection-against-fingerprinting "Firefox's protection against fingerprinting | Firefox Help | support.mozilla.org"
                  [2]: https://web.archive.org/web/20221025162743/https://wiki.archlinux.org/title/Firefox/Privacy#Anti-fingerprinting "Firefox/Privacy - ArchWiki | wiki.archlinux.org"
                  [3]: https://web.archive.org/web/20221025201301/https://bugzilla.mozilla.org/show_bug.cgi?id=1636707 "1636707 - Web speech functionality disabled if privacy.resistFingerprinting is set to true | bugzilla.mozilla.org"
                  [4]: https://web.archive.org/web/20221025201422/https://bugzilla.mozilla.org/show_bug.cgi?id=1452391#c5 "1452391 - PNG favicons show up as white square when privacy.resistFingerprinting is enabled | bugzilla.mozilla.org"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: privacy.resistFingerprinting
                    jsonValue: 'true'
              -
                name: Disable WebRTC exposure of your private IP address in Firefox
                recommend: standard
                docs: |-
                  Websites can obtain your local IP address through WebRTC's peer-to-peer protocol, facilitated
                  by JavaScript [1].

                  WebRTC (Web Real-Time Communication) is a free and open-source project offering real-time
                  communication (RTC) via application programming interfaces (APIs) to web browsers and mobile
                  applications [2]. It enables audio and video communication to work inside web pages by facilitating
                  direct peer-to-peer communication, and thereby eliminating the need for plugin installations or native
                  app downloads [3]. Supported by Apple, Google, Microsoft, Mozilla, and Opera, WebRTC's
                  specifications have been published by the World Wide Web Consortium (W3C) and the Internet
                  Engineering Task Force (IETF) [2].

                  [1]: https://web.archive.org/web/20221025162743/https://wiki.archlinux.org/title/Firefox/Privacy#WebRTC_exposes_LAN_IP_address "WebRTC exposes LAN IP address | Firefox/Privacy - ArchWiki | wiki.archlinux.org"
                  [2]: https://web.archive.org/web/20221029173118/https://en.wikipedia.org/wiki/WebRTC "WebRTC - Wikipedia | en.wikipedia.org"
                  [3]: https://web.archive.org/web/20221029173306/https://blogs.trilogy-lte.com/post/77427158750/how-webrtc-is-revolutionizing-telephony "How WebRTC Is Revolutionizing Telephony | blogs.trilogy-lte.com"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: media.peerconnection.ice.default_address_only
                    jsonValue: 'true'
          -
            category: Disable Firefox telemetry
            docs: |-
              By default, Firefox collects telemetry data [1]. This data comprises two main categories:
              **interaction data** and **technical data** [1].

              **Interaction data** includes metrics such as the number of open tabs and windows, the number of
              webpages visited, the number and type of installed Firefox Add-ons, session length, and
              interactions with features offered by Mozilla or third parties. These features may include
              Firefox search features and search partner referrals [1].

              **Technical data** provides information about your Firefox version and language, device operating
              system and hardware configuration, memory, basic crash and error information, as well as the
              outcome of automated processes like updates and safe browsing [1].

              Note that Firefox logs your personally identifiable IP address [1].

              [1]: https://web.archive.org/web/20220901045358/https://support.mozilla.org/en-US/kb/telemetry-clientid "Telemetry collection and deletion | Firefox Help | support.mozilla.org"
            children:
              -
                name: Disable collection of technical and interaction data in Firefox
                recommend: standard
                docs: |-
                  This script alters the `datareporting.healthreport.uploadEnabled` preference, effectively
                  disabling it. This preference regulates whether Firefox sends telemetry data [1].

                  The script halts all data transmitted from Firefox to Mozilla via Telemetry [2], preventing
                  Firefox from sending technical and interaction data to Mozilla [3].

                  For reasons of military security, it's recommended by the U.S. government (NIST 800-53) that
                  this data collection is disabled [4].

                  [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                  [2]: https://web.archive.org/web/20221015103136/https://bugzilla.mozilla.org/show_bug.cgi?id=1195552#c4
                  [3]: https://web.archive.org/web/20221015102419/https://bugzilla.mozilla.org/show_bug.cgi?id=1422689#c1
                  [4]: https://web.archive.org/web/20221015103404/https://www.stigviewer.com/stig/mozilla_firefox/2019-01-02/finding/V-79053
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: datareporting.healthreport.uploadEnabled
                    jsonValue: 'false'
              -
                name: Disable detailed telemetry collection in Firefox
                recommend: standard
                docs: |-
                  This script disables the `toolkit.telemetry.enabled` preference, which controls whether the
                  Telemetry module is enabled [1].

                  It's configured to be enabled in nightly, aurora, beta, or default (developer) builds.
                  In release builds, however, it's set to false [1]. This setting is hard-coded into the C++
                  code to prevent easy disabling [2]. Developers have been approached about this issue, but
                  have rejected proposals to unlock it [3].

                  Mozilla's plan is to deprecate this setting eventually, followed by removal [1].

                  This preference controls telemetry verbosity and configures Firefox to collect less data [3].

                  For reasons of military security, the U.S. government (NIST 800-53) recommends disabling this
                  setting [4].

                  [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                  [2]: https://web.archive.org/web/20221015102338/https://searchfox.org/mozilla-central/source/modules/libpref/Preferences.cpp#3213
                  [3]: https://web.archive.org/web/20221015102419/https://bugzilla.mozilla.org/show_bug.cgi?id=1422689#c1
                  [4]: https://web.archive.org/web/20221015102604/https://stigviewer.com/stig/mozilla_firefox/2020-12-10/finding/V-223170
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: toolkit.telemetry.enabled
                    jsonValue: 'false'
              -
                name: Disable archiving of Firefox telemetry
                recommend: standard
                docs: |-
                  This script configures the `toolkit.telemetry.archive.enabled` preference to be disabled, thus
                  preventing telemetry pings from being archived locally [1].

                  For reasons of military security, the U.S. government (NIST 800-53) recommends disabling this
                  setting [2].

                  [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                  [2]: https://web.archive.org/web/20221015104801/https://stigviewer.com/stig/mozilla_firefox/2020-12-10/finding/V-223171
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: toolkit.telemetry.archive.enabled
                    jsonValue: 'false'
              -
                category: Disable Firefox telemetry logs
                docs: |-
                  Firefox logs telemetry information in various locations, such as the console and `stdout` [1].
                  This logged information reveals details about your usage pattern.

                  [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                children:
                  -
                    name: Minimize Firefox telemetry logging verbosity
                    recommend: standard
                    docs: |-
                      This script sets the `toolkit.telemetry.log.level` preference to the least verbosity to minimize logs.
                      This preference adjusts the telemetry logging verbosity as per `Log.jsm` [1].
                      By default, logging is restricted to the console service [1].
                      It displays telemetry information in the browser console [2] and can be used to monitor telemetry activity
                      in the JavaScript console [3]. This process is also referred to as telemetry tracing [4].

                      The output can be accessed via the DevTools console [4], navigable through the menu by selecting
                      "Tools" => "Developer Tools" => "Error Console" (CTRL+SHIFT+J).

                      The available verbosity levels, in descending order, are `Trace`, `Debug`, `Config`, `Info`, `Warn` (default),
                      `Error`, and `Fatal` [1].

                      [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                      [2]: https://web.archive.org/web/20221029134403/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/start/index.html "Getting started | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                      [3]: https://web.archive.org/web/20221025154541/https://hg.mozilla.org/comm-central/rev/f8a6cf1ee08f8223c36bb92414e29734d8d6c9d9 "comm-central: changeset 28531:f8a6cf1ee08f8223c36bb92414e29734d8d6c9d9 | hg.mozilla.org"
                      [4]: https://web.archive.org/web/20221025154517/https://hg.mozilla.org/comm-central/file/tip/mail/components/telemetry/README.md#l81 "comm-central: mail/components/telemetry/README.md@a2958dfb3462eac068cb1a2c75c5213fc4808b1a | hg.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: toolkit.telemetry.log.level
                        jsonValue: >-
                          "Fatal"
                  -
                    name: Disable Firefox telemetry log output
                    recommend: standard
                    docs: |-
                      This script adjusts the `toolkit.telemetry.log.dump` setting to its most restricted value.
                      This preference controls whether to dump telemetry log messages to `stdout` [1].

                      [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: toolkit.telemetry.log.dump
                        jsonValue: >-
                          "Fatal"
              -
                name: Clear Firefox telemetry user ID
                recommend: standard
                docs: |-
                  Firefox uses `toolkit.telemetry.cachedClientID` as an identifier for the client and/or the user [1] [2] [3].
                  This ID is static and is used to identify the user [3].

                  [1]: https://web.archive.org/web/20221025162743/https://wiki.archlinux.org/title/Firefox/Privacy "Firefox/Privacy - ArchWiki | wiki.archlinux.org"
                  [2]: https://web.archive.org/web/20221025163051/https://hg.mozilla.org/mozilla-central/file/tip/toolkit/components/telemetry/app/TelemetryUtils.jsm#l101 "mozilla-central: toolkit/components/telemetry/app/TelemetryUtils.jsm@41ff1810fc5e1ee4ccdea2f1f81fcfc6d04d0fa1"
                  [3]: https://web.archive.org/web/20221025163051/https://hg.mozilla.org/mozilla-central/file/tip/toolkit/components/telemetry/app/TelemetryUtils.jsm#l29 "mozilla-central: toolkit/components/telemetry/app/TelemetryUtils.jsm@41ff1810fc5e1ee4ccdea2f1f81fcfc6d04d0fa1"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: toolkit.telemetry.cachedClientID
                    jsonValue: '""'
              -
                category: Disable Firefox telemetry pings
                docs: |-
                  A telemetry ping refers to the data that Firefox transmits to Mozilla's Telemetry servers [1].
                  It comes in different types and includes information collected by telemetry [1].

                  [1]: https://web.archive.org/web/20221025163526/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/concepts/pings.html "Telemetry pings | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                children:
                  -
                    name: Disable pings to Firefox telemetry server
                    recommend: standard
                    docs: |-
                      This script sets `toolkit.telemetry.server` to be empty.
                      This preference defines the server to which telemetry pings are sent [1].

                      [1]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: toolkit.telemetry.server
                        jsonValue: '""'
                  -
                    name: Disable Firefox shutdown ping
                    recommend: standard
                    docs: |-
                      The shutdown ping provides data about a clean shutdown [1].

                      This script turns off three preferences to disable shutdown pings:

                      1. `toolkit.telemetry.shutdownPingSender.enabled`: This preference permits the shutdown ping
                      to be sent when the browser is closed from the second browsing session onwards, as opposed
                      to on the next restart, through the ping sender [2].
                      2. `toolkit.telemetry.shutdownPingSender.enabledFirstSession`: This preference allows the
                      shutdown ping to be sent through the ping sender from the first browsing session [2].
                      3. `toolkit.telemetry.firstShutdownPing.enabled`: This preference permits a duplicate of
                      the main shutdown ping from the first browsing session to be sent as a separate
                      `first-shutdown` ping [2].

                      [1]: https://web.archive.org/web/20221030201323/https://wiki.mozilla.org/QA/Shutdown_Ping#Test_Objectives "QA/Shutdown Ping - MozillaWiki | wiki.mozilla.org"
                      [2]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                    call:
                      -
                        function: AddFirefoxPrefs
                        parameters:
                          prefName: toolkit.telemetry.shutdownPingSender.enabled
                          jsonValue: 'false'
                      -
                        function: AddFirefoxPrefs
                        parameters:
                          prefName: toolkit.telemetry.shutdownPingSender.enabledFirstSession
                          jsonValue: 'false'
                      -
                        function: AddFirefoxPrefs
                        parameters:
                          prefName: toolkit.telemetry.firstShutdownPing.enabled
                          jsonValue: 'false'
                  -
                    name: Disable Firefox new profile ping
                    recommend: standard
                    docs: |-
                      This script disables the `new-profile` ping sent from Firefox Desktop.

                      This ping is typically sent 30 minutes after the browser starts, during the first session of
                      a newly created profile [1]. If the first session of a new profile is shorter than
                      30 minutes, the ping is sent at shutdown using the Ping Sender [1].

                      This script sets the `toolkit.telemetry.newProfilePing.enabled` preference to disabled,
                      which effectively disables the `new-profile` ping for new profiles [2].

                      [1]: https://web.archive.org/web/20221025172041/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/data/new-profile-ping.html "“new-profile” ping | Firefox Source Docs documentation"
                      [2]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: toolkit.telemetry.newProfilePing.enabled
                        jsonValue: 'false'
                  -
                    name: Disable Firefox update ping
                    recommend: standard
                    docs: |-
                      This script disables the `update` ping sent from Firefox Desktop.

                      This ping is sent when a browser update is ready to be applied and also after the update has
                      been successfully applied [1].

                      This script sets the `toolkit.telemetry.updatePing.enabled` preference to disabled,
                      which turns off the "update" ping associated with browser updates [2].

                      [1]: https://web.archive.org/web/20221025174136/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/data/update-ping.html "“update” ping | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                      [2]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: toolkit.telemetry.updatePing.enabled
                        jsonValue: 'false'
                  -
                    name: Disable Firefox prio ping
                    recommend: standard
                    docs: |-
                      This script disables the `prio` ping sent from Firefox Desktop.

                      The ping is submitted at least once a day for sessions that last longer than 24 hours [1],
                      and it is enabled by default [2].

                      It sends **Origin Telemetry** [1], which allows Mozilla to get precise counts of how
                      many Firefox clients perform certain activities on specific origins without revealing
                      which clients were doing which things on which origins [3].

                      This script sets the `toolkit.telemetry.prioping.enabled` preference to disabled, which
                      turns off the `prio` ping [2].

                      [1]: https://web.archive.org/web/20221025174031/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/data/prio-ping.html "“prio” ping | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                      [2]: https://web.archive.org/web/20221015102124/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                      [3]: https://web.archive.org/web/20221025174037/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/collection/origin.html#origintelemetry "Origin Telemetry | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
                    call:
                      function: AddFirefoxPrefs
                      parameters:
                        prefName: toolkit.telemetry.prioping.enabled
                        jsonValue: 'false'
          -
            name: Disable connection tests (breaks automatic Wi-Fi login)
            docs: |-
              This script turns off the Firefox Captive Portal detection feature.

              Firefox uses this feature to determine if a network connection requires a login, such as a
              public Wi-Fi hotspot [1]. The test involves initiating an outgoing connection to Mozilla servers [1].

              By default, these connection attempts occur at regular intervals [2][3].

              This functionality could potentially expose your usage habits [4]. For instance, a public venue
              like a hotel or restaurant might require you to input a password for internet access. If such a
              portal is in place and blocking traffic, this feature prevents all other connection attempts,
              possibly revealing your usage habits.

              See also: [Captive portal | Wikipedia](https://web.archive.org/web/20221029163002/https://en.wikipedia.org/wiki/Captive_portal).

              This script sets `network.captive-portal-service.enabled` to 'false', thereby disabling automatic
              connections [1].

              > **Caution:** Firefox will no longer offer to open the sign-in page of a public Wi-Fi network,
              > so you have to navigate to it yourself. This is why the script is not part of any
              > recommendation preset.

              [1]: https://web.archive.org/web/20221025194630/https://support.mozilla.org/en-US/kb/how-stop-firefox-making-automatic-connections#w_network-detection "How to stop Firefox from making automatic connections | Firefox Help | support.mozilla.org"
              [2]: https://web.archive.org/web/20221025201801/https://bugzilla.mozilla.org/show_bug.cgi?id=1363651 "1363651 - http://detectportal.firefox.com/ is hammering our firewalls | bugzilla.mozilla.org"
              [3]: https://web.archive.org/web/20221025201846/https://bugzilla.mozilla.org/show_bug.cgi?id=1359697#c3 "1359697 - Don't poll for captive portal detection | bugzilla.mozilla.org"
              [4]: https://web.archive.org/web/20221025162743/https://wiki.archlinux.org/title/Firefox/Privacy "Firefox/Privacy - ArchWiki | wiki.archlinux.org"
            call:
              function: AddFirefoxPrefs
              parameters:
                prefName: network.captive-portal-service.enabled
                jsonValue: 'false'
          -
            category: Disable Firefox Phishing Protection (Safe Browsing) (decreases security)
            docs: |-
              Firefox's Safe Browsing feature, now referred to as Phishing Protection, is still internally
              recognized as "Safe Browsing" [1].

              To provide protection against phishing and malware, Firefox transmits the following data:

              1. Partial address information for visited webpages [2].
              2. Details such as name, origin, size, and hash of contents for downloaded files [2].

              This data is sent to Google Safe Browsing [2] to aid in issuing warnings for downloaded files and
              visited sites [2].

              While Phishing Protection bolsters your security, it may decrease your privacy as it involves
              sending data about the websites you visit and files you download to Google [1][2].

              There have been concerns about the potential for Google Safe Browsing to be used for censorship
              in the future, although this has not occurred as of yet [3].

              > **Caution:** Turning these protections off removes Firefox's warnings about phishing sites and
              > malicious downloads. None of these scripts belong to a recommendation preset; select them only
              > if you understand and accept the trade-off.

              [1]: https://web.archive.org/web/20221026164502/https://wiki.mozilla.org/Security/Safe_Browsing "Security/Safe Browsing - MozillaWiki | wiki.mozilla.org"
              [2]: https://web.archive.org/web/20221025193000/https://support.mozilla.org/en-US/kb/how-does-phishing-and-malware-protection-work#w_what-information-is-sent-to-mozilla-or-its-partners-when-phishing-and-malware-protection-is-enabled
              [3]: https://web.archive.org/web/20221025192516/https://www.usnews.com/opinion/articles/2016-06-22/google-is-the-worlds-biggest-censor-and-its-power-must-be-regulated "Google Is the World's Biggest Censor and Its Power Must Be Regulated | usnews.com"
            children:
              -
                name: Disable blocking of unstable plugins in Firefox
                docs: |-
                  This script sets `browser.safebrowsing.blockedURIs.enabled` to 'false', thereby disabling plugin
                  stability blocking [1].

                  Disabling this feature might have mixed implications:

                  - Disabling the blocking of unstable plugins can potentially expose the user to vulnerabilities associated with these plugins.
                  These plugins may include malware, which would compromise user privacy and data.
                  - It removes the need for data communication via Mozilla servers `addons.mozilla.org` for list retrieval [2]. This feature requires
                  frequent requests to download large amount of data.

                  If this blocking is removed, the user should be knowledgeable about the potential risks and will take precautions.

                  [1]: https://web.archive.org/web/20221026164502/https://wiki.mozilla.org/Security/Safe_Browsing#Prefs "Security/Safe Browsing - MozillaWiki | wiki.mozilla.org"
                  [2]: https://web.archive.org/web/20230811024650/https://blog.mozilla.org/addons/2020/08/24/introducing-a-scalable-add-ons-blocklist/ "Introducing a scalable add-ons blocklist | Mozilla Add-ons Community Blog"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: browser.safebrowsing.blockedURIs.enabled
                    jsonValue: 'false'
              -
                name: Disable Firefox application reputation checks for downloads
                docs: |-
                  This script pertains to a feature that safeguards users from malware downloads [1].

                  This protective measure operates by transmitting downloaded URL and file data to
                  Google's servers [3].

                  The script modifies `browser.safebrowsing.downloads.enabled` to a disabled state.
                  This adjustment consequently disables application reputation checks for downloaded files [1] [2].
                  Inhibiting this feature concurrently disables remote lookups
                  (`browser.safebrowsing.downloads.remote.enabled`) [1].

                  Read more: [Security/Features/Application Reputation Design Doc | wiki.mozilla.org](https://web.archive.org/web/20221025204612/https://wiki.mozilla.org/Security/Features/Application_Reputation_Design_Doc)

                  [1]: https://web.archive.org/web/20221025204436/https://wiki.mozilla.org/Security/Download_Protection "Security/Download Protection - MozillaWiki | wiki.mozilla.org"
                  [2]: https://web.archive.org/web/20221025162743/https://wiki.archlinux.org/title/Firefox/Privacy#Disable_.27Safe_Browsing.27_service "Firefox/Privacy - ArchWiki | wiki.archlinux.org"
                  [3]: https://web.archive.org/web/20221025204612/https://wiki.mozilla.org/Security/Features/Application_Reputation_Design_Doc "Security/Features/Application Reputation Design Doc - MozillaWiki | wiki.mozilla.org"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: browser.safebrowsing.downloads.enabled
                    jsonValue: 'false'
              -
                name: Disable Firefox malware protection
                docs: |-
                  Mozilla Firefox maintains a list of known malware, and checks user downloads against
                  this list [1]. If the user downloads a file that matches an entry in the list, a warning
                  can be displayed [1].

                  This script modifies `browser.safebrowsing.malware.enabled` to a disabled state.
                  This preference dictates whether to enable malware checks [1].
                  Disabling it halts the downloading of malware blacklists and ceases checks on downloads [1].
                  It is active by default [1].

                  Note that disabling this protection disrupts application reputation checks for downloaded files,
                  since it relies on this feature [2].

                  [1]: https://web.archive.org/web/20221025211950/https://kb.mozillazine.org/Browser.safebrowsing.malware.enabled "Browser.safebrowsing.malware.enabled - MozillaZine Knowledge Base | kb.mozillazine.org"
                  [2]: https://web.archive.org/web/20221025204436/https://wiki.mozilla.org/Security/Download_Protection "Security/Download Protection - MozillaWiki | wiki.mozilla.org"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: browser.safebrowsing.malware.enabled
                    jsonValue: 'false'
              -
                name: Disable Firefox phishing protection
                docs: |-
                  This script modifies `browser.safebrowsing.phishing.enabled` to a disabled state.
                  This preference determines whether to enable phishing protection [1] [2].

                  It is active by default [2].

                  [1]: https://web.archive.org/web/20221026164502/https://wiki.mozilla.org/Security/Safe_Browsing#Prefs "Security/Safe Browsing - MozillaWiki | wiki.mozilla.org"
                  [2]: https://web.archive.org/web/20221029173442/https://github.com/mozilla/policy-templates/blob/master/README.md#preferences "policy-templates/README.md at master · mozilla/policy-templates · GitHub | github.com"
                call:
                  function: AddFirefoxPrefs
                  parameters:
                    prefName: browser.safebrowsing.phishing.enabled
                    jsonValue: 'false'
      -
        category: Configure Chrome
        docs: |-
          Google Chrome is Google's web browser. These scripts configure it through policies, the settings that
          organizations use to manage Chrome [1] [2].

          On Linux, Chrome reads policies from JSON files in `/etc/opt/chrome/policies/managed`, and applies all files
          in that folder [1] [2]. Each script writes its own file there, named `privacy-sexy-<policy>.json`, and
          reverting deletes it again. A policy set this way cannot be changed in Chrome's settings while the file
          exists. Chrome applies it the next time it starts.

          The scripts skip the change if Chrome is not installed. The Flathub package of Chrome links the policy files
          from this folder into its sandbox, so it follows them too [3]. Other sandboxed packages may not read them.

          [1]: https://web.archive.org/web/20260921180014/https://www.chromium.org/administrators/linux-quick-start/ "Linux Quick Start | chromium.org"
          [2]: https://web.archive.org/web/20260608061313/https://support.google.com/chrome/a/answer/9027408?hl=en "2. Set policies - Chrome Enterprise and Education Help | support.google.com"
          [3]: https://web.archive.org/web/20251021212235/https://github.com/flathub/com.google.Chrome/blob/master/chrome.sh "com.google.Chrome/chrome.sh at master · flathub/com.google.Chrome · GitHub | github.com"
        children:
          -
            name: Disable Chrome metrics reporting
            recommend: standard
            docs: |-
              This script stops Chrome from sending usage statistics and crash reports to Google.

              Chrome can report how you use it and send crash reports to Google when this option is turned on in its
              settings. Setting the `MetricsReportingEnabled` policy to `false` turns off this reporting, so no usage
              or crash data is sent to Google, and you can no longer turn it on in the settings [1].

              If you do not run this script, Chrome sends usage statistics and crash reports whenever the option is on.

              [1]: https://web.archive.org/web/20261109171817/https://chromium.googlesource.com/chromium/src/+/main/components/policy/resources/templates/policy_definitions/Miscellaneous/MetricsReportingEnabled.yaml "components/policy/resources/templates/policy_definitions/Miscellaneous/MetricsReportingEnabled.yaml - chromium/src - Git at Google | chromium.googlesource.com"
            call:
              function: SetChromePolicy
              parameters:
                policyName: MetricsReportingEnabled
                jsonValue: 'false'
          -
            name: Disable Chrome running in the background
            recommend: strict # Apps and extensions no longer keep running after the last window closes
            docs: |-
              This script stops Chrome from running in the background after you close its last window.

              In background mode, Chrome keeps running after its windows are closed, so that apps and extensions can
              keep working [1]. Background mode is off at first, but you can turn it on [1]. Setting the
              `BackgroundModeEnabled` policy to `false` turns it off and stops it from being turned on [1].

              > **Consideration:** Apps and extensions that you expect to keep working after you close Chrome stop until
              > you open it again.

              If you do not run this script, Chrome can keep running in the background once background mode is on.

              [1]: https://web.archive.org/web/20261109171856/https://chromium.googlesource.com/chromium/src/+/main/components/policy/resources/templates/policy_definitions/Miscellaneous/BackgroundModeEnabled.yaml "components/policy/resources/templates/policy_definitions/Miscellaneous/BackgroundModeEnabled.yaml - chromium/src - Git at Google | chromium.googlesource.com"
            call:
              function: SetChromePolicy
              parameters:
                policyName: BackgroundModeEnabled
                jsonValue: 'false'
      -
        category: Configure Brave
        docs: |-
          Brave is a web browser by Brave Software that is built on Chromium. These scripts configure it through
          policies, the settings that organizations use to manage Brave [1].

          On Linux, Brave reads policies from JSON files in `/etc/brave/policies/managed/` [1]. Each script writes its
          own file there, named `privacy-sexy-<policy>.json`, and reverting deletes it again. A policy set this way
          cannot be changed in Brave's settings while the file exists. Brave applies it the next time it starts.

          The scripts skip the change if Brave is not installed. The Flathub package of Brave links the policy files
          from this folder into its sandbox, so it follows them too [2]. Other sandboxed packages may not read them.
          Brave Origin reads the same folder, so these policies apply to it as well.

          [1]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
          [2]: https://web.archive.org/web/20261024175012/https://github.com/flathub/com.brave.Browser/blob/master/brave.sh "com.brave.Browser/brave.sh at master · flathub/com.brave.Browser · GitHub | github.com"
        children:
          -
            name: Disable Brave product analytics
            recommend: standard
            docs: |-
              This script turns off Brave's product analytics, called P3A, which are on by default [1].

              Setting the `BraveP3AEnabled` policy to `false` disables P3A [1]. Brave supports this policy since
              version 1.83 [2].

              If you do not run this script, Brave keeps sending product analytics unless you turned them off in its
              settings.

              [1]: https://github.com/brave/brave-core/blob/master/components/policy/resources/templates/policy_definitions/BraveSoftware/BraveP3AEnabled.yaml "BraveP3AEnabled.yaml at master · brave/brave-core · GitHub | github.com"
              [2]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
            call:
              function: SetBravePolicy
              parameters:
                policyName: BraveP3AEnabled
                jsonValue: 'false'
          -
            name: Disable Brave usage ping
            recommend: standard
            docs: |-
              This script turns off the usage ping that Brave sends to Brave Software.

              Setting the `BraveStatsPingEnabled` policy to `false` disables the usage ping [1]. Brave supports this
              policy since version 1.83 [2].

              If you do not run this script, Brave keeps sending its usage ping.

              [1]: https://github.com/brave/brave-core/blob/master/components/policy/resources/templates/policy_definitions/BraveSoftware/BraveStatsPingEnabled.yaml "BraveStatsPingEnabled.yaml at master · brave/brave-core · GitHub | github.com"
              [2]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
            call:
              function: SetBravePolicy
              parameters:
                policyName: BraveStatsPingEnabled
                jsonValue: 'false'
          -
            name: Disable Brave Web Discovery Project
            recommend: standard
            docs: |-
              This script keeps Brave's Web Discovery Project turned off.

              The Web Discovery Project is off unless you turn it on [1]. Setting the `BraveWebDiscoveryEnabled` policy
              to `false` keeps it off, and it can no longer be turned on in Brave's settings [1]. Brave supports this
              policy since version 1.83 [2].

              If you do not run this script, the Web Discovery Project can be turned on in Brave's settings.

              [1]: https://github.com/brave/brave-core/blob/master/components/policy/resources/templates/policy_definitions/BraveSoftware/BraveWebDiscoveryEnabled.yaml "BraveWebDiscoveryEnabled.yaml at master · brave/brave-core · GitHub | github.com"
              [2]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
            call:
              function: SetBravePolicy
              parameters:
                policyName: BraveWebDiscoveryEnabled
                jsonValue: 'false'
          -
            name: Disable Brave Rewards
            recommend: strict # Removes Brave Rewards for users who earn or give rewards with it
            docs: |-
              This script turns off Brave Rewards.

              Setting the `BraveRewardsDisabled` policy to `true` always disables Brave Rewards [1] [2].

              > **Consideration:** You can no longer use Brave Rewards in this browser.

              [1]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
              [2]: https://github.com/brave/brave-core/blob/master/components/policy/resources/templates/policy_definitions/BraveSoftware/BraveRewardsDisabled.yaml "BraveRewardsDisabled.yaml at master · brave/brave-core · GitHub | github.com"
            call:
              function: SetBravePolicy
              parameters:
                policyName: BraveRewardsDisabled
                jsonValue: 'true'
          -
            name: Disable Brave Wallet
            recommend: strict # Removes the built-in crypto wallet and web3 features
            docs: |-
              This script turns off Brave Wallet, the cryptocurrency wallet built into Brave.

              Setting the `BraveWalletDisabled` policy to `true` disables the wallet, web3, and the decentralized DNS
              settings and functionality [1] [2].

              > **Consideration:** You can no longer use Brave Wallet, and websites can no longer reach a wallet through
              > Brave.

              [1]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
              [2]: https://web.archive.org/web/20260217222618/https://github.com/brave/brave-core/blob/master/components/policy/resources/templates/policy_definitions/BraveSoftware/BraveWalletDisabled.yaml "BraveWalletDisabled.yaml at master · brave/brave-core · GitHub | github.com"
            call:
              function: SetBravePolicy
              parameters:
                policyName: BraveWalletDisabled
                jsonValue: 'true'
          -
            name: Disable Brave Leo AI assistant
            recommend: strict # Removes the built-in AI chat assistant
            docs: |-
              This script turns off Leo, the AI chat assistant built into Brave.

              Setting the `BraveAIChatEnabled` policy to `false` always disables AI chat [1] [2].

              > **Consideration:** You can no longer use the AI assistant in Brave.

              [1]: https://web.archive.org/web/20261028190136/https://support.brave.app/hc/en-us/articles/360039248271-Group-Policy "Group Policy - Brave Help Center | support.brave.app"
              [2]: https://github.com/brave/brave-core/blob/master/components/policy/resources/templates/policy_definitions/BraveSoftware/BraveAIChatEnabled.yaml "BraveAIChatEnabled.yaml at master · brave/brave-core · GitHub | github.com"
            call:
              function: SetBravePolicy
              parameters:
                policyName: BraveAIChatEnabled
                jsonValue: 'false'
      -
        name: Disable Thunderbird telemetry
        recommend: standard
        docs: |-
          This script stops Thunderbird, Mozilla's email client, from sending telemetry to its developers.

          Thunderbird sends telemetry by default [1] [2]. Its settings offer an option to turn it off, called "Allow
          Thunderbird to send technical and interaction data to Mozilla" [2] [3], or "Share anonymous performance data
          with Mozilla" in newer versions [11].

          This script sets to `false` the same preferences that Thunderbird's own `DisableTelemetry` policy sets [4]:

          - `datareporting.healthreport.uploadEnabled`, which that option controls [3] and which is required to send
            telemetry [1].
          - `datareporting.policy.dataSubmissionEnabled`, the main switch for data submission [5].
          - `toolkit.telemetry.archive.enabled`, which keeps copies of telemetry data on your computer [5].

          They are written to the `user.js` file of every Thunderbird profile, which Thunderbird reads at every start
          [6]. Profiles are found in `~/.thunderbird` [7], in `~/.config/thunderbird`, which Thunderbird 154 and later
          use for new installations [8], and in the Flatpak and Snap folders
          `~/.var/app/org.mozilla.Thunderbird/.thunderbird` and `~/snap/thunderbird/common/.thunderbird` [9] [10].
          Reverting restores the preferences to the values they had before.

          If you do not run this script, Thunderbird keeps sending telemetry unless you turned it off in its settings.

          [1]: https://web.archive.org/web/20240801091131/https://searchfox.org/comm-central/source/mail/app/profile/all-thunderbird.js "all-thunderbird.js - mozsearch | searchfox.org"
          [2]: https://web.archive.org/web/20260211234224/https://support.mozilla.org/en-US/kb/thunderbird-telemetry "Thunderbird Telemetry | support.mozilla.org"
          [3]: https://web.archive.org/web/20241004072339/https://searchfox.org/comm-central/source/mail/components/preferences/privacy.js "privacy.js - mozsearch | searchfox.org"
          [4]: https://web.archive.org/web/20240803023925/https://searchfox.org/comm-central/source/mail/components/enterprisepolicies/Policies.sys.mjs "Policies.sys.mjs - mozsearch | searchfox.org"
          [5]: https://web.archive.org/web/20260825050609/https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/internals/preferences.html "Preferences and Defines | Firefox Source Docs documentation | firefox-source-docs.mozilla.org"
          [6]: https://web.archive.org/web/20230811005205/https://kb.mozillazine.org/User.js_file "User.js file - MozillaZine Knowledge Base | kb.mozillazine.org"
          [7]: https://web.archive.org/web/20260617145916/https://support.mozilla.org/en-US/kb/profiles-where-thunderbird-stores-user-data "Profiles - Where Thunderbird stores your messages and other user data | support.mozilla.org"
          [8]: https://github.com/mozilla-firefox/firefox/blob/main/toolkit/xre/nsXREDirProvider.cpp "firefox/toolkit/xre/nsXREDirProvider.cpp at main · mozilla-firefox/firefox · GitHub | github.com"
          [9]: https://hg.mozilla.org/comm-central/file/tip/taskcluster/docker/tb-flatpak/repack.sh "taskcluster/docker/tb-flatpak/repack.sh | hg.mozilla.org"
          [10]: https://web.archive.org/web/20240804213019/https://git.launchpad.net/~desktop-snappers/thunderbird/+git/snap/tree/snapcraft.yaml?h=stable "snapcraft.yaml - ~desktop-snappers/thunderbird/+git/snap | git.launchpad.net"
          [11]: https://web.archive.org/web/20261109173030/https://searchfox.org/comm-central/source/mail/locales/en-US/messenger/preferences/preferences.ftl "preferences.ftl - mozsearch | searchfox.org"
        call:
          -
            function: AddThunderbirdPrefs
            parameters:
              prefName: datareporting.healthreport.uploadEnabled
              jsonValue: 'false'
          -
            function: AddThunderbirdPrefs
            parameters:
              prefName: datareporting.policy.dataSubmissionEnabled
              jsonValue: 'false'
          -
            function: AddThunderbirdPrefs
            parameters:
              prefName: toolkit.telemetry.archive.enabled
              jsonValue: 'false'
  -
    category: Security improvements
    docs: |-
      These scripts harden the system against attacks that try to read information they should not have
      access to, and reduce the amount of information the system exposes about itself.

      They configure kernel parameters through `sysctl` [1]. Values are written to a dedicated file in
      `/etc/sysctl.d/` so that files owned by your distribution are never modified, and are applied to the
      running kernel immediately [2].

      [1]: https://web.archive.org/web/20240523090109/https://man7.org/linux/man-pages/man5/sysctl.d.5.html "sysctl.d manual page | man7.org"
      [2]: https://web.archive.org/web/20240418183746/https://man7.org/linux/man-pages/man8/sysctl.8.html "sysctl manual page | man7.org"
    children:
      -
        category: Improve network privacy
        children:
          -
            name: Enable IPv6 privacy extensions
            recommend: standard
            docs: |-
              This script makes your computer use temporary, randomly generated IPv6 addresses for outgoing
              connections.

              By default, many systems build an IPv6 address from a stable interface identifier. Because that
              identifier does not change, every website you visit over IPv6 can link your requests together and
              recognise your device across networks and over long periods of time [1].

              Privacy extensions add a temporary address that is regenerated periodically and used for outgoing
              connections instead [1] [2]. Setting the value to `2` enables them and prefers the temporary
              address [2].

              If you do not run this script, your IPv6 traffic may continue to carry a stable, device-specific
              address.

              [1]: https://web.archive.org/web/20240523111426/https://www.rfc-editor.org/rfc/rfc8981.html "RFC 8981: Temporary Address Extensions for Stateless Address Autoconfiguration in IPv6 | www.rfc-editor.org"
              [2]: https://web.archive.org/web/20240523112038/https://www.kernel.org/doc/html/latest/networking/ip-sysctl.html "IP sysctl | The Linux Kernel documentation | www.kernel.org"
            call:
              -
                function: SetKernelParameter
                parameters:
                  key: net.ipv6.conf.all.use_tempaddr
                  value: '2'
              -
                function: SetKernelParameter
                parameters:
                  key: net.ipv6.conf.default.use_tempaddr
                  value: '2'
      -
        category: Harden the kernel
        children:
          -
            name: Disable unprivileged access to kernel logs
            recommend: standard
            docs: |-
              This script restricts the kernel message buffer so that only administrators can read it.

              The kernel log, readable with `dmesg`, can expose information about your hardware, connected
              devices, file system paths and memory layout [1]. This information helps an attacker who already
              has limited access on the system to learn more about it.

              When this setting is `0`, any user can read the kernel log. Setting it to `1` restricts access to
              users with the `CAP_SYSLOG` capability [1]. Some distributions, including Ubuntu, already use `1`.
              If the running value is already `1` or higher, the script leaves it unchanged.

              If you do not run this script, any local user may be able to read the kernel log.

              [1]: https://web.archive.org/web/20240523112610/https://www.kernel.org/doc/html/latest/admin-guide/sysctl/kernel.html "Documentation for /proc/sys/kernel/ | The Linux Kernel documentation | www.kernel.org"
            call:
              function: SetKernelParameter
              parameters:
                key: kernel.dmesg_restrict
                value: '1'
                keepStricterValue: 'true'
          -
            name: Disable exposure of kernel memory addresses
            recommend: standard
            docs: |-
              This script hides kernel memory addresses from files in `/proc` and from other interfaces.

              Kernel pointers printed in `/proc` reveal where code and data live in memory. An attacker can use
              them to defeat kernel address space layout randomisation and to build a reliable exploit [1].

              When this setting is `0`, addresses are printed as-is. Setting it to `1` replaces them with zeros
              for unprivileged users [1]. `2` hides them from every user, including administrators [1]. If the
              running value is already `1` or higher, the script leaves it unchanged, so a system that uses `2`
              keeps it.

              If you do not run this script, kernel memory addresses may remain readable by unprivileged users.

              [1]: https://web.archive.org/web/20240523112610/https://www.kernel.org/doc/html/latest/admin-guide/sysctl/kernel.html "Documentation for /proc/sys/kernel/ | The Linux Kernel documentation | www.kernel.org"
            call:
              function: SetKernelParameter
              parameters:
                key: kernel.kptr_restrict
                value: '1'
                keepStricterValue: 'true'
          -
            name: Disable process debugging by unrelated processes
            recommend: strict # Prevents debuggers and profilers from attaching to already-running processes
            docs: |-
              This script prevents a program from inspecting the memory of another program unless it started it.

              The `ptrace` interface lets one process read and modify another process's memory [1]. Malicious
              software abuses it to steal passwords, session cookies and encryption keys directly out of the
              memory of programs you are already running.

              When this setting is `0`, any process running as your user can attach to any other process of
              yours. Setting it to `1` allows attaching only to direct descendants [1]. Some distributions,
              including Ubuntu, already use `1`. `2` allows attaching only for administrators and `3` disables
              attaching entirely [1]. If the running value is already `1` or higher, the script leaves it
              unchanged, so a system that uses `2` or `3` keeps it.

              > **Consideration:** Debuggers and profilers can no longer attach to an already-running process,
              > for example `gdb --pid`. Starting a program from inside the debugger continues to work.

              [1]: https://web.archive.org/web/20240523113523/https://www.kernel.org/doc/html/latest/admin-guide/LSM/Yama.html "Yama | The Linux Kernel documentation | www.kernel.org"
            call:
              function: SetKernelParameter
              parameters:
                key: kernel.yama.ptrace_scope
                value: '1'
                keepStricterValue: 'true'
          -
            name: Disable unprivileged eBPF access
            recommend: strict # Prevents unprivileged use of tracing and profiling tools that rely on eBPF
            docs: |-
              This script prevents unprivileged users from loading eBPF programs into the kernel.

              eBPF lets user programs run code inside the kernel, which is used for tracing, profiling and
              network filtering [1]. Because these programs run in the kernel, flaws in the verifier that checks
              them have repeatedly been used to escalate privileges.

              This script sets the value to `2`, which requires administrator privileges to load eBPF
              programs [1]. `1` gives the same restriction but is a one-way latch: once set, the kernel
              rejects further writes to this key until the next reboot, so reverting is impossible.
              Newer kernels already default to `2`.

              > **Consideration:** Tracing and profiling tools that rely on eBPF need to be run as an
              > administrator after this change.

              > **Note:** If the running kernel already holds `1`, this script cannot change the value and
              > a reboot is needed first.

              [1]: https://web.archive.org/web/20240523112610/https://www.kernel.org/doc/html/latest/admin-guide/sysctl/kernel.html "Documentation for /proc/sys/kernel/ | The Linux Kernel documentation | www.kernel.org"
            call:
              function: SetKernelParameter
              parameters:
                key: kernel.unprivileged_bpf_disabled
                value: '2'
          -
            name: Disable automatic loading of TTY line disciplines
            recommend: standard
            docs: |-
              This script stops programs without administrator rights from making the kernel load line discipline
              modules.

              A line discipline is a part of the kernel that sits between a terminal or serial device and the programs
              that use it. When a program asks for a line discipline that is not loaded, the kernel has always loaded its
              module automatically, even though systems rarely use some of these "ancient" line disciplines [1]. Any
              program could make the kernel load them, and so expose their code to an attack.

              When this setting is `1`, any program can trigger the load. Setting it to `0` allows it only for programs
              with the `CAP_SYS_MODULE` capability, which usually means administrators [1] [2]. Line disciplines that
              are already loaded, or built into the kernel, keep working. The setting exists since Linux 5.1 [3], and it
              is `1` unless your distribution changed the default [1].

              If you do not run this script, any local program can make the kernel load rarely used line discipline
              modules.

              [1]: https://web.archive.org/web/20241211212626/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/drivers/tty/Kconfig "Kconfig « tty « drivers - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [2]: https://web.archive.org/web/20240708222908/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/drivers/tty/tty_ldisc.c "tty_ldisc.c « tty « drivers - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [3]: https://web.archive.org/web/20230504131817/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=7c0cca7c847e6e019d67b7d793efbbe3b947d004 "tty: ldisc: add sysctl to prevent autoloading of ldiscs | git.kernel.org"
            call:
              function: SetKernelParameter
              parameters:
                key: dev.tty.ldisc_autoload
                value: '0' # Lower is stricter here, so `keepStricterValue` would skip every run
          -
            name: Disable core dumps of privileged programs
            recommend: strict # Crashes of privileged programs no longer leave a core dump for debugging
            docs: |-
              This script stops programs that run with raised privileges from saving a copy of their memory when they
              crash.

              When a program crashes, the kernel can save a copy of its memory, called a core dump, for debugging. Some
              programs, such as `sudo`, `su` and `passwd`, run with more privileges than the user who starts them, and
              their memory can hold secrets that this user should not see.

              This setting controls core dumps of such programs [1]:

              - `0` does not dump them. It is the kernel default [1].
              - `1` dumps them like any other program, which lets regular users read the memory of privileged
                programs [1].
              - `2` dumps them only to a crash handler program or to a fixed folder that administrators set up [1].

              Many distributions use `2`: systemd sets it since version 246, so that its crash handler can collect these
              dumps [2], and Ubuntu's crash reporter, Apport, sets it each time it starts [3]. This script sets `0` in a
              file in `/etc/sysctl.d` whose name sorts after systemd's file, so it takes precedence [4].

              > **Note:** On Ubuntu, Apport sets the value back to `2` whenever it starts, which happens at every boot
              > while it is enabled [3]. Use this script together with *Disable Apport service* to keep `0`.

              > **Consideration:** Crashes of privileged programs no longer leave a core dump that could help to
              > diagnose them.

              If you do not run this script, the memory of crashed privileged programs may be saved by a crash handler
              on distributions that use `2`.

              [1]: https://web.archive.org/web/20260923214353/https://docs.kernel.org/admin-guide/sysctl/fs.html "Documentation for /proc/sys/fs/ | The Linux Kernel documentation | docs.kernel.org"
              [2]: https://web.archive.org/web/20240724231304/https://github.com/systemd/systemd/commit/6635f57d3eeb16051b00ba331da3c8d4f7e578da "sysctl: enable coredump for suid binaries · systemd/systemd@6635f57 · GitHub | github.com"
              [3]: https://github.com/canonical/apport/blob/da651fef33fccb8661d72d343d1a1b95908b797c/data/apport#L696-L712 "apport/data/apport at da651fef33fccb8661d72d343d1a1b95908b797c · canonical/apport · GitHub | github.com"
              [4]: https://web.archive.org/web/20260921032049/https://man7.org/linux/man-pages/man5/sysctl.d.5.html "sysctl.d(5) - Linux manual page | man7.org"
            call:
              function: SetKernelParameter
              parameters:
                key: fs.suid_dumpable
                value: '0' # Lower is stricter here, so `keepStricterValue` would skip every run
          -
            name: Disable loading a new kernel at runtime
            docs: |-
              This script stops the running kernel from loading another kernel and starting it without a full restart.

              With kexec, the running kernel can load a different kernel and boot into it, through the `kexec_load`
              and `kexec_file_load` system calls [1]. Someone who gains administrator rights could use it to replace the
              running kernel without a normal restart. Setting `kernel.kexec_load_disabled` to `1` disables both system
              calls [1].

              > **Caution:** This is a one-way switch. Once set, kexec stays disabled until the next restart, and the
              > kernel rejects any attempt to change it back [1] [2]. Reverting removes the setting, so kexec is
              > available again after you restart your computer.

              > **Caution:** This breaks kernel crash dumps (kdump), which load a spare kernel through kexec at boot to
              > save the memory of a crashed kernel [3], and `systemctl kexec`, which restarts the system through
              > kexec [4].

              If you do not run this script, administrators and programs running as root can load and start another
              kernel at any time.

              [1]: https://web.archive.org/web/20261102195221/https://docs.kernel.org/admin-guide/sysctl/kernel.html "Documentation for /proc/sys/kernel/ | The Linux Kernel documentation | docs.kernel.org"
              [2]: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/kernel/kexec_core.c "kexec_core.c « kernel - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [3]: https://web.archive.org/web/20260225182814/https://documentation.ubuntu.com/server/how-to/software/kernel-crash-dump/ "Kernel crash dump - Ubuntu Server documentation | documentation.ubuntu.com"
              [4]: https://web.archive.org/web/20261024021910/https://man7.org/linux/man-pages/man1/systemctl.1.html "systemctl(1) - Linux manual page | man7.org"
            call:
              function: SetKernelParameter
              parameters:
                key: kernel.kexec_load_disabled
                value: '1'
                revertNeedsRestart: 'true' # The kernel refuses to set it back to `0` until the next restart
      -
        category: Disable rarely used kernel modules
        docs: |-
          The Linux kernel loads most of its drivers as modules when it needs them, for example when a device is
          connected or when a drive is mounted. Some of these drivers are for hardware and formats that most computers
          never use, but the kernel still loads them on request, which exposes their code to anyone who can trigger
          that.

          These scripts stop the kernel from loading such modules with a file in `/etc/modprobe.d`, where `modprobe`
          reads its configuration from [1]. For each module, the file contains:

          - `blacklist <module>`, so that `modprobe` ignores the module's aliases [1] [2]. Automatic loading goes
            through these aliases, both for a device that is connected and for a file system that is mounted [2] [3].
          - `install <module> /bin/false`, so that loading the module by its name, for example because another module
            depends on it, runs `/bin/false` instead and fails [1].

          Reverting deletes the file, unless it changed after privacy.sexy created it. Modules that are already loaded
          stay loaded until you restart your computer.

          [1]: https://web.archive.org/web/20261107172821/https://man7.org/linux/man-pages/man5/modprobe.d.5.html "modprobe.d(5) - Linux manual page | man7.org"
          [2]: https://github.com/kmod-project/kmod/blob/master/libkmod/libkmod.h "kmod/libkmod/libkmod.h at master · kmod-project/kmod · GitHub | github.com"
          [3]: https://web.archive.org/web/20240810091436/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/fs/filesystems.c "filesystems.c « fs - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
        children:
          -
            name: Disable FireWire direct memory access
            recommend: strict # Stops FireWire devices such as audio interfaces, cameras and disks from working
            docs: |-
              This script stops the FireWire drivers from loading, so that FireWire devices can no longer access your
              computer's memory.

              A FireWire (IEEE 1394) controller can read and write the computer's memory directly, without the processor,
              when another device on the FireWire bus asks for it [1]. The Linux driver filters these requests by
              default [1] [2], but it allows them from every device that presents itself as a FireWire storage device
              (SBP-2) [3]. A malicious device plugged into a FireWire port can use this to read or change anything in
              memory, including passwords and encryption keys.

              This script blocks the `firewire-core`, `firewire-ohci` and `firewire-sbp2` modules [4].

              Debian and Ubuntu also put the FireWire drivers into the initial RAM disk that starts the system, together
              with a copy of `/etc/modprobe.d` [5] [6]. The script therefore rebuilds it with `update-initramfs` where that
              command exists, which can take a minute. Reverting deletes the file and rebuilds it again.

              > **Caution:** FireWire devices, such as audio interfaces, video cameras and external disks, stop working.
              > Drivers that are loaded right now stay loaded until you restart your computer.

              If you do not run this script, a FireWire device connected to your computer may be able to read and change
              its memory.

              [1]: https://web.archive.org/web/20261016010614/https://docs.kernel.org/core-api/debugging-via-ohci1394.html "Using physical DMA provided by OHCI-1394 FireWire controllers for debugging | The Linux Kernel documentation | docs.kernel.org"
              [2]: https://web.archive.org/web/20261109165146/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/drivers/firewire/ohci.c "ohci.c « firewire « drivers - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [3]: https://web.archive.org/web/20261109170334/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/drivers/firewire/sbp2.c "sbp2.c « firewire « drivers - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [4]: https://web.archive.org/web/20261109163700/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/drivers/firewire/Makefile "Makefile « firewire « drivers - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [5]: https://salsa.debian.org/kernel-team/initramfs-tools/-/raw/debian/latest/hook-functions "hook-functions | initramfs-tools | salsa.debian.org"
              [6]: https://salsa.debian.org/kernel-team/initramfs-tools/-/raw/debian/latest/mkinitramfs "mkinitramfs | initramfs-tools | salsa.debian.org"
            call:
              function: BlockKernelModules
              parameters:
                fileName: privacy-sexy-firewire.conf
                modules: firewire-core firewire-ohci firewire-sbp2
                rebuildInitramfs: 'true'
          -
            name: Disable rarely used filesystems
            recommend: strict # Drives and images that use these file systems can no longer be opened
            docs: |-
              This script stops the kernel from loading drivers for file systems that desktop computers rarely need.

              When something mounts a file system, the kernel loads the matching driver automatically [1]. Desktop
              environments mount USB drives and other removable media as soon as they are connected, so a drive with an
              unusual file system can make the kernel load and run a driver that is otherwise never used.

              This script blocks these drivers:

              - `cramfs`: a compressed, read-only file system for small ROM chips in embedded devices [2].
              - `freevxfs`: reads the VERITAS VxFS file system of SCO UnixWare and other old Unix systems [3]. Linux 7.3
                removed this driver, so blocking it makes no difference there [4].
              - `jffs2`: a file system for flash memory chips in embedded devices [5].
              - `hfs`: the original file system of Macintosh computers [6]. Its successor, HFS+ (`hfsplus`), is not
                blocked.

              It does not block file systems that desktops use, such as those of USB drives, DVDs and Snap packages.

              > **Caution:** You can no longer open drives, disk images or firmware images that use these file systems.

              If you do not run this script, connecting a drive with one of these file systems can make the kernel load
              its driver.

              [1]: https://web.archive.org/web/20240810091436/https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/fs/filesystems.c "filesystems.c « fs - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [2]: https://web.archive.org/web/20260914204202/https://docs.kernel.org/filesystems/cramfs.html "Cramfs - cram a filesystem onto a small ROM | The Linux Kernel documentation | docs.kernel.org"
              [3]: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/fs/freevxfs/Kconfig?h=v7.2 "Kconfig « freevxfs « fs - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [4]: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=a3ed4fcd04b95347ad04cf4409b394bb7fbd0c02 "freevxfs: remove the driver | git.kernel.org"
              [5]: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/fs/jffs2/Kconfig "Kconfig « jffs2 « fs - kernel/git/torvalds/linux.git - Linux kernel source tree | git.kernel.org"
              [6]: https://web.archive.org/web/20260901211825/https://docs.kernel.org/filesystems/hfs.html "Macintosh HFS Filesystem for Linux | The Linux Kernel documentation | docs.kernel.org"
            call:
              function: BlockKernelModules
              parameters:
                fileName: privacy-sexy-filesystems.conf
                modules: cramfs freevxfs jffs2 hfs
      -
        category: Harden the GNOME desktop
        docs: |-
          These scripts change GNOME settings for the user who runs the script, through GSettings [1]. Settings that do
          not exist on the current system are skipped, so the scripts are safe to run on other desktops. Reverting
          restores the value that was set before.

          [1]: https://web.archive.org/web/20240404013714/https://manpages.ubuntu.com/manpages/jammy/man1/gsettings.1.html "gsettings manual page | manpages.ubuntu.com"
        children:
          -
            name: Disable automatic running of software from removable media in GNOME
            recommend: standard
            docs: |-
              This script stops GNOME from starting programs, or asking you whether to start them, when you insert a
              disc, USB drive or other removable media.

              Unless this setting is on, GNOME can offer to run software that comes on the medium, or start the
              application you chose for its type of content [1]. A malicious drive can use this to get you to run
              its software with a single click. Setting `autorun-never` to `true` turns off these prompts and automatic
              starts [1]. In GNOME Settings, it matches the "Media Autostart" switch being off [2].

              GNOME 45 and later already use `true` by default [3], so this mostly changes older GNOME versions and
              distributions that changed the default.

              > **Consideration:** Inserting a camera, phone or music player no longer opens an application for it.

              If you do not run this script on an older GNOME version, inserting removable media can prompt you to run
              software from it.

              [1]: https://web.archive.org/web/20261109165503/https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/raw/51.0/schemas/org.gnome.desktop.media-handling.gschema.xml.in "org.gnome.desktop.media-handling.gschema.xml.in (tag 51.0) | gitlab.gnome.org"
              [2]: https://web.archive.org/web/20261109164117/https://gitlab.gnome.org/GNOME/gnome-control-center/-/raw/51.1/panels/applications/cc-default-apps-page.c "cc-default-apps-page.c (tag 51.1) | gitlab.gnome.org"
              [3]: https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/commit/22076eab687958de1b0f3c63c8eec685c4c74e48 "media-handling: Don't autostart software by default when media is inserted | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.desktop.media-handling
                key: autorun-never
                value: 'true'
          -
            name: Disable automatic mounting of removable media in GNOME
            recommend: strict # Connected drives must be opened by hand before use
            docs: |-
              This script stops GNOME from mounting drives and removable media automatically, and from opening a window
              for them.

              By default, GNOME mounts drives and removable media as soon as they are connected, and opens a folder for
              media whose type of content it does not recognize [1]. Mounting makes the kernel read the drive's file
              system, so a drive prepared by an attacker reaches the file system code of the kernel just by being
              plugged in. This script sets `automount` and `automount-open` to `false` [1].

              > **Consideration:** Connected drives are no longer opened for you. Open them in the Files application
              > to mount them before you use them.

              If you do not run this script, every drive you connect is mounted automatically.

              [1]: https://web.archive.org/web/20261109165503/https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/raw/51.0/schemas/org.gnome.desktop.media-handling.gschema.xml.in "org.gnome.desktop.media-handling.gschema.xml.in (tag 51.0) | gitlab.gnome.org"
            call:
              -
                function: SetGnomeSetting
                parameters:
                  schema: org.gnome.desktop.media-handling
                  key: automount
                  value: 'false'
              -
                function: SetGnomeSetting
                parameters:
                  schema: org.gnome.desktop.media-handling
                  key: automount-open
                  value: 'false'
          -
            name: Disable notifications on the GNOME lock screen
            recommend: strict # Notifications that arrive while the screen is locked are seen only after unlocking
            docs: |-
              This script stops GNOME from showing notifications on the lock screen.

              By default, GNOME shows notifications on the lock screen [1], where anyone near your computer can see
              them while it is locked. For each application, it hides the summary and text of the notifications unless
              you allowed them [1], but it still shows that notifications arrived. Setting `show-in-lock-screen` to
              `false` hides them completely [1].

              > **Consideration:** You see notifications that arrived while the screen was locked only after you unlock it.

              If you do not run this script, notifications appear on the lock screen.

              [1]: https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas/-/blob/51.0/schemas/org.gnome.desktop.notifications.gschema.xml.in "org.gnome.desktop.notifications.gschema.xml.in (tag 51.0) | gitlab.gnome.org"
            call:
              function: SetGnomeSetting
              parameters:
                schema: org.gnome.desktop.notifications
                key: show-in-lock-screen
                value: 'false'
      -
        name: Enable firewall to block incoming connections
        docs: |-
          This script turns on ufw (Uncomplicated Firewall), so that your computer blocks incoming network connections
          that no rule allows.

          ufw is the firewall tool that Ubuntu and other distributions ship. It is installed turned off, with a default
          policy that denies incoming connections and allows outgoing ones [1]. Turning it on also starts it at every
          boot [1]. On distributions such as Arch Linux, this also needs `ufw.service` to be enabled [2], which the
          script does if it is not enabled yet.

          The script does nothing if ufw is not installed, if it is already on, or if firewalld is running, because
          firewalld then manages the firewall.

          If an SSH server is running, the script first allows incoming SSH connections on the ports that the server
          listens on, as reported by `sshd -T` (its `Port` and `ListenAddress` settings) [3]. This keeps remote sessions
          working, including one that runs this script. On Ubuntu 22.10 and later, the SSH server can wait for
          connections through `ssh.socket` [4], so the script also allows the ports that this socket listens on. If you
          already have a ufw rule for an SSH port, such as `sudo ufw limit ssh`, the script keeps your rule.

          Reverting turns ufw off and removes the SSH rule, but only if this script turned it on or added the rule. The
          SSH rule stays while ufw is on, so that a remote session is not cut off. Rules that you added yourself are not
          touched.

          > **Caution:**
          > - Services that wait for connections from other devices, such as file sharing, KDE Connect, game servers
          >   or development servers, can no longer be reached from other devices until you allow them with
          >   `sudo ufw allow` [1].
          > - Local virtual machines and containers that use a network bridge, such as LXD, Multipass or Waydroid, can
          >   lose network access, because ufw also blocks the address (DHCP), name (DNS) and forwarded traffic of their
          >   bridge until you allow it.

          If you do not run this script, ufw stays off and every program that listens on the network can be reached by
          other devices on your network.

          [1]: https://web.archive.org/web/20260707102005/https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html "Ubuntu Manpage: ufw - program for managing a netfilter firewall | manpages.ubuntu.com"
          [2]: https://web.archive.org/web/20261109012501/https://wiki.archlinux.org/title/Uncomplicated_Firewall "Uncomplicated Firewall - ArchWiki | wiki.archlinux.org"
          [3]: https://web.archive.org/web/20261019022030/https://man7.org/linux/man-pages/man8/sshd.8.html "sshd(8) - Linux manual page | man7.org"
          [4]: https://web.archive.org/web/20261024002931/https://discourse.ubuntu.com/t/sshd-now-uses-socket-based-activation-ubuntu-22-10-and-later/30189 "SSHd now uses socket-based activation (Ubuntu 22.10 and later) - Server - Ubuntu Discourse | discourse.ubuntu.com"
        # State is kept in `/var/lib/privacy.sexy/state/ufw`: `enabled-firewall` and `enabled-service` record what this
        # script turned on, and `added-rules` lists the SSH rules it added, one per line.
        # `sshd -T` prints `port 22` up to OpenSSH 10.4 and `Port 22` from 10.5, so the key is compared case-insensitively.
        code: |-
          ufw_state_dir='/var/lib/privacy.sexy/state/ufw'
          if ! command -v ufw > /dev/null 2>&1; then
            echo 'Skipping because "ufw" is not found.'
          elif command -v systemctl > /dev/null 2>&1 && systemctl is-active --quiet firewalld; then
            echo 'Skipping, firewalld is active and already manages the firewall.'
          elif LC_ALL=C sudo ufw status | grep --quiet '^Status: active'; then
            echo 'Skipping, ufw is already active.'
          elif ! sudo install --directory --mode=700 "$ufw_state_dir"; then
            >&2 echo "Skipping, could not create \"$ufw_state_dir\" to record the original state."
          else
            ssh_allow_failed='false'
            ssh_server_active='false'
            ssh_socket_ports=''
            if command -v systemctl > /dev/null 2>&1; then
              for ssh_unit in ssh.service sshd.service ssh.socket sshd.socket; do
                if systemctl is-active --quiet "$ssh_unit"; then
                  ssh_server_active='true'
                  if [ "${ssh_unit##*.}" = 'socket' ]; then
                    ssh_socket_ports="$ssh_socket_ports $(systemctl show --property=Listen --value "$ssh_unit" 2>/dev/null \
                      | awk '{ sub(/.*:/, "", $1); if ($1 ~ /^[0-9]+$/) print $1 }')"
                  fi
                fi
              done
            fi
            if [ "$ssh_server_active" = 'false' ] && command -v pgrep > /dev/null 2>&1 && pgrep -x sshd > /dev/null 2>&1; then
              ssh_server_active='true'
            fi
            if [ "$ssh_server_active" = 'true' ]; then
              ssh_ports="$( { sudo sshd -T 2>/dev/null | awk '
                  tolower($1) == "port" { print $2 }
                  tolower($1) == "listenaddress" { sub(/.*:/, "", $2); print $2 }'
                printf '%s\n' $ssh_socket_ports; } | grep --extended-regexp --line-regexp '[0-9]+' | sort --unique)"
              if [ -z "$ssh_ports" ]; then
                ssh_ports='22'
              fi
              for ssh_port in $ssh_ports; do
                ssh_rule="$ssh_port/tcp"
                ssh_existing_rule="$(LC_ALL=C sudo ufw show added \
                  | grep --extended-regexp --line-regexp "ufw (allow|limit|deny|reject)( in)? $ssh_rule( comment .*)?" \
                  | head --lines=1)"
                if [ -n "$ssh_existing_rule" ]; then
                  echo "Keeping your existing rule for incoming SSH connections on $ssh_rule: \"$ssh_existing_rule\"."
                elif sudo ufw allow "$ssh_rule"; then
                  printf '%s\n' "$ssh_rule" | sudo tee -a "$ufw_state_dir/added-rules" > /dev/null
                  echo "Allowed incoming SSH connections on $ssh_rule so that remote sessions keep working."
                else
                  ssh_allow_failed='true'
                  >&2 echo "Failed to allow incoming SSH connections on $ssh_rule."
                fi
              done
            fi
            if [ "$ssh_allow_failed" = 'true' ]; then
              >&2 echo 'Skipping, ufw is not turned on because SSH could not be allowed and remote sessions could be cut off.'
            elif ! sudo ufw --force enable; then
              >&2 echo 'Failed to turn on ufw.'
            else
              sudo touch "$ufw_state_dir/enabled-firewall"
              echo 'Successfully turned on ufw. It blocks incoming connections that no rule allows.'
              if command -v systemctl > /dev/null 2>&1 \
                  && [ "$(systemctl show --property=LoadState --value ufw.service 2>/dev/null)" = 'loaded' ] \
                  && ! systemctl is-enabled --quiet ufw.service; then
                if sudo systemctl enable ufw.service; then
                  sudo touch "$ufw_state_dir/enabled-service"
                  echo 'Enabled ufw.service so that the firewall starts at boot.'
                else
                  >&2 echo 'Failed to enable ufw.service; the firewall may be off after a restart.'
                fi
              fi
            fi
          fi
        revertCode: |-
          ufw_state_dir='/var/lib/privacy.sexy/state/ufw'
          if [ ! -d "$ufw_state_dir" ]; then
            echo 'Skipping, privacy.sexy did not turn on ufw or add a rule.'
          elif ! command -v ufw > /dev/null 2>&1; then
            >&2 echo 'Cannot revert because "ufw" is not found.'
          else
            if [ -e "$ufw_state_dir/enabled-firewall" ]; then
              if LC_ALL=C sudo ufw status | grep --quiet '^Status: active' && ! sudo ufw disable; then
                >&2 echo 'Failed to turn off ufw.'
              else
                sudo rm -f -- "$ufw_state_dir/enabled-firewall"
                echo 'ufw is off again, as it was before privacy.sexy turned it on.'
              fi
            fi
            if [ -e "$ufw_state_dir/enabled-service" ]; then
              if sudo systemctl disable ufw.service; then
                sudo rm -f -- "$ufw_state_dir/enabled-service"
                echo 'Disabled ufw.service again.'
              else
                >&2 echo 'Failed to disable ufw.service.'
              fi
            fi
            if [ -e "$ufw_state_dir/added-rules" ] \
                && LC_ALL=C sudo ufw status | grep --quiet '^Status: active'; then
              echo 'Kept the rules that allow incoming SSH connections, because ufw is still active.'
            elif [ -e "$ufw_state_dir/added-rules" ]; then
              ufw_rules_left='false'
              while IFS= read -r ufw_rule; do
                if [ -z "$ufw_rule" ]; then
                  continue
                fi
                if sudo ufw --force delete allow "$ufw_rule"; then
                  echo "Removed the rule that allowed incoming SSH connections on $ufw_rule."
                else
                  ufw_rules_left='true'
                  >&2 echo "Failed to remove the rule that allows incoming SSH connections on $ufw_rule."
                fi
              done < <(sudo cat -- "$ufw_state_dir/added-rules")
              if [ "$ufw_rules_left" = 'false' ]; then
                sudo rm -f -- "$ufw_state_dir/added-rules"
              fi
            fi
            sudo rmdir -- "$ufw_state_dir" 2>/dev/null || true
          fi
functions:
  -
    name: RunInlineCode
    #   Marked: refactor-with-partials
    #     Same function in macOS, Linux, Windows
    parameters:
      - name: code
      - name: revertCode
        optional: true
    code: '{{ $code }}'
    revertCode: '{{ with $revertCode }}{{ . }}{{ end }}'
  -
    name: RunIfCommandExists # Skips if command does not exist
    #   Marked: refactor-with-partials
    #     Same function as macOS
    parameters:
      - name: command
      - name: code
      - name: revertCode
        optional: true
    code: |-
      if ! command -v '{{ $command }}' &> /dev/null; then
        echo 'Skipping because "{{ $command }}" is not found.'
      else
        {{ $code }}
      fi
    revertCode: |-
      {{ with $revertCode }}
        if ! command -v '{{ $command }}' &> /dev/null; then
          >&2 echo 'Cannot revert because "{{ $command }}" is not found.'
        else
          {{ . }}
        fi
      {{ end }}
  -
    name: RunPython3Code
    parameters:
      - name: code
      - name: revertCode
        optional: true
    call:
      function: RunIfCommandExists
      parameters:
        command: python3
        code: |-
          python3 <<EOF
          {{ $code }}
          EOF
        revertCode: |-
          {{ with $revertCode }}
          python3 <<EOF
          {{ . }}
          EOF
          {{ end }}
  -
    name: DeleteFileFromUserAndRootHome
    parameters:
      - name: file
    code: |-
      rm -fv ~/{{ $file }}
      sudo rm -fv /root/{{ $file }}
  -
    name: SetVsCodeSetting
    parameters:
      - name: setting
      - name: jsonValue
    # Runs as the invoking user. As root, the state directory below (and any missing parent such as
    # `~/.local/state`) was created root-owned, so later user-level scripts such as the Firefox ones
    # could no longer write their own state there.
    call:
      function: RunAsTargetUser
      parameters:
        code: |-
          if ! command -v python3 > /dev/null 2>&1; then
            echo 'Skipping because "python3" is not found.'
          else
            run_as_target_user python3 <<EOF
          from pathlib import Path
          import hashlib, os, json, sys
          property_name = '{{ $setting }}'
          target = json.loads('{{ $jsonValue }}')
          home_dir = os.path.expanduser('~')
          settings_files = [
            # Global installation (also Snap that installs with "--classic" flag)
            f'{home_dir}/.config/Code/User/settings.json',
            # Flatpak installation
            f'{home_dir}/.var/app/com.visualstudio.code/config/Code/User/settings.json'
          ]
          for settings_file in settings_files:
            file=Path(settings_file)
            if not file.is_file():
              print(f'Skipping, file does not exist at "{settings_file}".')
              continue
            print(f'Reading file at "{settings_file}".')
            file_content = file.read_text()
            if not file_content.strip():
              print('Settings file is empty. Treating it as default empty JSON object.')
              file_content = '{}'
            json_object = None
            try:
              json_object = json.loads(file_content)
            except json.JSONDecodeError:
              print(f'Error, invalid JSON format in the settings file: "{settings_file}".', file=sys.stderr)
              continue
            if property_name not in json_object:
              print(f'Settings "{property_name}" is not configured.')
              original_state = {'exists': False}
            else:
              existing_value = json_object[property_name]
              if existing_value == target:
                print(f'Skipping, "{property_name}" is already configured as {json.dumps(target)}.')
                continue
              print(f'Setting "{property_name}" has unexpected value {json.dumps(existing_value)} that will be changed.')
              original_state = {'exists': True, 'value': existing_value}
            state_dir = Path(home_dir) / '.local/state/privacy.sexy/vscode'
            state_id = hashlib.sha256(f'{settings_file}\0{property_name}'.encode()).hexdigest()
            state_file = state_dir / f'{state_id}.json'
            if not state_file.exists():
              state_dir.mkdir(parents=True, exist_ok=True, mode=0o700)
              state_file.write_text(json.dumps(original_state))
              state_file.chmod(0o600)
            json_object[property_name] = target
            try:
              new_content = json.dumps(json_object, indent=2)
              file.write_text(new_content)
              print(f'Successfully configured "{property_name}" to {json.dumps(target)}.')
            except OSError:
              state_file.unlink(missing_ok=True)
              raise
          EOF
          fi
        revertCode: |-
          if ! command -v python3 > /dev/null 2>&1; then
            >&2 echo 'Cannot revert because "python3" is not found.'
          else
            run_as_target_user python3 <<EOF
          from pathlib import Path
          import hashlib, os, json, sys
          property_name = '{{ $setting }}'
          target = json.loads('{{ $jsonValue }}')
          home_dir = os.path.expanduser('~')
          settings_files = [
            # Global installation (also Snap that installs with "--classic" flag)
            f'{home_dir}/.config/Code/User/settings.json',
            # Flatpak installation
            f'{home_dir}/.var/app/com.visualstudio.code/config/Code/User/settings.json'
          ]
          for settings_file in settings_files:
            file=Path(settings_file)
            if not file.is_file():
              print(f'Skipping, file does not exist at "{settings_file}".')
              continue
            print(f'Reading file at "{settings_file}".')
            file_content = file.read_text()
            if not file_content.strip():
              print(f'Skipping, no need to revert because settings file is empty: "{settings_file}".')
              continue
            try:
              json_object = json.loads(file_content)
            except json.JSONDecodeError:
              print(f'Error, invalid JSON format in the settings file: "{settings_file}".', file=sys.stderr)
              continue
            if property_name not in json_object:
              print(f'Skipping, "{property_name}" is not configured.')
              continue
            existing_value = json_object[property_name]
            if existing_value != target:
              print(f'Skipping, "{property_name}" is configured using {json.dumps(existing_value)} instead of {json.dumps(target)}.')
              continue
            state_dir = Path(home_dir) / '.local/state/privacy.sexy/vscode'
            state_id = hashlib.sha256(f'{settings_file}\0{property_name}'.encode()).hexdigest()
            state_file = state_dir / f'{state_id}.json'
            if not state_file.exists():
              print(f'Skipping, no original state for "{property_name}" was recorded.')
              continue
            original_state = json.loads(state_file.read_text())
            if original_state['exists']:
              json_object[property_name] = original_state['value']
            else:
              del json_object[property_name]
            new_content = json.dumps(json_object, indent=2)
            file.write_text(new_content)
            state_file.unlink()
            print(f'Successfully reverted "{property_name}" setting.')
          EOF
          fi
  -
    name: UninstallPacmanPackage
    parameters:
      - name: packageName
    # `pacman -Q <name>` matches the installed package exactly; `-Qs` is a regex search over names and
    # descriptions, so it also matched packages that merely mention the name. `-Rns` without `-c`, so
    # packages that depend on this one are never removed along with it unprompted.
    # ❗️ Revert reinstalls the package only if this script removed it, which a state file records.
    #   Without the record, reverting installed the package on systems that never had it, such as a
    #   usage statistics tool on a system where it was never installed.
    call:
      function: RunIfCommandExists
      parameters:
        command: pacman
        code: |-
          pkg_package_name='{{ $packageName }}'
          pkg_state_dir='/var/lib/privacy.sexy/state/packages'
          pkg_state_file="$pkg_state_dir/$pkg_package_name"
          if pacman -Q "$pkg_package_name" > /dev/null 2>&1; then
            echo "\"$pkg_package_name\" is installed and will be uninstalled."
            if sudo pacman -Rns "$pkg_package_name" --noconfirm; then
              sudo install --directory --mode=700 "$pkg_state_dir"
              sudo touch "$pkg_state_file"
            fi
          else
            echo "The package $pkg_package_name is not installed"
          fi
        revertCode: |-
          pkg_package_name='{{ $packageName }}'
          pkg_state_file="/var/lib/privacy.sexy/state/packages/$pkg_package_name"
          if pacman -Q "$pkg_package_name" > /dev/null 2>&1; then
            echo "Skipping, no action needed because \"$pkg_package_name\" is already installed."
            sudo rm --force "$pkg_state_file"
          elif [ ! -e "$pkg_state_file" ]; then
            echo "Skipping, \"$pkg_package_name\" was not uninstalled by privacy.sexy."
            echo "To install it anyway, run: sudo pacman -S $pkg_package_name"
          else
            echo "\"$pkg_package_name\" is not installed and will be reinstalled."
            if sudo pacman -S "$pkg_package_name" --noconfirm; then
              sudo rm --force "$pkg_state_file"
            fi
          fi
  -
    name: UninstallAptPackage
    parameters:
      - name: packageName
    # ❗️ Revert reinstalls the package only if this script removed it, like `UninstallPacmanPackage`.
    call:
      function: RunIfCommandExists
      parameters:
        command: apt-get
        code: |-
          apt_package_name='{{ $packageName }}'
          apt_state_dir='/var/lib/privacy.sexy/state/packages'
          apt_state_file="$apt_state_dir/$apt_package_name"
          if status="$(dpkg-query -W --showformat='${db:Status-Status}' "$apt_package_name" 2>&1)" \
              && [ "$status" = installed ]; then
            echo "\"$apt_package_name\" is installed and will be uninstalled."
            if sudo apt-get purge -y "$apt_package_name"; then
              sudo install --directory --mode=700 "$apt_state_dir"
              sudo touch "$apt_state_file"
            fi
          else
            echo "Skipping, no action needed, \"$apt_package_name\" is not installed."
          fi
        revertCode: |-
          apt_package_name='{{ $packageName }}'
          apt_state_file="/var/lib/privacy.sexy/state/packages/$apt_package_name"
          if status="$(dpkg-query -W --showformat='${db:Status-Status}' "$apt_package_name" 2>&1)" \
              && [ "$status" = installed ]; then
            echo "Skipping, no action needed because \"$apt_package_name\" is already installed."
            sudo rm --force "$apt_state_file"
          elif [ ! -e "$apt_state_file" ]; then
            echo "Skipping, \"$apt_package_name\" was not uninstalled by privacy.sexy."
            echo "To install it anyway, run: sudo apt-get install $apt_package_name"
          else
            echo "\"$apt_package_name\" is not installed and will be reinstalled."
            if sudo apt-get install -y "$apt_package_name"; then
              sudo rm --force "$apt_state_file"
            fi
          fi
  -
    name: DisableSystemdService
    # ❗️ A `static` unit has no [Install] section, so `systemctl disable` cannot change it and
    #   `is-enabled` keeps reporting `static` (exit code 0) afterwards. Such a unit is only stopped and
    #   recorded as `static`; revert then only checks whether it is running again. Recording it as
    #   `enabled` made every revert report that the unit had "changed" and skip, which is what happened
    #   to `whoopsie.service` on Ubuntu 22.04 and later. Units that are enabled the usual way are handled
    #   exactly as before.
    #   Use `MaskSystemdUnit` for units that a package enables through a vendor `.wants` link.
    parameters:
      - name: serviceName
    call:
      function: RunIfCommandExists
      parameters:
        command: systemctl
        code: |-
          service='{{ $serviceName }}'
          service_state_dir='/var/lib/privacy.sexy/state/systemd'
          service_state_name="$(printf '%s' "$service" | tr --complement '[:alnum:].@_-' '_')"
          service_state_file="$service_state_dir/$service_state_name"
          load_state="$(systemctl show --property=LoadState --value "$service" 2>/dev/null)"
          if [ -z "$load_state" ] || [ "$load_state" = 'not-found' ]; then
            echo "Skipping, $service does not exist."
          else
            if systemctl is-enabled --quiet "$service"; then
              enabled_state='enabled'
              if [ "$(systemctl is-enabled "$service" 2>/dev/null)" = 'static' ]; then
                enabled_state='static'
              fi
              sudo install --directory --mode=700 "$service_state_dir"
              if [ ! -e "$service_state_file" ]; then
                active_state="$(systemctl is-active "$service" 2>/dev/null || true)"
                printf '%s\n%s\n' "$enabled_state" "$active_state" | sudo tee "$service_state_file" > /dev/null
                sudo chmod 600 "$service_state_file"
                echo "Recorded the original state of $service."
              fi
              if systemctl is-active --quiet "$service" && ! sudo systemctl stop "$service"; then
                >&2 echo "Could not stop $service."
              fi
              if [ "$enabled_state" = 'static' ]; then
                echo "Stopped $service. It is a static unit, so it cannot be disabled and only starts when another unit needs it."
              elif sudo systemctl disable "$service"; then
                echo "Successfully disabled $service."
              else
                >&2 echo "Failed to disable $service."
              fi
            else
              echo "Skipping, $service is already disabled."
            fi
          fi
        revertCode: |-
          service='{{ $serviceName }}'
          service_state_dir='/var/lib/privacy.sexy/state/systemd'
          service_state_name="$(printf '%s' "$service" | tr --complement '[:alnum:].@_-' '_')"
          service_state_file="$service_state_dir/$service_state_name"
          original_enabled=''
          original_active=''
          if [ -e "$service_state_file" ]; then
            original_enabled="$(sudo sed --silent '1p' "$service_state_file")"
            original_active="$(sudo sed --silent '2p' "$service_state_file")"
          fi
          if [ ! -e "$service_state_file" ]; then
            echo "Skipping, no original state recorded for $service was found."
          elif systemctl is-active --quiet "$service" \
              || { [ "$original_enabled" != 'static' ] && systemctl is-enabled --quiet "$service"; }; then
            >&2 echo "Skipping revert because $service changed after privacy.sexy disabled it."
          else
            restore_failed='false'
            if [ "$original_enabled" = 'enabled' ] && ! sudo systemctl enable "$service"; then
              >&2 echo "Failed to restore the enabled state of $service."
              restore_failed='true'
            fi
            if [ "$original_active" = 'active' ] && ! sudo systemctl start "$service"; then
              >&2 echo "Failed to restore the active state of $service."
              restore_failed='true'
            fi
            if [ "$restore_failed" = 'false' ]; then
              sudo rm --force "$service_state_file"
              echo "Restored the original state of $service."
            fi
          fi
  -
    name: MaskSystemdUnit
    # 💡 Purpose:
    #   Stops and masks a unit that its package enables through a vendor symlink, such as
    #   `/usr/lib/systemd/system/timers.target.wants/pkgstats.timer`. `systemctl disable` only removes
    #   enablement symlinks under `/etc`, so for such a unit it does nothing: `systemctl is-enabled`
    #   reports it as `static` (no install section, like `pkgstats.timer`) or `disabled`, and it still
    #   starts at every boot. A mask (`/etc/systemd/system/<unit>` linked to `/dev/null`) overrides the
    #   vendor symlink.
    #   Use `DisableSystemdService` for units that are enabled the usual way.
    # ❗️ State: same directory and file name as `DisableSystemdService`. Line 1 is what `is-enabled`
    #   reported before masking, line 2 what `is-active` reported. Revert unmasks only while the unit is
    #   still masked and stopped, and starts it again only if it was active.
    # References:
    #   - https://man7.org/linux/man-pages/man1/systemctl.1.html (see `mask`, `--now` and `is-enabled`)
    parameters:
      - name: unitName
    call:
      function: RunIfCommandExists
      parameters:
        command: systemctl
        code: |-
          unit='{{ $unitName }}'
          unit_state_dir='/var/lib/privacy.sexy/state/systemd'
          unit_state_name="$(printf '%s' "$unit" | tr --complement '[:alnum:].@_-' '_')"
          unit_state_file="$unit_state_dir/$unit_state_name"
          load_state="$(systemctl show --property=LoadState --value "$unit" 2>/dev/null)"
          enabled_state="$(systemctl is-enabled "$unit" 2>/dev/null)"
          if [ -z "$load_state" ] || [ "$load_state" = 'not-found' ]; then
            echo "Skipping, $unit does not exist."
          elif [ "$load_state" = 'masked' ] || [ "$enabled_state" = 'masked' ]; then
            echo "Skipping, $unit is already masked."
          else
            recorded_now='false'
            if [ ! -e "$unit_state_file" ]; then
              active_state="$(systemctl is-active "$unit" 2>/dev/null || true)"
              if sudo install --directory --mode=700 "$unit_state_dir" \
                  && printf '%s\n%s\n' "$enabled_state" "$active_state" | sudo tee "$unit_state_file" > /dev/null; then
                sudo chmod 600 "$unit_state_file"
                recorded_now='true'
                echo "Recorded the original state of $unit."
              fi
            fi
            if [ ! -e "$unit_state_file" ]; then
              >&2 echo "Skipping, could not record the original state of $unit."
            elif sudo systemctl mask --now "$unit"; then
              echo "Successfully stopped and masked $unit."
            elif [ "$(systemctl is-enabled "$unit" 2>/dev/null)" = 'masked' ]; then
              >&2 echo "Masked $unit, but could not stop it; it stays stopped after a reboot."
            else
              if [ "$recorded_now" = 'true' ]; then
                sudo rm --force "$unit_state_file"
              fi
              >&2 echo "Failed to mask $unit."
            fi
          fi
        revertCode: |-
          unit='{{ $unitName }}'
          unit_state_dir='/var/lib/privacy.sexy/state/systemd'
          unit_state_name="$(printf '%s' "$unit" | tr --complement '[:alnum:].@_-' '_')"
          unit_state_file="$unit_state_dir/$unit_state_name"
          if [ ! -e "$unit_state_file" ]; then
            echo "Skipping, no original state recorded for $unit was found."
          elif [ "$(systemctl is-enabled "$unit" 2>/dev/null)" != 'masked' ] || systemctl is-active --quiet "$unit"; then
            >&2 echo "Skipping revert because $unit changed after privacy.sexy masked it."
          else
            original_enabled="$(sudo sed --silent '1p' "$unit_state_file")"
            original_active="$(sudo sed --silent '2p' "$unit_state_file")"
            restore_failed='false'
            if ! sudo systemctl unmask "$unit"; then
              >&2 echo "Failed to unmask $unit."
              restore_failed='true'
            else
              if [ "$original_enabled" = 'enabled' ] && ! systemctl is-enabled --quiet "$unit" \
                  && ! sudo systemctl enable "$unit"; then
                >&2 echo "Failed to restore the enabled state of $unit."
                restore_failed='true'
              fi
              if [ "$original_active" = 'active' ] && ! sudo systemctl start "$unit"; then
                >&2 echo "Failed to restore the active state of $unit."
                restore_failed='true'
              fi
            fi
            if [ "$restore_failed" = 'false' ]; then
              sudo rm --force "$unit_state_file"
              echo "Restored the original state of $unit."
            fi
          fi
  -
    name: Comment
    # 💡 Purpose:
    #   Adds a comment in the executed code for better readability and debugging.
    #   This function does not affect the execution flow but helps in understanding the purpose of subsequent code.
    #   Marked: refactor-with-partials
    #     Same function as macOS
    parameters:
        - name: codeComment
          optional: true
        - name: revertCodeComment
          optional: true
    call:
        function: RunInlineCode
        parameters:
            code: '{{ with $codeComment }}# {{ . }}{{ end }}'
            revertCode: '{{ with $revertCodeComment }}# {{ . }}{{ end }}'
  -
    name: DeleteFiles
    # 💡 Purpose:
    #   Deletes files but does not touch any directories.
    #   Use `DeleteDirectory` or `ClearDirectoryContents` to delete directories.
    parameters:
      - name: fileGlob  # File glob pattern to delete.
    call:
      -
        function: Comment
        parameters:
          codeComment: >-
            Delete files matching pattern: "{{ $fileGlob }}"
      -
        function: RunPython3Code
        parameters:
          code: |-
            import glob
            import os
            path = '{{ $fileGlob }}'
            expanded_path = os.path.expandvars(os.path.expanduser(path))
            print(f'Deleting files matching pattern: {expanded_path}')
            paths = glob.glob(expanded_path)
            if not paths:
              print('Skipping, no paths found.')
            deleted_count = 0
            for path in paths:
              if not os.path.isfile(path):
                print(f'Skipping folder: "{path}".')
                continue
              os.remove(path)
              deleted_count += 1
              print(f'Successfully delete file: "{path}".')
            print(f'Successfully deleted {deleted_count} file(s).')
  -
    name: DeleteFilesFromFirefoxProfiles
    parameters:
      - name: pathGlob # file or folder in profile file
    call:
      - # Global installation
          function: DeleteFiles
          parameters:
            fileGlob: ~/.mozilla/firefox/*/{{ $pathGlob }}
      - # Global installation, Firefox 147 and later on a new installation (XDG Base Directory location)
          function: DeleteFiles
          parameters:
            fileGlob: ~/.config/mozilla/firefox/*/{{ $pathGlob }}
      - # Flatpak installation
          function: DeleteFiles
          parameters:
            fileGlob: ~/.var/app/org.mozilla.firefox/.mozilla/firefox/*/{{ $pathGlob }}
      - # Snap installation
          function: DeleteFiles
          parameters:
            fileGlob: ~/snap/firefox/common/.mozilla/firefox/*/{{ $pathGlob }}
  -
    name: DeleteFileFromThunderbirdProfiles
    parameters:
      - name: file
    code: |-
      # {{ $file }}: Global installation
      rm -fv ~/.thunderbird/*/{{ $file }}
      # {{ $file }}: Global installation, Thunderbird 154 and later on a new installation (XDG Base Directory location)
      rm -fv ~/.config/thunderbird/*/{{ $file }}
      # {{ $file }}: Snap installation
      rm -fv ~/snap/thunderbird/common/.thunderbird/*/{{ $file }}
      # {{ $file }}: Flatpak installation
      rm -fv ~/.var/app/org.mozilla.Thunderbird/.thunderbird/*/{{ $file }}
  -
    name: DeleteFileFromGNOMEWebData
    parameters:
      - name: file
    code: |-
      # {{ $file }}: Global installation
      rm -fv ~/.local/share/epiphany/{{ $file }}
      # {{ $file }}: Flatpak installation
      rm -fv ~/.var/app/org.gnome.Epiphany/data/epiphany/{{ $file }}
      # {{ $file }}: Snap installation
      rm -fv ~/snap/epiphany/*/.local/share/epiphany/{{ $file }}
  -
    name: ClearDirFromVsCodeUserDataDir
    parameters:
      - name: directory # Whitespaces must be escaped with /
    code: |-
      # {{ $directory }}: Global installation (also Snap with --classic)
      rm -rfv ~/.config/Code/{{ $directory }}/*
      # {{ $directory }}: Flatpak installation
      rm -rfv ~/.var/app/com.visualstudio.code/config/Code/{{ $directory }}/*
  -
    name: PersistSystemEnvironmentVariable
    parameters:
      - name: variable
      - name: value # Leave it out to set the variable to an empty value (`pam_env` sets `NAME=` as empty)
        optional: true
    # We can change different files:
    #   System-wide:
    #    [/etc/profile]
    #       Contains system wide shell initialization scripts.
    #       ❌ It's a configuration file of the base-files package, so it's not appropriate to edit that file directly.
    #     [/etc/profile.d/*.sh]
    #       Files with the .sh extension in the /etc/profile.d directory get executed whenever.
    #       a bash login shell is entered (e.g. when logging in from the console or over ssh).
    #       ✅ Recommended to be edited by Ubuntu.
    #    [/etc/environment]
    #       Used for system-wide environment variable settings.
    #       It is not a script file, but rather consists of assignment expressions, one per line..
    #       ✅ Owned by root, requires sudo.
    #       ✅ Shell agnostic.
    #       ✅ Recommended by Debian to edit for global environment variables.
    #   User-specific:
    #     [~/.profile]
    #       User-specific shell initialization scripts.
    #       ✅ Recommended by Debian to edit for user-specific environment variables.
    #     [~/.bashrc]
    #       User-based configuration file to set environment variables for Bash shell.
    #       ❌ Bash-specific.
    #    [~/.pam_environment]
    #       User-specific "/etc/environment"
    # References:
    #   - https://web.archive.org/web/20221029173442/https://help.ubuntu.com/community/EnvironmentVariables
    #   - https://web.archive.org/web/20221029173630/https://wiki.archlinux.org/title/Environment_variables#Defining_variables
    #   - https://web.archive.org/web/20221029173825/https://wiki.debian.org/EnvironmentVariables
    code: |-
      variable='{{ $variable }}'
      value='{{ with $value }}{{ . }}{{ end }}'
      declaration_file='/etc/environment'
      environment_state_dir='/var/lib/privacy.sexy/state/environment'
      environment_state_file="$environment_state_dir/$variable"
      assignment_start="$variable="
      assignment="$variable=$value"
      declaration_existed='true'
      if ! [ -f "$declaration_file" ]; then
        declaration_existed='false'
        echo "\"$declaration_file\" does not exist."
        sudo touch "$declaration_file"
        echo "Created $declaration_file."
      fi
      if ! grep --quiet "^$assignment_start" "${declaration_file}"; then
        sudo install --directory --mode=700 "$environment_state_dir"
        if [ ! -e "$environment_state_file" ]; then
          if [ "$declaration_existed" = 'true' ]; then
            printf 'absent\n' | sudo tee "$environment_state_file" > /dev/null
          else
            printf 'file-absent\n' | sudo tee "$environment_state_file" > /dev/null
          fi
          sudo chmod 600 "$environment_state_file"
        fi
        echo "Variable \"$variable\" was not configured before."
        # The line ends with a newline, and starts on its own line even if the file does not end with one,
        # so that neither this assignment nor one that another tool appends later is joined to another line.
        { [ -z "$(tail --bytes=1 "$declaration_file")" ] || echo; printf '%s\n' "$assignment"; } \
          | sudo tee -a "$declaration_file" > /dev/null
        echo "Successfully configured ($assignment)."
      else
        if grep --quiet "^$assignment$" "${declaration_file}"; then
          echo "Skipping. Variable \"$variable\" is already set to value \"$value\"."
        else
          sudo install --directory --mode=700 "$environment_state_dir"
          if [ ! -e "$environment_state_file" ]; then
            {
              printf 'present\n'
              grep "^$assignment_start" "$declaration_file"
            } | sudo tee "$environment_state_file" > /dev/null
            sudo chmod 600 "$environment_state_file"
          fi
          if ! sudo sed --in-place "/^$assignment_start/d" "$declaration_file"; then
            >&2 echo "Failed to delete assignment starting with \"$assignment_start\"."
          else
            echo "Successfully deleted unexpected assignment of \"$variable\"."
            if ! { [ -z "$(tail --bytes=1 "$declaration_file")" ] || echo; printf '%s\n' "$assignment"; } \
                | sudo tee -a "$declaration_file" > /dev/null; then
              >&2 echo "Failed to add assignment \"$assignment\"."
            else
              echo "Successfully reconfigured ($assignment)."
            fi
          fi
        fi
      fi
    revertCode: |-
      variable='{{ $variable }}'
      value='{{ with $value }}{{ . }}{{ end }}'
      declaration_file='/etc/environment'
      environment_state_dir='/var/lib/privacy.sexy/state/environment'
      environment_state_file="$environment_state_dir/$variable"
      assignment_start="$variable="
      assignment="$variable=$value"
      if [ ! -e "$environment_state_file" ]; then
        echo "Skipping, no original state recorded for \"$variable\" was found."
      elif ! [ -f "$declaration_file" ]; then
        >&2 echo "Failed to restore \"$variable\" because \"$declaration_file\" does not exist."
      elif [ "$(grep --count "^$assignment_start" "$declaration_file")" -ne 1 ] \
          || ! grep --quiet "^$assignment$" "$declaration_file"; then
        >&2 echo "Skipping revert because \"$variable\" changed after privacy.sexy applied it."
      else
        previous_state="$(sudo sed --silent '1p' "$environment_state_file")"
        if ! sudo sed --in-place "/^$assignment_start/d" "$declaration_file"; then
          >&2 echo "Failed to remove the privacy.sexy assignment for \"$variable\"."
        else
          if [ "$previous_state" = 'present' ]; then
            sudo sed --silent '2,$p' "$environment_state_file" | sudo tee -a "$declaration_file" > /dev/null
          elif [ "$previous_state" = 'file-absent' ] \
              && ! grep --quiet '[^[:space:]]' "$declaration_file"; then
            sudo rm --force "$declaration_file"
          fi
          sudo rm --force "$environment_state_file"
          echo "Restored the original configuration of \"$variable\"."
        fi
      fi
  -
    name: DisableCronjob
    parameters:
      - name: jobName
    # Cron is not restarted after changes because according to manpage:
    # > …cron will then examine the modification time on all crontabs and reload those which have changed.
    # > Thus cron need not be restarted whenever a crontab file is modified.
    code: |-
      job_name='{{ $jobName }}'
      cronjob_path="/etc/cron.daily/$job_name"
      cronjob_state_dir='/var/lib/privacy.sexy/state/cron'
      cronjob_state_file="$cronjob_state_dir/$job_name.mode"
      if [[ -f "$cronjob_path" ]]; then
        if [[ -x "$cronjob_path" ]]; then
          sudo install --directory --mode=700 "$cronjob_state_dir"
          if [ ! -e "$cronjob_state_file" ]; then
            stat --format='%a' "$cronjob_path" | sudo tee "$cronjob_state_file" > /dev/null
            sudo chmod 600 "$cronjob_state_file"
          fi
          if sudo chmod -x "$cronjob_path"; then
            echo "Successfully disabled cronjob \"$job_name\"."
          else
            sudo rm --force "$cronjob_state_file"
            >&2 echo "Failed to disable cronjob \"$job_name\"."
          fi
        else
          echo "Skipping, cronjob \"$job_name\" is already disabled."
        fi
      else
        echo "Skipping, \"$job_name\" cronjob is not found."
      fi
    revertCode: |-
      job_name='{{ $jobName }}'
      cronjob_path="/etc/cron.daily/$job_name"
      cronjob_state_dir='/var/lib/privacy.sexy/state/cron'
      cronjob_state_file="$cronjob_state_dir/$job_name.mode"
      if [ ! -e "$cronjob_state_file" ]; then
        echo "Skipping, no original mode recorded for cronjob \"$job_name\" was found."
      elif [[ ! -f "$cronjob_path" ]]; then
        >&2 echo "Failed to restore cronjob \"$job_name\" because it is missing."
      elif [[ -x "$cronjob_path" ]]; then
        >&2 echo "Skipping revert because cronjob \"$job_name\" changed after privacy.sexy disabled it."
      else
        original_mode="$(sudo cat "$cronjob_state_file")"
        if sudo chmod "$original_mode" "$cronjob_path"; then
          sudo rm --force "$cronjob_state_file"
          echo "Restored cronjob \"$job_name\" to mode \"$original_mode\"."
        else
          >&2 echo "Failed to restore cronjob \"$job_name\"."
        fi
      fi
  -
    name: AddFirefoxPrefs
    parameters:
      - name: prefName
      - name: jsonValue
    docs: |-
      This script modifies the `user.js` file in Firefox profiles to set specific preferences.

      The `user.js` file can be found in a Firefox profile folder [1] and its location depends on the type of installation:

      - Default: `~/.mozilla/firefox/<profile-name>/user.js`
      - Firefox 147 and later, on a new installation: `~/.config/mozilla/firefox/<profile-name>/user.js` [4]
      - Flatpak: `~/.var/app/org.mozilla.firefox/.mozilla/firefox/<profile-name>/user.js`
      - Snap: `~/snap/firefox/common/.mozilla/firefox/<profile-name>/user.js`

      While the `user.js` file is optional [2], if it's present, the Firefox will prioritize its settings over
      those in `prefs.js` upon startup [1] [2]. It's recommended not to directly edit `prefs.js` to avoid profile corruption [2].

      When `user.js` is modified or deleted, corresponding changes in `prefs.js` are necessary for reversion, as Firefox
      doesn't automatically revert these changes [3].

      This script safely modifies `user.js` and ensures changes are reflected in `prefs.js` during reversion, addressing
      issues with preference persistence [3].

      [1]: https://web.archive.org/web/20230811005205/https://kb.mozillazine.org/User.js_file "User.js file - MozillaZine Knowledge Base"
      [2]: https://web.archive.org/web/20221029211757/https://kb.mozillazine.org/Prefs.js_file "Prefs.js file - MozillaZine Knowledge Base"
      [3]: https://github.com/undergroundwires/privacy.sexy/issues/282 "[BUG]: Reverting Firefox settings do not work on Linux · Issue #282 · undergroundwires/privacy.sexy | github.com"
      [4]: https://bugzilla.mozilla.org/show_bug.cgi?id=259356 "259356 - Support for the Freedesktop.org XDG Base Directory Specification | bugzilla.mozilla.org"
    call:
      function: AddMozillaProfilePrefs
      parameters:
        applicationName: Firefox
        processPattern: '[f]irefox'
        profilePatterns: >-
          '~/.mozilla/firefox/*/',
          '~/.config/mozilla/firefox/*/',
          '~/.var/app/org.mozilla.firefox/.mozilla/firefox/*/',
          '~/snap/firefox/common/.mozilla/firefox/*/',
        stateDirectoryName: firefox
        prefName: '{{ $prefName }}'
        jsonValue: '{{ $jsonValue }}'
  -
    name: AddThunderbirdPrefs
    # 💡 Purpose:
    #   Same as `AddFirefoxPrefs`, for the `user.js` file in Thunderbird profiles:
    #   - Default: `~/.thunderbird/<profile-name>/user.js`
    #   - Thunderbird 154 and later, on a new installation: `~/.config/thunderbird/<profile-name>/user.js`
    #   - Flatpak: `~/.var/app/org.mozilla.Thunderbird/.thunderbird/<profile-name>/user.js`
    #   - Snap: `~/snap/thunderbird/common/.thunderbird/<profile-name>/user.js`
    #   Thunderbird reads `user.js` the same way Firefox does, so the same restoration logic applies.
    parameters:
      - name: prefName
      - name: jsonValue
    call:
      function: AddMozillaProfilePrefs
      parameters:
        applicationName: Thunderbird
        processPattern: '[t]hunderbird'
        profilePatterns: >-
          '~/.thunderbird/*/',
          '~/.config/thunderbird/*/',
          '~/.var/app/org.mozilla.Thunderbird/.thunderbird/*/',
          '~/snap/thunderbird/common/.thunderbird/*/',
        stateDirectoryName: thunderbird
        prefName: '{{ $prefName }}'
        jsonValue: '{{ $jsonValue }}'
  -
    name: AddMozillaProfilePrefs
    # 💡 Purpose:
    #   Sets a preference in the `user.js` file of every profile of a Mozilla application (Firefox,
    #   Thunderbird), and restores both `user.js` and `prefs.js` on revert. Call it through
    #   `AddFirefoxPrefs` or `AddThunderbirdPrefs`, which document the profile locations.
    # ❗️ Runs as the invoking user, so files and the state under `~/.local/state/privacy.sexy/<application>`
    #   stay owned by them.
    parameters:
      - name: applicationName # Shown in messages, such as `Firefox`
      - name: processPattern # `grep` pattern that matches the running application but not `grep` itself
      - name: profilePatterns # Python string literals, comma-separated: globs for the profile folders
      - name: stateDirectoryName # Folder in `~/.local/state/privacy.sexy` that keeps the original values
      - name: prefName
      - name: jsonValue
    call:
      function: RunAsTargetUser
      parameters:
        code: |-
          if ! command -v python3 > /dev/null 2>&1; then
            >&2 echo 'Cannot configure {{ $applicationName }} because python3 is not found.'
          else
            run_as_target_user python3 <<'PYTHON'
          import glob, hashlib, json, os, re
          from pathlib import Path
          pref_name = '{{ $prefName }}'
          pref_value = json.loads(r'''{{ $jsonValue }}''')
          pref_prefix = f'user_pref("{pref_name}",'
          pref_line = f'user_pref("{pref_name}", {json.dumps(pref_value, separators=(",", ":"))});'
          patterns = (
              {{ $profilePatterns }}
          )
          profiles = {
              Path(path) for pattern in patterns
              for path in glob.glob(os.path.expanduser(pattern))
              if re.match(r'^[a-z0-9]{8}\..+', Path(path).name)
          }
          for profile in sorted(profiles):
              user_js = profile / 'user.js'
              current_text = user_js.read_text() if user_js.exists() else ''
              current_lines = [line.rstrip('\r\n') for line in current_text.splitlines(keepends=True)
                               if line.startswith(pref_prefix)]
              if current_lines == [pref_line]:
                  print(f'Skipping, {pref_name} is already configured in {user_js}.')
                  continue
              state_id = hashlib.sha256(f'{profile}\0{pref_name}'.encode()).hexdigest()
              state_dir = Path.home() / '.local/state/privacy.sexy/{{ $stateDirectoryName }}'
              state_file = state_dir / f'{state_id}.json'
              if not state_file.exists():
                  state = {'files': {}}
                  for filename in ('user.js', 'prefs.js'):
                      path = profile / filename
                      text = path.read_text() if path.exists() else ''
                      state['files'][filename] = {
                          'existed': path.exists(),
                          'lines': [line.rstrip('\r\n') for line in text.splitlines(keepends=True)
                                    if line.startswith(pref_prefix)],
                      }
                  state_dir.mkdir(parents=True, exist_ok=True, mode=0o700)
                  state_file.write_text(json.dumps(state))
                  state_file.chmod(0o600)
              remaining = ''.join(
                  line for line in current_text.splitlines(keepends=True)
                  if not line.startswith(pref_prefix)
              )
              if remaining and not remaining.endswith(('\n', '\r')):
                  remaining += '\n'
              user_js.write_text(f'{remaining}{pref_line}\n')
              print(f'Successfully configured {pref_name} in {user_js}.')
          if not profiles:
              print('No {{ $applicationName }} profile folders were found; no changes were made.')
          PYTHON
          fi
        revertCode: |-
          if command -v ps > /dev/null 2>&1 && ps aux | grep -i '{{ $processPattern }}' > /dev/null; then
            >&2 echo 'Warning: Close {{ $applicationName }} before reverting preferences so it cannot overwrite restored values.'
          fi
          if ! command -v python3 > /dev/null 2>&1; then
            >&2 echo 'Cannot restore {{ $applicationName }} preferences because python3 is not found.'
          else
            run_as_target_user python3 <<'PYTHON'
          import glob, hashlib, json, os, re
          from pathlib import Path
          pref_name = '{{ $prefName }}'
          pref_value = json.loads(r'''{{ $jsonValue }}''')
          pref_prefix = f'user_pref("{pref_name}",'
          pref_line = f'user_pref("{pref_name}", {json.dumps(pref_value, separators=(",", ":"))});'
          patterns = (
              {{ $profilePatterns }}
          )
          profiles = {
              Path(path) for pattern in patterns
              for path in glob.glob(os.path.expanduser(pattern))
              if re.match(r'^[a-z0-9]{8}\..+', Path(path).name)
          }
          for profile in sorted(profiles):
              state_id = hashlib.sha256(f'{profile}\0{pref_name}'.encode()).hexdigest()
              state_file = Path.home() / '.local/state/privacy.sexy/{{ $stateDirectoryName }}' / f'{state_id}.json'
              if not state_file.exists():
                  continue
              state = json.loads(state_file.read_text())
              can_restore = True
              user_js = profile / 'user.js'
              user_js_text = user_js.read_text() if user_js.exists() else ''
              user_js_applied = [line.rstrip('\r\n') for line in user_js_text.splitlines(keepends=True)
                                 if line.startswith(pref_prefix)] == [pref_line]
              for filename, original in state['files'].items():
                  path = profile / filename
                  text = path.read_text() if path.exists() else ''
                  current = [line.rstrip('\r\n') for line in text.splitlines(keepends=True)
                             if line.startswith(pref_prefix)]
                  # The application leaves a preference out of prefs.js when it equals the default value,
                  # so a missing prefs.js line is expected while user.js still sets the value.
                  if filename == 'prefs.js' and not current and user_js_applied:
                      continue
                  if current not in (original['lines'], [pref_line]):
                      print(f'Skipping {path}: {pref_name} changed after privacy.sexy applied it.')
                      can_restore = False
              if not can_restore:
                  continue
              for filename, original in state['files'].items():
                  path = profile / filename
                  text = path.read_text() if path.exists() else ''
                  current = [line.rstrip('\r\n') for line in text.splitlines(keepends=True)
                             if line.startswith(pref_prefix)]
                  if current == original['lines']:
                      continue
                  remaining = ''.join(
                      line for line in text.splitlines(keepends=True)
                      if not line.startswith(pref_prefix)
                  )
                  if remaining and not remaining.endswith(('\n', '\r')):
                      remaining += '\n'
                  restored = remaining + ''.join(f'{line}\n' for line in original['lines'])
                  if original['existed'] or restored:
                      path.write_text(restored)
                  elif path.exists():
                      path.unlink()
              state_file.unlink()
              print(f'Restored the original {pref_name} state in {profile}.')
          PYTHON
          fi
  -
    name: RunAsTargetUser
    # 💡 Purpose:
    #   The generated script re-executes itself as root, but some settings are stored per-user (such as
    #   GSettings/dconf values). Running those commands as root would write them to root's profile instead
    #   of the profile of the person running the script.
    #   This function defines a `run_as_target_user` helper that executes a command as the invoking user,
    #   with access to their session bus when one is available.
    # References:
    #   - https://web.archive.org/web/20240705015216/https://man7.org/linux/man-pages/man1/sudo.1.html
    #   - https://web.archive.org/web/20240523113114/https://dbus.freedesktop.org/doc/dbus-launch.1.html
    parameters:
      - name: code
      - name: revertCode
        optional: true
    code: |-
      target_user_id="$(id -u "$target_user" 2>/dev/null)"
      if [ -z "$target_user_id" ]; then
        >&2 echo "Failed to resolve the user ID of \"$target_user\"."
      else
        target_user_bus="/run/user/$target_user_id/bus"
        run_as_target_user() {
          if [ -S "$target_user_bus" ]; then
            sudo -u "$target_user" env \
              "XDG_RUNTIME_DIR=/run/user/$target_user_id" \
              "DBUS_SESSION_BUS_ADDRESS=unix:path=$target_user_bus" \
              "$@"
          else
            sudo -u "$target_user" env "XDG_RUNTIME_DIR=/run/user/$target_user_id" "$@"
          fi
        }
        {{ $code }}
      fi
    revertCode: |-
      {{ with $revertCode }}
        target_user_id="$(id -u "$target_user" 2>/dev/null)"
        if [ -z "$target_user_id" ]; then
          >&2 echo "Failed to resolve the user ID of \"$target_user\"."
        else
          target_user_bus="/run/user/$target_user_id/bus"
          run_as_target_user() {
            if [ -S "$target_user_bus" ]; then
              sudo -u "$target_user" env \
                "XDG_RUNTIME_DIR=/run/user/$target_user_id" \
                "DBUS_SESSION_BUS_ADDRESS=unix:path=$target_user_bus" \
                "$@"
            else
              sudo -u "$target_user" env "XDG_RUNTIME_DIR=/run/user/$target_user_id" "$@"
            fi
          }
          {{ . }}
        fi
      {{ end }}
  -
    name: SetGnomeSetting
    # 💡 Purpose:
    #   Configures a GNOME desktop setting through `gsettings` for the user running the script.
    #   Settings that are not present on the current system are skipped instead of failing, so the script
    #   remains safe to run on non-GNOME desktops.
    # ❗️ Recording the original state and applying the setting are separate concerns:
    #   an earlier version skipped `gsettings set` entirely when a state file already existed, so
    #   re-running the generated script never re-enforced a setting the user had since changed back.
    #   The state file is written only when absent, and removed on failure only if this run created it,
    #   so a later failure cannot destroy the original value recorded by an earlier successful run.
    # References:
    #   - https://web.archive.org/web/20240404013714/https://manpages.ubuntu.com/manpages/jammy/man1/gsettings.1.html
    parameters:
      - name: schema
      - name: key
      - name: value
    call:
      function: RunAsTargetUser
      parameters:
        code: |-
          gnome_schema='{{ $schema }}'
          gnome_key='{{ $key }}'
          gnome_value='{{ $value }}'
          gnome_state_id="$(printf '%s\0%s' "$gnome_schema" "$gnome_key" | sha256sum | awk '{ print $1 }')"
          gnome_state_dir="$target_home/.local/state/privacy.sexy/gsettings"
          gnome_state_file="$gnome_state_dir/$gnome_state_id"
          if ! run_as_target_user gsettings writable "$gnome_schema" "$gnome_key" > /dev/null 2>&1; then
            echo "Skipping, \"$gnome_schema $gnome_key\" is not available on this system."
          elif current_value="$(run_as_target_user gsettings get "$gnome_schema" "$gnome_key")" \
              && [ "$current_value" = "$gnome_value" ]; then
            echo "Skipping, \"$gnome_schema $gnome_key\" is already set to \"$gnome_value\"."
          else
            recorded_now='no'
            if [ ! -e "$gnome_state_file" ]; then
              run_as_target_user install --directory --mode=700 "$gnome_state_dir"
              printf '%s' "$current_value" | run_as_target_user tee "$gnome_state_file" > /dev/null
              run_as_target_user chmod 600 "$gnome_state_file"
              recorded_now='yes'
            fi
            # Without a session bus, such as over SSH, `gsettings set` reports success but saves nothing,
            # so the value is read back.
            if run_as_target_user gsettings set "$gnome_schema" "$gnome_key" "$gnome_value" \
                && [ "$(run_as_target_user gsettings get "$gnome_schema" "$gnome_key")" = "$gnome_value" ]; then
              echo "Successfully set \"$gnome_schema $gnome_key\" to \"$gnome_value\"."
            else
              if [ "$recorded_now" = 'yes' ]; then
                run_as_target_user rm --force "$gnome_state_file"
              fi
              >&2 echo "Failed to set \"$gnome_schema $gnome_key\" to \"$gnome_value\". Run this script while you are logged in to your desktop."
            fi
          fi
        revertCode: |-
          gnome_schema='{{ $schema }}'
          gnome_key='{{ $key }}'
          gnome_value='{{ $value }}'
          gnome_state_id="$(printf '%s\0%s' "$gnome_schema" "$gnome_key" | sha256sum | awk '{ print $1 }')"
          gnome_state_dir="$target_home/.local/state/privacy.sexy/gsettings"
          gnome_state_file="$gnome_state_dir/$gnome_state_id"
          if ! run_as_target_user gsettings writable "$gnome_schema" "$gnome_key" > /dev/null 2>&1; then
            echo "Skipping, \"$gnome_schema $gnome_key\" is not available on this system."
          elif [ ! -e "$gnome_state_file" ]; then
            echo "Skipping, no original state recorded for \"$gnome_schema $gnome_key\" was found."
          elif [ "$(run_as_target_user gsettings get "$gnome_schema" "$gnome_key")" != "$gnome_value" ]; then
            >&2 echo "Skipping revert because \"$gnome_schema $gnome_key\" changed after privacy.sexy applied it."
          else
            previous_value="$(run_as_target_user cat "$gnome_state_file")"
            if run_as_target_user gsettings set "$gnome_schema" "$gnome_key" "$previous_value"; then
              run_as_target_user rm --force "$gnome_state_file"
              echo "Successfully restored \"$gnome_schema $gnome_key\" to \"$previous_value\"."
            else
              >&2 echo "Failed to restore \"$gnome_schema $gnome_key\"."
            fi
          fi
  -
    name: SetKernelParameter
    # 💡 Purpose:
    #   Configures a kernel parameter (`sysctl`) so that it applies immediately and persists across reboots.
    #   The value is stored in a dedicated drop-in file so that distribution-owned configuration files are
    #   never modified.
    # ❗️ Why the previous value is recorded:
    #   Distributions do not agree on the defaults for these keys. Debian and Ubuntu ship
    #   `kernel.dmesg_restrict=1`, `kernel.kptr_restrict=1`, `kernel.yama.ptrace_scope=1` and
    #   `kernel.unprivileged_bpf_disabled=2`, while the upstream kernel defaults are `0`. Reverting to a
    #   hard-coded "default" therefore risks leaving the system *less* hardened than it was before this
    #   script ran. Instead, the value found before the change is recorded as a comment in the same drop-in
    #   file and restored on revert. When no recorded value is available, the running value is deliberately
    #   left alone rather than guessed at.
    # ❗️ Why `keepStricterValue` exists:
    #   For restriction levels such as `kernel.kptr_restrict` and `kernel.yama.ptrace_scope`, a higher number
    #   is stricter. Hardened systems run `kptr_restrict=2` or `ptrace_scope=2`/`3`, and writing `1` there
    #   (and persisting it in a drop-in that overrides theirs) lowered the protection this script promises
    #   to raise. With `keepStricterValue`, a running value that is already at least the target value is
    #   left alone: nothing is recorded, persisted or applied.
    #   Do not use it for keys where a lower number is stricter (such as `dev.tty.ldisc_autoload`): the
    #   comparison would then skip every run.
    # ❗️ Why `revertNeedsRestart` exists:
    #   Some keys are one-way switches, such as `kernel.kexec_load_disabled`: once set, the kernel rejects
    #   any attempt to write the old value until the next restart. For those, revert removes the persisted
    #   value and says that a restart is needed, instead of a live write that can only fail.
    # References:
    #   - https://web.archive.org/web/20240523090109/https://man7.org/linux/man-pages/man5/sysctl.d.5.html
    #   - https://web.archive.org/web/20240418183746/https://man7.org/linux/man-pages/man8/sysctl.8.html
    parameters:
      - name: key
      - name: value
      - name: keepStricterValue # When set, skips if the running value is a number that is at least `value`.
        optional: true
      - name: revertNeedsRestart # When set, revert does not write the previous value to the running kernel.
        optional: true
    code: |-
      kernel_key='{{ $key }}'
      kernel_value='{{ $value }}'
      kernel_keep_stricter_value='{{ with $keepStricterValue }}true{{ end }}'
      config_file='/etc/sysctl.d/60-privacy-sexy.conf'
      previous_marker="# privacy.sexy-previous:$kernel_key="
      if ! command -v sysctl > /dev/null 2>&1; then
        >&2 echo 'Cannot configure kernel parameters because "sysctl" is not found.'
      else
        current_value="$(sysctl --values "$kernel_key" 2>/dev/null | head --lines=1)"
        if [ "$kernel_keep_stricter_value" = 'true' ] && [[ "$current_value" =~ ^[0-9]+$ ]] \
            && [ "$current_value" -ge "$kernel_value" ]; then
          echo "Skipping, \"$kernel_key\" is already \"$current_value\", which is at least as strict as \"$kernel_value\"."
        else
          if ! [ -e "$config_file" ] && ! sudo install --mode=644 /dev/null "$config_file"; then
            >&2 echo "Failed to create \"$config_file\"."
          else
            if grep --fixed-strings --quiet "$previous_marker" "$config_file"; then
              echo "The value found before the first change is already recorded in \"$config_file\"."
            else
              previous_value="$current_value"
              if [ -z "$previous_value" ]; then
                echo "Could not read the current value of \"$kernel_key\"; recording it as unset."
                previous_value='unset'
              fi
              printf '%s%s\n' "$previous_marker" "$previous_value" | sudo tee -a "$config_file" > /dev/null
              echo "Recorded the previous value of \"$kernel_key\" as \"$previous_value\"."
            fi
            if ! sudo sed --in-place "\|^[[:space:]]*$kernel_key[[:space:]]*=|d" "$config_file"; then
              >&2 echo "Failed to update \"$config_file\"."
            elif ! printf '%s = %s\n' "$kernel_key" "$kernel_value" | sudo tee -a "$config_file" > /dev/null; then
              >&2 echo "Failed to write \"$kernel_key\" to \"$config_file\"."
            else
              echo "Successfully persisted \"$kernel_key = $kernel_value\" in \"$config_file\"."
            fi
          fi
          if sudo sysctl --write "$kernel_key=$kernel_value" > /dev/null 2>&1; then
            echo "Successfully applied \"$kernel_key = $kernel_value\" to the running kernel."
          else
            >&2 echo "Failed to apply \"$kernel_key\" to the running kernel; it applies after a reboot."
          fi
        fi
      fi
    revertCode: |-
      kernel_key='{{ $key }}'
      kernel_revert_needs_restart='{{ with $revertNeedsRestart }}true{{ end }}'
      config_file='/etc/sysctl.d/60-privacy-sexy.conf'
      previous_marker="# privacy.sexy-previous:$kernel_key="
      previous_value=''
      if ! [ -e "$config_file" ]; then
        echo "Skipping, \"$config_file\" does not exist."
      else
        previous_value="$(grep --fixed-strings "$previous_marker" "$config_file" | head --lines=1)"
        previous_value="${previous_value#"$previous_marker"}"
        if ! sudo sed --in-place "\|^[[:space:]]*$kernel_key[[:space:]]*=|d" "$config_file"; then
          >&2 echo "Failed to remove \"$kernel_key\" from \"$config_file\"."
        else
          echo "Successfully removed \"$kernel_key\" from \"$config_file\"."
        fi
        sudo sed --in-place "\|^$previous_marker|d" "$config_file"
        if ! grep --quiet '^[[:space:]]*[^#[:space:]]' "$config_file"; then
          sudo rm --force "$config_file"
          echo "Removed \"$config_file\" because it no longer configures anything."
        fi
      fi
      if [ -z "$previous_value" ] || [ "$previous_value" = 'unset' ]; then
        echo "No previously recorded value for \"$kernel_key\", so the running value is left unchanged."
        echo 'The distribution default applies again after a reboot.'
      elif [ "$kernel_revert_needs_restart" = 'true' ]; then
        if [ "$(sysctl --values "$kernel_key" 2>/dev/null | head --lines=1)" = "$previous_value" ]; then
          echo "\"$kernel_key\" is already \"$previous_value\"."
        else
          echo "\"$kernel_key\" cannot be changed back while the system is running."
          echo "Restart your computer to return it to \"$previous_value\"."
        fi
      elif ! command -v sysctl > /dev/null 2>&1; then
        >&2 echo 'Cannot restore the kernel parameter because "sysctl" is not found.'
      elif sudo sysctl --write "$kernel_key=$previous_value" > /dev/null 2>&1; then
        echo "Successfully restored \"$kernel_key\" to its previous value \"$previous_value\"."
      else
        >&2 echo "Failed to restore \"$kernel_key\" to \"$previous_value\"."
      fi
  -
    name: DeleteFileFromUserAndRootHomeAsOwner
    # 💡 Purpose:
    #   Deletes a file from the home folder of the user who runs the script and from the home folder of
    #   root, for history files that both accounts can have.
    # ❗️ The user's copy is deleted by the user. As root, `rm` on a path inside the user's home folder
    #   follows any folder on the way that the user replaced with a symbolic link, so it could delete a
    #   file outside the home folder. Root's copy is deleted as root, which owns it. Paths stay quoted.
    parameters:
      - name: file # Path relative to the home folder, without a leading `~/`
    call:
      function: RunAsTargetUser
      parameters:
        code: |-
          home_relative_file='{{ $file }}'
          user_home_file="$HOME/$home_relative_file"
          if [ -e "$user_home_file" ] || [ -L "$user_home_file" ]; then
            if ! run_as_target_user rm -fv -- "$user_home_file"; then
              >&2 echo "Failed to delete \"$user_home_file\"."
            fi
          else
            echo "Skipping, \"$user_home_file\" does not exist."
          fi
          root_home_file="/root/$home_relative_file"
          if [ "$HOME" != '/root' ] && { [ -e "$root_home_file" ] || [ -L "$root_home_file" ]; }; then
            if ! sudo rm -fv -- "$root_home_file"; then
              >&2 echo "Failed to delete \"$root_home_file\"."
            fi
          fi
  -
    name: ClearUserDirectoryContents
    # 💡 Purpose:
    #   Deletes everything inside the given folders in the home folder of the user who runs the script,
    #   but keeps the folders themselves.
    # ❗️ Runs `find` and `rm` as that user, so nothing outside what the user can delete is touched, even
    #   if a folder inside was replaced with a symbolic link. File names reach `rm` as arguments.
    parameters:
      - name: directories # Bash words: one double-quoted folder that starts with "$HOME/" per location
    call:
      function: RunAsTargetUser
      parameters:
        code: |-
          user_directories=({{ $directories }})
          for user_directory in "${user_directories[@]}"; do
            if [ ! -d "$user_directory" ]; then
              echo "Skipping, \"$user_directory\" does not exist."
            elif run_as_target_user find -H "$user_directory" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
              echo "Cleared \"$user_directory\"."
            else
              >&2 echo "Failed to clear \"$user_directory\" completely."
            fi
          done
  -
    name: DeleteFromChromiumBasedBrowserProfiles
    # 💡 Purpose:
    #   Deletes files and folders from every profile folder (`Default`, `Profile 1`, `Profile 2`, ...)
    #   inside the given user data folders of a Chromium-based browser. Call it through
    #   `DeleteFromChromeProfiles`, `DeleteFromChromiumProfiles` or `DeleteFromBraveProfiles`, which list
    #   the folders of each installation type.
    # ❗️ `rm` runs as the user who runs the script, and every path stays quoted, so a profile folder or
    #   file name with spaces (such as `Profile 1`) or a symbolic link cannot make root delete anything else.
    parameters:
      - name: userDataDirectories # Bash words: one double-quoted folder that starts with "$HOME/" per installation type
      - name: profilePaths # Bash words: one single-quoted path relative to a profile folder per file or folder
    call:
      function: RunAsTargetUser
      parameters:
        code: |-
          browser_user_data_directories=({{ $userDataDirectories }})
          browser_profile_paths=({{ $profilePaths }})
          browser_deleted_count=0
          for browser_user_data_directory in "${browser_user_data_directories[@]}"; do
            if [ ! -d "$browser_user_data_directory" ]; then
              echo "Skipping, \"$browser_user_data_directory\" does not exist."
              continue
            fi
            for browser_profile_directory in "$browser_user_data_directory/Default" "$browser_user_data_directory/Profile "*; do
              if [ ! -d "$browser_profile_directory" ]; then
                continue # No profile folder, or the pattern matched nothing
              fi
              for browser_profile_path in "${browser_profile_paths[@]}"; do
                browser_target_path="$browser_profile_directory/$browser_profile_path"
                if [ ! -e "$browser_target_path" ] && [ ! -L "$browser_target_path" ]; then
                  continue
                fi
                if run_as_target_user rm -rf -- "$browser_target_path"; then
                  echo "Deleted \"$browser_target_path\"."
                  browser_deleted_count=$((browser_deleted_count + 1))
                else
                  >&2 echo "Failed to delete \"$browser_target_path\"."
                fi
              done
            done
          done
          echo "Deleted $browser_deleted_count file(s) or folder(s)."
  -
    name: DeleteFromChromeProfiles
    parameters:
      - name: profilePaths # Bash words: one single-quoted path relative to a profile folder per file or folder
    call:
      function: DeleteFromChromiumBasedBrowserProfiles
      parameters:
        userDataDirectories: >-
          "$HOME/.config/google-chrome"
          "$HOME/.config/google-chrome-beta"
          "$HOME/.config/google-chrome-unstable"
          "$HOME/.var/app/com.google.Chrome/config/google-chrome"
        profilePaths: '{{ $profilePaths }}'
  -
    name: DeleteFromChromiumProfiles
    parameters:
      - name: profilePaths # Bash words: one single-quoted path relative to a profile folder per file or folder
    call:
      function: DeleteFromChromiumBasedBrowserProfiles
      parameters:
        userDataDirectories: >-
          "$HOME/.config/chromium"
          "$HOME/.var/app/org.chromium.Chromium/config/chromium"
          "$HOME/snap/chromium/common/chromium"
        profilePaths: '{{ $profilePaths }}'
  -
    name: DeleteFromBraveProfiles
    parameters:
      - name: profilePaths # Bash words: one single-quoted path relative to a profile folder per file or folder
    call:
      function: DeleteFromChromiumBasedBrowserProfiles
      parameters:
        userDataDirectories: >-
          "$HOME/.config/BraveSoftware/Brave-Browser"
          "$HOME/.config/BraveSoftware/Brave-Browser-Beta"
          "$HOME/.config/BraveSoftware/Brave-Browser-Nightly"
          "$HOME/.config/BraveSoftware/Brave-Origin"
          "$HOME/.config/BraveSoftware/Brave-Origin-Beta"
          "$HOME/.config/BraveSoftware/Brave-Origin-Nightly"
          "$HOME/.var/app/com.brave.Browser/config/BraveSoftware/Brave-Browser"
        profilePaths: '{{ $profilePaths }}'
  -
    name: SetChromiumBasedBrowserPolicy
    # 💡 Purpose:
    #   Sets one mandatory policy of a Chromium-based browser by writing a JSON file to the folder that
    #   the browser reads managed policies from on Linux. Each policy gets its own file,
    #   `privacy-sexy-<policy>.json`, so reverting one policy never touches another policy or a file that
    #   someone else wrote. Call it through `SetChromePolicy` or `SetBravePolicy`.
    # ❗️ Folders that did not exist before are recorded in a state file named after the policy folder.
    #   Revert deletes the policy file only if it is unchanged, and removes the recorded folders only once
    #   the policy folder is empty again.
    # ❗️ The Flathub packages of Google Chrome and Brave link the host's policy files into their sandbox,
    #   so an installation from Flathub counts as installed too.
    #   - https://github.com/flathub/com.google.Chrome/blob/master/chrome.sh
    #   - https://github.com/flathub/com.brave.Browser/blob/master/brave.sh
    # ❗️ Revert does not check whether the browser is still installed, so a policy file is not left
    #   behind after the browser is removed.
    parameters:
      - name: browserName # Shown in messages
      - name: browserCommands # Space-separated commands; the browser counts as installed if one is found
      - name: flatpakId # Flathub application ID; its package links the host policy files into its sandbox
      - name: policyDirectory # Absolute path of the managed policy folder
      - name: policyName
      - name: jsonValue
    code: |-
      browser_name='{{ $browserName }}'
      browser_commands='{{ $browserCommands }}'
      browser_flatpak_id='{{ $flatpakId }}'
      policy_directory='{{ $policyDirectory }}'
      policy_name='{{ $policyName }}'
      policy_value='{{ $jsonValue }}'
      policy_file="$policy_directory/privacy-sexy-$policy_name.json"
      policy_content="$(printf '{\n  "%s": %s\n}' "$policy_name" "$policy_value")"
      policy_state_dir='/var/lib/privacy.sexy/state/browser-policies'
      policy_state_file="$policy_state_dir/$(printf '%s' "$policy_directory" | tr --complement '[:alnum:]._-' '_')"
      browser_installed='false'
      for browser_command in $browser_commands; do
        if command -v "$browser_command" > /dev/null 2>&1; then
          browser_installed='true'
        fi
      done
      if [ -d "/var/lib/flatpak/app/$browser_flatpak_id" ] \
          || [ -d "$HOME/.local/share/flatpak/app/$browser_flatpak_id" ]; then
        browser_installed='true' # Flathub package, system-wide or for this user
      fi
      if [ "$browser_installed" != 'true' ]; then
        echo "Skipping, $browser_name is not installed."
      elif [ -f "$policy_file" ] && [ "$(cat "$policy_file")" = "$policy_content" ]; then
        echo "Skipping, the $browser_name policy \"$policy_name\" is already set to $policy_value."
      else
        if [ ! -d "$policy_directory" ]; then
          missing_directories=()
          missing_directory="$policy_directory"
          while [ -n "$missing_directory" ] && [ ! -d "$missing_directory" ]; do
            missing_directories=("$missing_directory" "${missing_directories[@]}")
            missing_directory="${missing_directory%/*}"
          done
          sudo install --directory --mode=700 "$policy_state_dir"
          if [ ! -e "$policy_state_file" ]; then
            printf '%s\n' "${missing_directories[@]}" | sudo tee "$policy_state_file" > /dev/null
            sudo chmod 600 "$policy_state_file"
          fi
          for missing_directory in "${missing_directories[@]}"; do
            sudo mkdir --mode=755 -- "$missing_directory"
          done
        fi
        if printf '%s\n' "$policy_content" | sudo tee "$policy_file" > /dev/null \
            && sudo chmod 644 "$policy_file"; then
          echo "Successfully set the $browser_name policy \"$policy_name\" to $policy_value."
          echo "It applies the next time $browser_name starts."
        else
          >&2 echo "Failed to write \"$policy_file\"."
        fi
      fi
    revertCode: |-
      browser_name='{{ $browserName }}'
      policy_directory='{{ $policyDirectory }}'
      policy_name='{{ $policyName }}'
      policy_value='{{ $jsonValue }}'
      policy_file="$policy_directory/privacy-sexy-$policy_name.json"
      policy_content="$(printf '{\n  "%s": %s\n}' "$policy_name" "$policy_value")"
      policy_state_dir='/var/lib/privacy.sexy/state/browser-policies'
      policy_state_file="$policy_state_dir/$(printf '%s' "$policy_directory" | tr --complement '[:alnum:]._-' '_')"
      if [ ! -e "$policy_file" ]; then
        echo "Skipping, no $browser_name policy file for \"$policy_name\" was found."
      elif [ "$(cat "$policy_file")" != "$policy_content" ]; then
        >&2 echo "Skipping revert because \"$policy_file\" changed after privacy.sexy wrote it."
      elif ! sudo rm -f -- "$policy_file"; then
        >&2 echo "Failed to delete \"$policy_file\"."
      else
        echo "Successfully removed the $browser_name policy \"$policy_name\"."
        echo "It no longer applies the next time $browser_name starts."
        if [ -e "$policy_state_file" ] && [ -z "$(ls -A -- "$policy_directory" 2>/dev/null)" ]; then
          # Folders are recorded from the outermost to the innermost, so they are removed in reverse.
          sudo tac -- "$policy_state_file" | while IFS= read -r created_directory; do
            sudo rmdir -- "$created_directory" 2>/dev/null || break
          done
          sudo rm -f -- "$policy_state_file"
        fi
      fi
  -
    name: SetChromePolicy
    parameters:
      - name: policyName
      - name: jsonValue
    call:
      function: SetChromiumBasedBrowserPolicy
      parameters:
        browserName: Google Chrome
        browserCommands: google-chrome google-chrome-stable google-chrome-beta google-chrome-unstable
        flatpakId: com.google.Chrome
        policyDirectory: /etc/opt/chrome/policies/managed
        policyName: '{{ $policyName }}'
        jsonValue: '{{ $jsonValue }}'
  -
    name: SetBravePolicy
    parameters:
      - name: policyName
      - name: jsonValue
    call:
      function: SetChromiumBasedBrowserPolicy
      parameters:
        browserName: Brave
        # `brave-browser*` are the commands of Brave's own packages, `brave`, `brave-beta` and `brave-nightly`
        # those of the Arch Linux packages. Brave Origin reads the same policy folder.
        browserCommands: >-
          brave-browser brave-browser-beta brave-browser-nightly
          brave brave-beta brave-nightly
          brave-origin brave-origin-beta brave-origin-nightly
        flatpakId: com.brave.Browser
        policyDirectory: /etc/brave/policies/managed
        policyName: '{{ $policyName }}'
        jsonValue: '{{ $jsonValue }}'
  -
    name: BlockKernelModules
    # 💡 Purpose:
    #   Stops the kernel from loading the given modules by writing a dedicated file to `/etc/modprobe.d`.
    #   Each module gets two lines:
    #   - `blacklist`, so modprobe ignores the module's aliases. Automatic loading goes through aliases,
    #     both when matching hardware shows up and when the kernel requests a file system type on `mount`.
    #   - `install <module> /bin/false`, because `blacklist` does not stop loading the module by its name,
    #     for example with `modprobe <module>` or as a dependency of another module. modprobe runs
    #     `/bin/false` instead, so that load fails.
    #   Modules that are already loaded stay loaded until the next restart.
    # ❗️ An existing file with the same name but different content is never replaced, and revert deletes
    #   the file only while it still has exactly the content that privacy.sexy wrote.
    # ❗️ Why `rebuildInitramfs` exists:
    #   Debian and Ubuntu put some drivers, such as the FireWire ones, into the initial RAM disk, together
    #   with a copy of `/etc/modprobe.d` taken when it was built. Until it is rebuilt, that old copy can
    #   still load such a driver early during boot. `update-initramfs` exists on both, also where Ubuntu
    #   builds the initial RAM disk with Dracut. Without `-k`, it rebuilds the one of the newest kernel, which
    #   is the one that boots by default.
    # References:
    #   - https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    #   - https://man7.org/linux/man-pages/man8/modprobe.8.html
    #   - https://salsa.debian.org/kernel-team/initramfs-tools/-/raw/debian/latest/hook-functions
    #   - https://salsa.debian.org/kernel-team/initramfs-tools/-/raw/debian/latest/mkinitramfs
    parameters:
      - name: fileName # File name inside `/etc/modprobe.d`, ending with `.conf`
      - name: modules # Space-separated module names
      - name: rebuildInitramfs # When set, rebuilds the initial RAM disk with `update-initramfs` if it exists
        optional: true
    code: |-
      modprobe_file='/etc/modprobe.d/{{ $fileName }}'
      blocked_modules='{{ $modules }}'
      modprobe_rebuild_initramfs='{{ with $rebuildInitramfs }}true{{ end }}'
      modprobe_content='# Created by privacy.sexy'
      for blocked_module in $blocked_modules; do
        modprobe_content+=$'\n'"blacklist $blocked_module"$'\n'"install $blocked_module /bin/false"
      done
      if [ -e "$modprobe_file" ] || [ -L "$modprobe_file" ]; then
        if [ "$(cat "$modprobe_file" 2>/dev/null)" = "$modprobe_content" ]; then
          echo "Skipping, \"$modprobe_file\" already blocks these modules."
        else
          >&2 echo "Skipping, \"$modprobe_file\" already exists with different content and is not replaced."
        fi
      elif ! sudo mkdir -p /etc/modprobe.d \
          || ! printf '%s\n' "$modprobe_content" | sudo tee "$modprobe_file" > /dev/null; then
        >&2 echo "Failed to write \"$modprobe_file\"."
      else
        sudo chmod 644 "$modprobe_file"
        echo "Successfully blocked loading of: $blocked_modules."
        for blocked_module in $blocked_modules; do
          if [ -d "/sys/module/${blocked_module//-/_}" ]; then
            echo "\"$blocked_module\" is loaded right now and stays loaded until you restart your computer."
          fi
        done
        if [ "$modprobe_rebuild_initramfs" = 'true' ] && command -v update-initramfs > /dev/null 2>&1; then
          echo 'Rebuilding the initial RAM disk so that it blocks these modules during early boot too.'
          if ! sudo update-initramfs -u; then
            >&2 echo 'Failed to rebuild the initial RAM disk; the modules may still load early during boot.'
          fi
        fi
      fi
    revertCode: |-
      modprobe_file='/etc/modprobe.d/{{ $fileName }}'
      blocked_modules='{{ $modules }}'
      modprobe_rebuild_initramfs='{{ with $rebuildInitramfs }}true{{ end }}'
      modprobe_content='# Created by privacy.sexy'
      for blocked_module in $blocked_modules; do
        modprobe_content+=$'\n'"blacklist $blocked_module"$'\n'"install $blocked_module /bin/false"
      done
      if [ ! -e "$modprobe_file" ] && [ ! -L "$modprobe_file" ]; then
        echo "Skipping, \"$modprobe_file\" does not exist."
      elif [ "$(cat "$modprobe_file" 2>/dev/null)" != "$modprobe_content" ]; then
        >&2 echo "Skipping revert because \"$modprobe_file\" changed after privacy.sexy created it."
      elif sudo rm -f -- "$modprobe_file"; then
        echo "Successfully removed \"$modprobe_file\". These modules can load again: $blocked_modules."
        if [ "$modprobe_rebuild_initramfs" = 'true' ] && command -v update-initramfs > /dev/null 2>&1; then
          echo 'Rebuilding the initial RAM disk so that it no longer blocks these modules during early boot.'
          if ! sudo update-initramfs -u; then
            >&2 echo 'Failed to rebuild the initial RAM disk; run "sudo update-initramfs -u" yourself.'
          fi
        fi
      else
        >&2 echo "Failed to delete \"$modprobe_file\"."
      fi
