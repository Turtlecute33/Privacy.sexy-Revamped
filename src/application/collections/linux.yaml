                  is in the same place under `~/.cache` [1]. This gives `~/.cache/BraveSoftware/Brave-Browser` (with
                  `-Beta` and `-Nightly` for the other channels, and `Brave-Origin` for Brave Origin), and
                  `~/.var/app/com.brave.Browser/cache/BraveSoftware/Brave-Browser` for the Flathub package, because
