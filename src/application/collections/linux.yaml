                  [2]: https://web.archive.org/web/20260922150720/https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md "Chromium Docs - User Data Directory | chromium.googlesource.com"
                  [3]: https://web.archive.org/web/20261109170916/https://chromium.googlesource.com/chromium/src/+/main/chrome/browser/history/top_sites_factory.cc "chrome/browser/history/top_sites_factory.cc - chromium/src - Git at Google | chromium.googlesource.com"
