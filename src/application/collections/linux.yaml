                  [2]: https://web.archive.org/web/20261024162023/https://docs.flatpak.org/en/latest/conventions.html "Requirements & Conventions - Flatpak documentation | docs.flatpak.org"
                  [3]: https://web.archive.org/web/20250626130945/https://git.launchpad.net/~chromium-team/chromium-browser/+git/snap-from-source/tree/snapcraft.yaml?h=stable "snapcraft.yaml - ~chromium-team/chromium-browser/+git/snap-from-source | git.launchpad.net"
                  [4]: https://web.archive.org/web/20251121205746/https://github.com/canonical/snapcraft-desktop-integration/blob/main/common/desktop-exports "snapcraft-desktop-integration/common/desktop-exports at main · canonical/snapcraft-desktop-integration · GitHub | github.com"
                call:
                  -
                    function: ClearUserDirectoryContents
                    parameters:
                      directories: >-
                        "$HOME/.cache/chromium"
                        "$HOME/.var/app/org.chromium.Chromium/cache/chromium"
                        "$HOME/snap/chromium/common/.cache/chromium"
                  -
                    function: DeleteFromChromiumBasedBrowserProfiles
                    parameters:
                      userDataDirectories: '"$HOME/snap/chromium/common/chromium"'
                      profilePaths: "'Cache' 'Code Cache'"
              -
                name: Clear Chromium browsing history
                docs: |-
                  This script deletes the databases in which Chromium stores the pages you visited and data derived from
                  them, in every profile [1] [2]:

                  - `History`: the pages you visited and when [1].
                  - `Top Sites`: the most visited sites that the new tab page shows [1] [3].
                  - `Shortcuts`: the address bar suggestions you picked before, used to rank them [4].
                  - `Favicons`: the icons of the sites you visited [1].
                  - `Visited Links`: the list that older versions used to show links you already visited in a different
                    color. Current versions keep this in the `History` database instead [5].

                  It also deletes the `-journal` file that belongs to each of these databases [6].

                  If you do not run this script, Chromium keeps your browsing history until you clear it in the browser.

                  [1]: https://web.archive.org/web/20261109164754/https://chromium.googlesource.com/chromium/src/+/main/components/history/core/browser/history_constants.cc "components/history/core/browser/history_constants.cc - chromium/src - Git at Google | chromium.googlesource.com"
                  [2]: https://web.archive.org/web/20260922150720/https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md "Chromium Docs - User Data Directory | chromium.googlesource.com"
                  [3]: https://web.archive.org/web/20261109170916/https://chromium.googlesource.com/chromium/src/+/main/chrome/browser/history/top_sites_factory.cc "chrome/browser/history/top_sites_factory.cc - chromium/src - Git at Google | chromium.googlesource.com"
                  [4]: https://chromium.googlesource.com/chromium/src/+/main/components/omnibox/browser/shortcuts_constants.cc "components/omnibox/browser/shortcuts_constants.cc - chromium/src - Git at Google | chromium.googlesource.com"
                  [5]: https://web.archive.org/web/20261109170706/https://chromium.googlesource.com/chromium/src/+/main/components/visitedlink/README.md "Welcome to components/visitedlink | chromium.googlesource.com"
                  [6]: https://web.archive.org/web/20261109171239/https://chromium.googlesource.com/chromium/src/+/main/sql/database.cc "sql/database.cc - chromium/src - Git at Google | chromium.googlesource.com"
                call:
                  function: DeleteFromChromiumProfiles
                  parameters:
                    profilePaths: >-
                      'History' 'History-journal' 'Visited Links' 'Top Sites' 'Top Sites-journal' 'Shortcuts' 'Shortcuts-journal'
                      'Favicons' 'Favicons-journal'
              -
                name: Clear Chromium cookies
                docs: |-
                  Websites use cookies to keep you signed in and to recognize you, and advertising networks use them to
                  follow you across websites.

                  Chromium stores cookies in a database named `Cookies` [1]. On Linux, it stays in the profile folder by
                  default. Chromium moves network data such as cookies into a `Network` subfolder only where that migration
                  is turned on, which is the default on Windows [1] [2]. This script deletes both locations in every
                  profile, together with their `-journal` files.

