                      "$HOME/.cache/BraveSoftware/Brave-Origin"
                      "$HOME/.cache/BraveSoftware/Brave-Origin-Beta"
                      "$HOME/.cache/BraveSoftware/Brave-Origin-Nightly"
                      "$HOME/.var/app/com.brave.Browser/cache/BraveSoftware/Brave-Browser"
              -
                name: Clear Brave browsing history
