              [3]: https://web.archive.org/web/20261024162023/https://docs.flatpak.org/en/latest/conventions.html "Requirements & Conventions - Flatpak documentation | docs.flatpak.org"
              [4]: https://web.archive.org/web/20241127235314/https://github.com/flathub/org.chromium.Chromium/blob/master/chromium.sh "org.chromium.Chromium/chromium.sh at master · flathub/org.chromium.Chromium · GitHub | github.com"
              [5]: https://web.archive.org/web/20250626130945/https://git.launchpad.net/~chromium-team/chromium-browser/+git/snap-from-source/tree/snapcraft.yaml?h=stable "snapcraft.yaml - ~chromium-team/chromium-browser/+git/snap-from-source | git.launchpad.net"
            children:
              -
                name: Clear Chromium cache
                docs: |-
                  Chromium keeps copies of the pages, images and scripts it downloaded in a cache, so that websites load
                  faster the next time.

                  Chromium puts the cache in `~/.cache/chromium` when its user data folder is in `~/.config`, and in the
                  profile folder otherwise [1]. That gives these locations:

                  - `~/.cache/chromium` for the package of your distribution [1].
                  - `~/.var/app/org.chromium.Chromium/cache/chromium` for the Flathub package, because Flatpak moves the
                    cache folder into the application's own folder [2].
                  - The `Cache` and `Code Cache` folders inside each profile in `~/snap/chromium/common/chromium` for the
                    Snap package, whose user data folder is not in `~/.config` [1] [3]. The script also clears
                    `~/snap/chromium/common/.cache/chromium`, the cache folder that the Snap package sets for its
