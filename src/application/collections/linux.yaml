          -
            category: Clear Brave history
            docs: |-
              Brave is a web browser by Brave Software that is built on Chromium.

              Brave keeps your data in `~/.config/BraveSoftware/Brave-Browser`, or in `Brave-Browser-Beta` and
              `Brave-Browser-Nightly` next to it for the other channels [1] [2]. Brave Origin uses `Brave-Origin`,
